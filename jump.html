<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة القفز للموبايل</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        #score {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        canvas {
            border: 2px solid #4CAF50;
            background-color: #111;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            width: 100%;
            max-width: 360px;
            height: 250px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>لعبة القفز 🏃‍♂️</h1>
    <div id="score">النقاط: 0</div>
    <canvas id="gameCanvas" width="360" height="250"></canvas>
    <div class="instructions">اضغط في أي مكان على الشاشة للقفز وتفادي العقبة!</div>

    
</body>

</html>
