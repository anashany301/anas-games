<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاوية الألعاب الجماعية - فلامينجو 🎮</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        .loading-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 18px; color: #38bdf8; flex-direction: column; gap: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <p>⏳ جاري فتح اللعبة داخل الحاوية...</p>
    </div>

    <iframe id="gameFrame" style="display: none;"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('url');
        const gameFile = urlParams.get('game');
        const playerName = urlParams.get('name');

        // لو جاي اسم ملف مع الباراميترات
        if (gameFile) {
            targetUrl = `${window.location.origin}/${gameFile}`;
            // دمج أي باراميترات إضافية زي الـ room لو موجودة
            const queryString = window.location.search.replace('?game=' + gameFile, '');
            if (queryString) {
                targetUrl += queryString;
            }
        }

        if (targetUrl) {
            if (targetUrl.includes('%')) {
                try { targetUrl = decodeURIComponent(targetUrl); } catch(e){}
            }

            if (playerName) {
                localStorage.setItem('multiPlayerName', playerName);
            }

            const frame = document.getElementById('gameFrame');
            frame.src = targetUrl;
            
            frame.onload = function() {
                document.getElementById('loading').style.display = 'none';
                frame.style.display = 'block';
            };
        } else {
            document.getElementById('loading').innerHTML = `<p style="color: #ef4444;">❌ عذراً، رابط الحاوية غير مكتمل!</p>`;
        }
    </script>

</body>
</html>
