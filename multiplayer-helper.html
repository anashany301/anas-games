<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاوية الألعاب الجماعية - فلامينجو 🎮</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        .loading-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 18px; color: #38bdf8; flex-direction: column; gap: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <p>⏳ جاري تجهيز غرفة اللعب وتحميل اللعبة في الحاوية...</p>
    </div>

    <!-- الإطار الذي سيحتوي على اللعبة الحقيقية -->
    <iframe id="gameFrame" style="display: none;"></iframe>

    <script>
        // قراءة الباراميترات القادمة من الرابط الذكي
        const urlParams = new URLSearchParams(window.location.search);
        const gameFile = urlParams.get('game');
        const playerName = urlParams.get('name');

        if (gameFile) {
            // تخزين اسم اللاعب محلياً عشان اللعبة تقدر تستخدمه
            if (playerName) {
                localStorage.setItem('multiPlayerName', playerName);
            }

            // بناء رابط اللعبة الأساسي بناءً على الدومين الحالي
            const gameUrl = `${window.location.origin}/${gameFile}`;

            const frame = document.getElementById('gameFrame');
            frame.src = gameUrl;
            
            frame.onload = function() {
                document.getElementById('loading').style.display = 'none';
                frame.style.display = 'block';
            };
        } else {
            document.getElementById('loading').innerHTML = `<p style="color: #ef4444;">❌ عذراً، رابط الحاوية غير مكتمل أو مفقود!</p>`;
        }
    </script>

</body>
</html>
