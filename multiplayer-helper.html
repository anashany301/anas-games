<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة اللعب الجماعي المحصنة</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; color: white; font-family: Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .box { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #38bdf8; z-index: 10; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold; }
        button:hover { background: #2563eb; }
        #gameFrame { width: 100%; height: 100%; border: none; display: none; position: absolute; top: 0; left: 0; z-index: 5; }
    </style>
</head>
<body>

<div id="topRoomBtnContainer" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 999999; font-family: Tahoma, sans-serif;">
    <a href="room.html" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #60a5fa; font-size: 14px; display: inline-block;">🔑 لدخول الغرفة بالأكواد</a>
</div>









































































    <!-- استخدام sandbox لمنع أي ملف لعبة من إعادة توجيه الصفحة أو فتح لينكات خارجية خبيثة -->
    <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameFile = params.get('game') || '';

        if (!gameFile) {
            alert('خطأ: لم يتم تحديد اللعبة!');
            window.location.href = 'index.html';
        }

        function createRoom() {
            const name = document.getElementById('playerName').value.trim();
            if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            document.getElementById('codeDisplay').innerText = code;
            document.getElementById('codeBox').style.display = 'block';
            document.getElementById('joinSection').style.display = 'none';
            
            navigator.clipboard.writeText(code).catch(() => {});

            setTimeout(() => {
                loadGame(name, code);
            }, 3000);
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCode').value.trim();
            if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
            
            loadGame(name, code);
        }

        function loadGame(name, code) {
            document.getElementById('ui-container').style.display = 'none';
            const frame = document.getElementById('gameFrame');
            frame.style.display = 'block';
            
            // حقن بارامترات منع اللعبة من إظهار أي واجهات قديمة لو وجدت داخلها
            frame.src = `${gameFile}?name=${encodeURIComponent(name)}&room=${encodeURIComponent(code)}&clean=true`;
        }
    </script>
</body>
</html>
