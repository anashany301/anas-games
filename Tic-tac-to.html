<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أكس أو أونلاين (غرفة مباشرة) 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #1e293b; border: 2px solid #38bdf8; font-size: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
        .cell:hover { background: #334155; }
        .btn { padding: 12px 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 10px; }
        .btn:hover { background: #0ea5e9; }
        #status { font-size: 18px; color: #facc15; margin: 15px; }
        #restartBtn { display: none; background: #22c55e; color: white; }
        #restartBtn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <h1>لعبة أكس أو أونلاين (غرفة مباشرة) 🎮</h1>
    
    <div id="menu">
        <button class="btn" onclick="createRoom()">إنشاء غرفة جديدة ونسخ الرابط</button>
        <p id="status">اضغط على إنشاء غرفة لتبدأ أو افتح رابط صديقك المباشر.</p>
    </div>

    <div class="board" id="board" style="display:none;">
        <div class="cell" onclick="makeMove(0)"></div><div class="cell" onclick="makeMove(1)"></div><div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div><div class="cell" onclick="makeMove(4)"></div><div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div><div class="cell" onclick="makeMove(7)"></div><div class="cell" onclick="makeMove(8)"></div>
    </div>

    <!-- زرار إعادة المحاولة -->
    <button class="btn" id="restartBtn" onclick="restartGame()">لعب مرة أخرى 🔄</button>

    <!-- مكتبة الاتصال المباشر -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomToJoin = urlParams.get('room');
        
        let peer;
        let conn;
        let mySymbol = '';
        let myTurn = false;
        let board = Array(9).fill(null);
        let gameActive = false;

        const statusEl = document.getElementById('status');
        const menuEl = document.getElementById('menu');
        const boardEl = document.getElementById('board');
        const restartBtn = document.getElementById('restartBtn');

        if (roomToJoin) {
            statusEl.innerText = "جاري الاتصال بالغرفة...";
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(roomToJoin);
                mySymbol = 'O';
                myTurn = false; 
                setupConnection();
            });
        }

        function createRoom() {
            const roomId = 'anas_room_' + Math.floor(Math.random() * 10000);
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                const fullLink = window.location.origin + window.location.pathname + '?room=' + id;
                navigator.clipboard.writeText(fullLink);
                
                statusEl.innerHTML = "تم نسخ رابط الغرفة! 📋<br>ابعت الرابط لأخوك عشان يدخل معاك فوراً.<br><i>في انتظار انضمام اللاعب الثاني...</i>";
                menuEl.querySelector('button').style.display = 'none';
                mySymbol = 'X';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                myTurn = true; 
                setupConnection();
            });
        }

        function setupConnection() {
            gameActive = true;
            menuEl.style.display = 'none';
            boardEl.style.display = 'grid';
            statusEl.innerText = mySymbol === 'X' ? "دورك أنت (X)" : "دور خصمك، انتظر قليلاً...";

            conn.on('data', (data) => {
                if (data === 'RESTART') {
                    // لو الخصم طلب إعادة المحاولة
                    resetBoardState();
                    return;
                }

                let opponentSymbol = mySymbol === 'X' ? 'O' : 'X';
                board[data] = opponentSymbol;
                updateBoard();
                myTurn = true;
                statusEl.innerText = "دورك الآن (" + mySymbol + ")";
                checkWin();
            });
        }

        function makeMove(index) {
            if (!gameActive || !myTurn || board[index]) return;

            board[index] = mySymbol;
            conn.send(index);
            updateBoard();
            myTurn = false;
            statusEl.innerText = "دور خصمك...";
            checkWin();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => cells[i].innerText = val || '');
        }

        function checkWin() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) {
                    statusEl.innerText = "الفائز هو: " + board[w[0]] + " 🎉";
                    gameActive = false;
                    restartBtn.style.display = 'inline-block';
                    return;
                }
            }
            if (!board.includes(null)) {
                statusEl.innerText = "تعادل! 🤝";
                gameActive = false;
                restartBtn.style.display = 'inline-block';
            }
        }

        function restartGame() {
            // نبلغ الخصم إننا دوسنا إعادة محاولة
            conn.send('RESTART');
            resetBoardState();
        }

        function resetBoardState() {
            board = Array(9).fill(null);
            updateBoard();
            gameActive = true;
            restartBtn.style.display = 'none';
            
            // اللاعب X يبدأ الأول دايمًا في الجيم الجديد، أو بنبدل الأدوار حسب مين أنشأ
            if (mySymbol === 'X') {
                myTurn = true;
                statusEl.innerText = "دورك أنت (X)";
            } else {
                myTurn = false;
                statusEl.innerText = "دور خصمك، انتظر قليلاً...";
            }
        }
    </script>
</body>
</html>
