<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أكس أو أونلاين 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        .scoreboard { display: flex; justify-content: center; gap: 20px; margin: 15px auto; font-size: 18px; background: #1e293b; padding: 10px; border-radius: 10px; border: 1px solid #38bdf8; max-width: 400px; }
        .score-box { color: #facc15; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 15px; }
        .cell { width: 100px; height: 100px; background: #1e293b; border: 2px solid #38bdf8; font-size: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
        .cell:hover { background: #334155; }
        .btn { padding: 12px 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 10px; }
        .btn:hover { background: #0ea5e9; }
        input { padding: 10px; border-radius: 5px; border: none; margin: 5px; text-align: center; font-size: 16px; width: 200px; }
        #status { font-size: 18px; color: #facc15; margin: 15px; }
        #restartBtn { display: none; background: #22c55e; color: white; }
    </style>
</head>
<body>
    <h1>لعبة أكس أو أونلاين 🎮</h1>

    <div id="menu">
        <p id="status">اكتب اسمك أولاً لتبدأ اللعبة:</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا" value=""><br>
        <div id="actionButtons"></div>
    </div>

    <!-- عداد النقاط المُصحح بدقة -->
    <div class="scoreboard" id="scoreboard" style="display:none;">
        <div><span id="nameX">اللاعب X</span> (<span id="scoreX" class="score-box">0</span>)</div>
        <div>-</div>
        <div><span id="nameO">اللاعب O</span> (<span id="scoreO" class="score-box">0</span>)</div>
    </div>

    <div class="board" id="board" style="display:none;">
        <div class="cell" onclick="makeMove(0)"></div><div class="cell" onclick="makeMove(1)"></div><div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div><div class="cell" onclick="makeMove(4)"></div><div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div><div class="cell" onclick="makeMove(7)"></div><div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button class="btn" id="restartBtn" onclick="restartGame()">لعب جولة جديدة 🔄</button>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomToJoin = urlParams.get('room');
        
        let peer;
        let conn;
        let mySymbol = '';
        let myName = '';
        let opponentName = 'الخصم';
        let myTurn = false;
        let board = Array(9).fill(null);
        let gameActive = false;
        let scoreX = 0;
        let scoreO = 0;

        const statusEl = document.getElementById('status');
        const menuEl = document.getElementById('menu');
        const actionButtonsEl = document.getElementById('actionButtons');
        const boardEl = document.getElementById('board');
        const scoreboardEl = document.getElementById('scoreboard');
        const restartBtn = document.getElementById('restartBtn');

        if (roomToJoin) {
            statusEl.innerText = "أنت تنضم لصديق، اكتب اسمك واضغط انضمام:";
            actionButtonsEl.innerHTML = `<button class="btn" onclick="joinRoomAction()">انضم للغرفة</button>`;
        } else {
            statusEl.innerText = "أنت تنشئ غرفة جديدة، اكتب اسمك واضغط إنشاء:";
            actionButtonsEl.innerHTML = `<button class="btn" onclick="createRoomAction()">إنشاء غرفة جديدة ونسخ الرابط</button>`;
        }

        function createRoomAction() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) { alert("من فضلك اكتب اسمك الأول!"); return; }
            
            const roomId = 'anas_room_' + Math.floor(Math.random() * 10000);
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                const fullLink = window.location.origin + window.location.pathname.replace('tic-tac-to.html', 'tic-tac-to.html') + '?room=' + id;
                navigator.clipboard.writeText(fullLink);
                
                statusEl.innerHTML = "تم نسخ رابط الغرفة! 📋<br><b>ابعت الرابط لأخوك الآن.</b><br><i>في انتظار انضمام الطرف الثاني...</i>";
                actionButtonsEl.style.display = 'none';
                document.getElementById('playerName').style.display = 'none';
                mySymbol = 'X';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                myTurn = true;
                setupConnection();
            });
        }

        function joinRoomAction() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) { alert("من فضلك اكتب اسمك الأول!"); return; }

            statusEl.innerText = "جاري الاتصال بالغرفة...";
            actionButtonsEl.style.display = 'none';
            document.getElementById('playerName').style.display = 'none';

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(roomToJoin);
                mySymbol = 'O';
                myTurn = false;
                
                conn.on('open', () => {
                    conn.send({ type: 'NAME', name: myName });
                    setupConnection();
                });
            });
        }

        function setupConnection() {
            gameActive = true;
            menuEl.style.display = 'none';
            scoreboardEl.style.display = 'flex';
            boardEl.style.display = 'grid';

            conn.on('data', (data) => {
                if (typeof data === 'object' && data.type === 'NAME') {
                    opponentName = data.name;
                    updateNamesDisplay();
                    return;
                }

                if (data === 'RESTART') {
                    resetBoardState();
                    return;
                }

                let opponentSymbol = mySymbol === 'X' ? 'O' : 'X';
                board[data] = opponentSymbol;
                updateBoard();
                myTurn = true;
                statusEl.innerText = "دورك الآن (" + myName + ")";
                checkWin();
            });

            if (mySymbol === 'X') {
                setTimeout(() => {
                    conn.send({ type: 'NAME', name: myName });
                }, 500);
            }

            updateNamesDisplay();
        }

        function updateNamesDisplay() {
            if (mySymbol === 'X') {
                document.getElementById('nameX').innerText = myName;
                document.getElementById('nameO').innerText = opponentName;
            } else {
                document.getElementById('nameX').innerText = opponentName;
                document.getElementById('nameO').innerText = myName;
            }
        }

        function makeMove(index) {
            if (!gameActive || !myTurn || board[index]) return;

            board[index] = mySymbol;
            conn.send(index);
            updateBoard();
            myTurn = false;
            statusEl.innerText = "دور خصمك...";
            checkWin();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => cells[i].innerText = val || '');
        }

        function checkWin() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) {
                    let winnerSymbol = board[w[0]];
                    if (winnerSymbol === 'X') scoreX++; else scoreO++;
                    
                    if (winnerSymbol === mySymbol) {
                        statusEl.innerText = "تهانينا! لقد فزت في هذه الجولة 🎉";
                    } else {
                        statusEl.innerText = "فاز خصمك في هذه الجولة 😢";
                    }
                    
                    document.getElementById('scoreX').innerText = scoreX;
                    document.getElementById('scoreO').innerText = scoreO;
                    
                    gameActive = false;
                    restartBtn.style.display = 'inline-block';
                    return;
                }
            }
            if (!board.includes(null)) {
                statusEl.innerText = "تعادل في هذه الجولة! 🤝";
                gameActive = false;
                restartBtn.style.display = 'inline-block';
            }
        }

        function restartGame() {
            conn.send('RESTART');
            resetBoardState();
        }

        function resetBoardState() {
            board = Array(9).fill(null);
            updateBoard();
            gameActive = true;
            restartBtn.style.display = 'none';
            if (mySymbol === 'X') {
                myTurn = true;
                statusEl.innerText = "دورك أنت (" + myName + ")";
            } else {
                myTurn = false;
                statusEl.innerText = "دور خصمك، انتظر قليلاً...";
            }
        }
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>

































</body>

</html>
