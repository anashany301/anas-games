<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أكس أو أونلاين 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #1e293b; border: 2px solid #38bdf8; font-size: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #controls { margin-top: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #38bdf8; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لعبة أكس أو أونلاين 🎮</h1>
    <div id="controls">
        <p>الـ ID الخاص بك: <b id="myId">جاري التحميل...</b></p>
        <input type="text" id="targetId" placeholder="ضع ID صديقك هنا">
        <button onclick="connectToPeer()">اتصال بصديق</button>
    </div>

    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div><div class="cell" onclick="makeMove(1)"></div><div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div><div class="cell" onclick="makeMove(4)"></div><div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div><div class="cell" onclick="makeMove(7)"></div><div class="cell" onclick="makeMove(8)"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        let conn;
        let mySymbol = 'X';
        let board = Array(9).fill(null);

        peer.on('open', id => document.getElementById('myId').innerText = id);

        function connectToPeer() {
            const targetId = document.getElementById('targetId').value;
            conn = peer.connect(targetId);
            mySymbol = 'O'; // اللي بيتصل هو O
            setupConnection();
        }

        peer.on('connection', c => { conn = c; setupConnection(); });

        function setupConnection() {
            conn.on('data', data => {
                board[data] = mySymbol === 'X' ? 'O' : 'X';
                updateBoard();
            });
        }

        function makeMove(index) {
            if (!conn || board[index]) return;
            board[index] = mySymbol;
            conn.send(index);
            updateBoard();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => cells[i].innerText = val || '');
        }
    </script>
</body>
</html>
