<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج - أونلاين ♟️</title>
    <!-- مكتبة الشطرنج الشهيرة لسهولة الحركة والتحقق -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 10px; max-width: 450px; margin: 20px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        
        .scoreboard { font-size: 17px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; background: #0f172a; padding: 12px; border-radius: 5px; border: 1px dashed #38bdf8; }
        
        #board {
            width: 350px;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <h1>♟️ شطرنج الأساطير (أونلاين) 👑</h1>

    <!-- شاشة إدخال الاسم -->
    <div id="setupScreen" class="box">
        <p>أنشئ غرفة شطرنج وتحدى صاحبك!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." />
        <br>
        <button onclick="createRoom()">إنشاء غرفة ونسخ الرابط 🔗</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="box hidden" style="max-width: 500px;">
        
        <div class="scoreboard" id="scoreboardText">
            النتيجة: أنت (0 🏆) - (0 🏆) الخصم
        </div>

        <h2 id="statusText" style="font-size: 15px; color: #cbd5e1;">في انتظار انضمام اللاعب الثاني... ⏳</h2>

        <div id="playArea" class="hidden">
            <!-- رقعة الشطرنج -->
            <div id="board"></div>
            <h2 id="turnText" style="margin-top: 15px; font-size: 16px; color: #38bdf8;"></h2>
        </div>
    </div>

    <!-- مكتبات الشطرنج و الاتصال -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myScore = 0;
        let opponentScore = 0;
        
        let board = null;
        let game = new Chess();
        let myColor = 'white'; // الـ Host أبيض، الضيف أسود

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            myColor = 'white';
            peer = new Peer();
            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك يا بطل! اكتب اسمك للانضمام للشطرنج:");
                if(!name) return;
                myName = name;
                myColor = 'black'; // الضيف أسود

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! المعركة بدأت ♟️🔥";
            document.getElementById('playArea').classList.remove('hidden');
            
            initBoard();

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateScoreboard();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك" });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    updateScoreboard();
                } else if(data.type === 'move') {
                    game.move(data.move);
                    board.position(game.fen());
                    updateTurn();
                }
            });
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: ${myName} (${myScore} 🏆) - (${opponentScore} 🏆) ${opponentName}`;
        }

        function initBoard() {
            let config = {
                draggable: true,
                position: 'start',
                orientation: myColor,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);
            updateTurn();
        }

        function onDragStart(source, piece, position, orientation) {
            // منع تحريك قطع الخصم أو لو اللعبة انتهت
            if (game.game_over()) return false;
            if ((myColor === 'white' && piece.search(/^b/) !== -1) ||
                (myColor === 'black' && piece.search(/^w/) !== -1)) {
                return false;
            }
            // منع اللعب لو مش دورك
            if ((myColor === 'white' && game.turn() === 'b') ||
                (myColor === 'black' && game.turn() === 'w')) {
                return false;
            }
        }

        function onDrop(source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' // ترقية العبدة لوزير أوتوماتيك
            });

            if (move === null) return 'snapback';

            // إرسال الحركة للخصم
            conn.send({ type: 'move', move: move });
            updateTurn();
            checkGameStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function updateTurn() {
            let turnStr = (game.turn() === 'w') ? "الأبيض" : "الأسود";
            document.getElementById('turnText').innerText = `دور اللاعب بالقطع: ${turnStr} 🎯`;
        }

        function checkGameStatus() {
            if (game.in_checkmate()) {
                alert("كش مات! انتهت اللعبة 🏆");
                myScore++;
                updateScoreboard();
            } else if (game.in_draw()) {
                alert("تعادل! 🤝");
            }
        }
    </script>
</body>
</html>
