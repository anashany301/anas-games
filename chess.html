<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج - أونلاين ♟️</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 10px; margin: 0; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 15px; border-radius: 10px; max-width: 420px; margin: 10px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        
        .scoreboard { font-size: 15px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; background: #0f172a; padding: 8px; border-radius: 5px; border: 1px dashed #38bdf8; }
        
        #chessBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 340px;
            height: 340px;
            margin: 10px auto;
            border: 3px solid #38bdf8;
            border-radius: 5px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }

        .light { background: #e2e8f0; color: #0f172a; }
        .dark { background: #475569; color: #f8fafc; }
        .square.selected { background: #38bdf8 !important; }
    </style>
</head>
<body>

    <h1>♟️ شطرنج الأساطير (أونلاين) 👑</h1>

    <!-- شاشة إدخال الاسم -->
    <div id="setupScreen" class="box">
        <p>أنشئ غرفة شطرنج وتحدى صاحبك!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." />
        <br>
        <button onclick="createRoom()">إنشاء غرفة ونسخ الرابط 🔗</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="box hidden">
        
        <div class="scoreboard" id="scoreboardText">
            النتيجة: أنت (0 🏆) - (0 🏆) الخصم
        </div>

        <h2 id="statusText" style="font-size: 14px; color: #cbd5e1;">في انتظار انضمام اللاعب الثاني... ⏳</h2>

        <div id="playArea" class="hidden">
            <!-- رقعة الشطرنج -->
            <div id="chessBoard"></div>
            <h2 id="turnText" style="margin-top: 10px; font-size: 15px; color: #38bdf8;"></h2>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myScore = 0;
        let opponentScore = 0;
        let myColor = 'white';

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        const piecesUnicode = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            '': ''
        };

        let turn = 'white';
        let selectedSquare = null;

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            myColor = 'white';
            peer = new Peer();
            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك يا بطل! اكتب اسمك للانضمام للشطرنج:");
                if(!name) return;
                myName = name;
                myColor = 'black';

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! المعركة بدأت ♟️🔥";
            document.getElementById('playArea').classList.remove('hidden');
            renderBoard();

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateScoreboard();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك" });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    updateScoreboard();
                } else if(data.type === 'move') {
                    board = data.board;
                    turn = data.turn;
                    renderBoard();
                }
            });
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: ${myName} (${myScore} 🏆) - (${opponentScore} 🏆) ${opponentName}`;
        }

        function renderBoard() {
            let boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = "";

            let isBlackView = (myColor === 'black');

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let row = isBlackView ? 7 - r : r;
                    let col = isBlackView ? 7 - c : c;

                    let square = document.createElement('div');
                    // تثبيت نمط الألوان للمربعات بغض النظر عن زاوية الرؤية
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    let piece = board[row][col];
                    square.innerText = piecesUnicode[piece] || "";

                    if (selectedSquare && selectedSquare.r === row && selectedSquare.c === col) {
                        square.classList.add('selected');
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardEl.appendChild(square);
                }
            }

            document.getElementById('turnText').innerText = (turn === myColor) ? "دورك في اللعب 🎯" : `دور الخصم (${opponentName}) ⏳`;
        }

        function handleSquareClick(r, c) {
            if (turn !== myColor) return;

            let piece = board[r][c];
            let isMyPiece = (myColor === 'white' && piece === piece.toUpperCase() && piece !== '') ||
                            (myColor === 'black' && piece === piece.toLowerCase() && piece !== '');

            if (isMyPiece) {
                selectedSquare = {r, c};
                renderBoard();
            } else if (selectedSquare) {
                board[r][c] = board[selectedSquare.r][selectedSquare.c];
                board[selectedSquare.r][selectedSquare.c] = '';
                
                selectedSquare = null;
                turn = (turn === 'white') ? 'black' : 'white';

                renderBoard();
                conn.send({ type: 'move', board: board, turn: turn });
            }
        }
    </script>
</body>
</html>
