<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج - أونلاين ♟️</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 10px; margin: 0; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 15px; border-radius: 10px; max-width: 420px; margin: 10px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        
        .scoreboard { font-size: 15px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; background: #0f172a; padding: 8px; border-radius: 5px; border: 1px dashed #38bdf8; }
        
        #chessBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 340px;
            height: 340px;
            margin: 10px auto;
            border: 3px solid #38bdf8;
            border-radius: 5px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }

        .light { background: #e2e8f0; color: #0f172a; }
        .dark { background: #475569; color: #f8fafc; }
        .square.selected { background: #38bdf8 !important; }
    </style>
</head>
<body>

<div id="topRoomBtnContainer" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 999999; font-family: Tahoma, sans-serif;">
    <a href="room.html" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #60a5fa; font-size: 14px; display: inline-block;">🔑 لدخول الغرفة بالأكواد</a>
</div>

























    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myScore = 0;
        let opponentScore = 0;
        let myColor = 'white';

        // المصفوفة الأساسية المظبوطة من منظور الأبيض
        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        const piecesUnicode = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            '': ''
        };

        let turn = 'white';
        let selectedSquare = null;

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            myColor = 'white';
            peer = new Peer();
            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك يا بطل! اكتب اسمك للانضمام للشطرنج:");
                if(!name) return;
                myName = name;
                myColor = 'black';

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! المعركة بدأت ♟️🔥";
            document.getElementById('playArea').classList.remove('hidden');
            renderBoard();

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateScoreboard();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك", board: board, turn: turn });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    board = data.board; // استقبال المصفوفة مضبوطة
                    turn = data.turn;
                    updateScoreboard();
                    renderBoard();
                } else if(data.type === 'move') {
                    board = data.board;
                    turn = data.turn;
                    renderBoard();
                }
            });
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: ${myName} (${myScore} 🏆) - (${opponentScore} 🏆) ${opponentName}`;
        }

        function renderBoard() {
            let boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = "";

            let isBlackView = (myColor === 'black');

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let square = document.createElement('div');
                    
                    // تلوين المربعات بانتظام ثابت
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    // لو اللاعب أسود، بنعكس الصف والعمود في العرض وفي الضغطات عشان يشوف قطعه تحت وعساكره مظبوطة
                    let row = isBlackView ? 7 - r : r;
                    let col = isBlackView ? 7 - c : c;

                    let piece = board[row][col];
                    square.innerText = piecesUnicode[piece] || "";

                    if (selectedSquare && selectedSquare.r === row && selectedSquare.c === col) {
                        square.classList.add('selected');
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardEl.appendChild(square);
                }
            }

            document.getElementById('turnText').innerText = (turn === myColor) ? "دورك في اللعب 🎯" : `دور الخصم (${opponentName}) ⏳`;
        }

        function handleSquareClick(r, c) {
            if (turn !== myColor) return;

            let row = r;
            let col = c;

            let piece = board[row][col];
            let isMyPiece = (myColor === 'white' && piece === piece.toUpperCase() && piece !== '') ||
                            (myColor === 'black' && piece === piece.toLowerCase() && piece !== '');

            if (isMyPiece) {
                selectedSquare = {r: row, c: col};
                renderBoard();
            } else if (selectedSquare) {
                board[row][col] = board[selectedSquare.r][selectedSquare.c];
                board[selectedSquare.r][selectedSquare.c] = '';
                
                selectedSquare = null;
                turn = (turn === 'white') ? 'black' : 'white';

                renderBoard();
                conn.send({ type: 'move', board: board, turn: turn });
            }
        }
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>

































</body>

</html>
