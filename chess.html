<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج - أونلاين ♟️</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 10px; margin: 0; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 15px; border-radius: 10px; max-width: 420px; margin: 10px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        
        .scoreboard { font-size: 15px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; background: #0f172a; padding: 8px; border-radius: 5px; border: 1px dashed #38bdf8; }
        
        #chessBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 340px;
            height: 340px;
            margin: 10px auto;
            border: 3px solid #38bdf8;
            border-radius: 5px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }

        .light { background: #e2e8f0; color: #0f172a; }
        .dark { background: #475569; color: #f8fafc; }
        .square.selected { background: #38bdf8 !important; }
    </style>
</head>
<body>

<div id="topRoomBtnContainer" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 999999; font-family: Tahoma, sans-serif;">
    <a href="room.html" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #60a5fa; font-size: 14px; display: inline-block;">🔑 لدخول الغرفة بالأكواد</a>
</div>




<script>
    function goToWaitingScreen() {
        const name = document.getElementById('cPlayerName').value.trim();
        if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
        
        // توليد الكود
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('cGeneratedCode').innerText = code;
        
        // نسخ الكود للحافظة
        navigator.clipboard.writeText(code).catch(() => {});
        
        // إخفاء الشاشة الأولى والانتقال حصرياً لشاشة الانتظار الثابتة الثانية
        document.getElementById('stepOneBox').style.display = 'none';
        document.getElementById('stepTwoWaitingBox').style.display = 'block';
    }

    function cJoin() {
        const name = document.getElementById('cPlayerName').value.trim();
        const code = document.getElementById('cCodeInput').value.trim();
        if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
        
        // لو ضغط انضمام لكود صديقه، يدخل اللعبة مباشرة
        document.getElementById('cleanRoomOverlay').style.display = 'none';
    }
</script>




</div>

<script>
    function sCreate() {
        const name = document.getElementById('sPlayerName').value.trim();
        if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        document.getElementById('sGeneratedCode').innerText = code;
        document.getElementById('sCodeBox').style.display = 'block';
        document.getElementById('sJoinSection').style.display = 'none';
        
        navigator.clipboard.writeText(code).catch(() => {});

        setTimeout(() => {
            document.getElementById('smartRoomOverlay').style.display = 'none';
        }, 3500);
    }

    function sJoin() {
        const name = document.getElementById('sPlayerName').value.trim();
        const code = document.getElementById('sCodeInput').value.trim();
        if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
        document.getElementById('smartRoomOverlay').style.display = 'none';
    }
</script>



<div id="oneTimeOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 999999; display: flex; align-items: center; justify-content: center; font-family: Tahoma, sans-serif; color: white; direction: rtl;">
    <div style="background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #38bdf8;">
        <h3 style="color: #38bdf8; margin-top: 0;">غرفة اللعب الجماعي</h3>
        <input type="text" id="otName" placeholder="اكتب اسمك هنا" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <button onclick="otCreate()" style="background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">إنشاء غرفة جديدة</button>
        <div id="otCodeBox" style="color: #38bdf8; font-weight: bold; margin: 12px 0; font-size: 20px; letter-spacing: 2px; display:none;">
            كود الغرفة: <span id="otGeneratedCode" style="color: #10b981;"></span>
            <p style="font-size: 11px; color: #cbd5e1; margin: 5px 0 0 0;">انسخ الكود وابعت لصاحبك، جاري دخول اللعبة...</p>
        </div>
        <div id="otJoinSection" style="margin-top: 10px;">
            <input type="text" id="otCodeInput" placeholder="أدخل كود صديقك" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
            <button onclick="otJoin()" style="background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">دخول اللعبة</button>
        </div>
    </div>
</div>

<script>
    function otCreate() {
        const name = document.getElementById('otName').value.trim();
        if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        document.getElementById('otGeneratedCode').innerText = code;
        document.getElementById('otCodeBox').style.display = 'block';
        document.getElementById('otJoinSection').style.display = 'none';
        
        // تختفي الواجهة تماماً بعد 3 ثواني وتدخل اللعبة للأبد
        setTimeout(() => {
            document.getElementById('oneTimeOverlay').style.display = 'none';
        }, 3500);
    }

    function otJoin() {
        const name = document.getElementById('otName').value.trim();
        const code = document.getElementById('otCodeInput').value.trim();
        if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
        
        // تختفي الواجهة فوراً وتدخل اللعبة
        document.getElementById('oneTimeOverlay').style.display = 'none';
    }
</script>











    <h1>♟️ شطرنج الأساطير (أونلاين) 👑</h1>

    
    <div id="setupScreen" class="box">
        <p>أنشئ غرفة شطرنج وتحدى صاحبك!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." />
        <br>
        <button onclick="createRoom()">إنشاء غرفة ونسخ الرابط 🔗</button>
    </div>

    
    <div id="gameScreen" class="box hidden">
        
        <div class="scoreboard" id="scoreboardText">
            النتيجة: أنت (0 🏆) - (0 🏆) الخصم
        </div>

        <h2 id="statusText" style="font-size: 14px; color: #cbd5e1;">في انتظار انضمام اللاعب الثاني... ⏳</h2>

        <div id="playArea" class="hidden">
            
            <div id="chessBoard"></div>
            <h2 id="turnText" style="margin-top: 10px; font-size: 15px; color: #38bdf8;"></h2>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myScore = 0;
        let opponentScore = 0;
        let myColor = 'white';

        // المصفوفة الأساسية المظبوطة من منظور الأبيض
        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        const piecesUnicode = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            '': ''
        };

        let turn = 'white';
        let selectedSquare = null;

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            myColor = 'white';
            peer = new Peer();
            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك يا بطل! اكتب اسمك للانضمام للشطرنج:");
                if(!name) return;
                myName = name;
                myColor = 'black';

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! المعركة بدأت ♟️🔥";
            document.getElementById('playArea').classList.remove('hidden');
            renderBoard();

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateScoreboard();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك", board: board, turn: turn });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    board = data.board; // استقبال المصفوفة مضبوطة
                    turn = data.turn;
                    updateScoreboard();
                    renderBoard();
                } else if(data.type === 'move') {
                    board = data.board;
                    turn = data.turn;
                    renderBoard();
                }
            });
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: ${myName} (${myScore} 🏆) - (${opponentScore} 🏆) ${opponentName}`;
        }

        function renderBoard() {
            let boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = "";

            let isBlackView = (myColor === 'black');

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let square = document.createElement('div');
                    
                    // تلوين المربعات بانتظام ثابت
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    // لو اللاعب أسود، بنعكس الصف والعمود في العرض وفي الضغطات عشان يشوف قطعه تحت وعساكره مظبوطة
                    let row = isBlackView ? 7 - r : r;
                    let col = isBlackView ? 7 - c : c;

                    let piece = board[row][col];
                    square.innerText = piecesUnicode[piece] || "";

                    if (selectedSquare && selectedSquare.r === row && selectedSquare.c === col) {
                        square.classList.add('selected');
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardEl.appendChild(square);
                }
            }

            document.getElementById('turnText').innerText = (turn === myColor) ? "دورك في اللعب 🎯" : `دور الخصم (${opponentName}) ⏳`;
        }

        function handleSquareClick(r, c) {
            if (turn !== myColor) return;

            let row = r;
            let col = c;

            let piece = board[row][col];
            let isMyPiece = (myColor === 'white' && piece === piece.toUpperCase() && piece !== '') ||
                            (myColor === 'black' && piece === piece.toLowerCase() && piece !== '');

            if (isMyPiece) {
                selectedSquare = {r: row, c: col};
                renderBoard();
            } else if (selectedSquare) {
                board[row][col] = board[selectedSquare.r][selectedSquare.c];
                board[selectedSquare.r][selectedSquare.c] = '';
                
                selectedSquare = null;
                turn = (turn === 'white') ? 'black' : 'white';

                renderBoard();
                conn.send({ type: 'move', board: board, turn: turn });
            }
        }
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
