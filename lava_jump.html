
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الصعود بالعرض - تحكم سريع 🔥</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .ui {
            position: absolute;
            top: 15px;
            right: 25px;
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
        }
        /* أزرار التحكم السريعة على الجانبين */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }
        .ctrl-btn {
            pointer-events: auto;
            width: 90px;
            height: 60px;
            background: rgba(56, 189, 248, 0.3);
            border: 2px solid #38bdf8;
            color: white;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: rgba(56, 189, 248, 0.7);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e293b;
        }
    </style>
</head>
<body>

    <div class="ui">الارتفاع: <span id="score">0</span></div>

    <!-- أزرار التحكم يمين ويسار -->
    <div class="controls-bar">
        <div class="ctrl-btn" id="leftBtn">⬅️</div>
        <div class="ctrl-btn" id="rightBtn">➡️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    
</body>

</html>
