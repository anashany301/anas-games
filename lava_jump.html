
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الصعود بالعرض - تحكم سريع 🔥</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .ui {
            position: absolute;
            top: 15px;
            right: 25px;
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
        }
        /* أزرار التحكم السريعة على الجانبين */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }
        .ctrl-btn {
            pointer-events: auto;
            width: 90px;
            height: 60px;
            background: rgba(56, 189, 248, 0.3);
            border: 2px solid #38bdf8;
            color: white;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: rgba(56, 189, 248, 0.7);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e293b;
        }
    </style>
</head>
<body>

    <div class="ui">الارتفاع: <span id="score">0</span></div>

    <!-- أزرار التحكم يمين ويسار -->
    <div class="controls-bar">
        <div class="ctrl-btn" id="leftBtn">⬅️</div>
        <div class="ctrl-btn" id="rightBtn">➡️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let gameRunning = true;

        // الكرة
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            r: 14,
            dx: 0,
            dy: 0,
            speed: 6,
            jumpForce: -11,
            gravity: 0.45
        };

        // الحمم من الأسفل
        const lava = {
            y: canvas.height + 60,
            speed: 0.6
        };

        // الطبقات بالعرض
        let platforms = [];
        function initPlatforms() {
            platforms = [];
            let numPlatforms = 10;
            let gap = 90;
            for (let i = 0; i < numPlatforms; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - 130),
                    y: canvas.height - 80 - (i * gap),
                    w: 120,
                    h: 15
                });
            }
        }
        initPlatforms();

        // متغيرات الحركة بالأزرار
        let movingLeft = false;
        let movingRight = false;

        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        // ربط الأزرار باللمس والضغط بدقة
        leftBtn.addEventListener("touchstart", () => { movingLeft = true; });
        leftBtn.addEventListener("touchend", () => { movingLeft = false; });
        leftBtn.addEventListener("mousedown", () => { movingLeft = true; });
        leftBtn.addEventListener("mouseup", () => { movingLeft = false; });

        rightBtn.addEventListener("touchstart", () => { movingRight = true; });
        rightBtn.addEventListener("touchend", () => { movingRight = false; });
        rightBtn.addEventListener("mousedown", () => { movingRight = true; });
        rightBtn.addEventListener("mouseup", () => { movingRight = false; });

        // تحكم بالكيبورد أيضاً لو حابب تلعب من الكمبيوتر
        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowLeft") movingLeft = true;
            if (e.code === "ArrowRight") movingRight = true;
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowLeft") movingLeft = false;
            if (e.code === "ArrowRight") movingRight = false;
        });

        function update() {
            if (!gameRunning) return;

            // حركة يمين ويسار بالسرعة المطلوبة
            if (movingLeft) ball.x -= ball.speed;
            if (movingRight) ball.x += ball.speed;

            // منع الكرة من الخروج من جانبي الشاشة (تعدي من الجانب تظهر من الجانب الآخر)
            if (ball.x < 0) ball.x = canvas.width;
            if (ball.x > canvas.width) ball.x = 0;

            // الجاذبية وحركة الكرة
            ball.dy += ball.gravity;
            ball.y += ball.dy;

            // الحمم تصعد
            lava.y -= lava.speed;

            // تتبع الكاميرا
            if (ball.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - ball.y;
                ball.y += diff;
                lava.y += diff;
                platforms.forEach(p => p.y += diff);
                
                score += Math.floor(diff);
                scoreEl.textContent = Math.floor(score / 10);
                
                lava.speed = 0.6 + (score / 4000);
            }

            // الاصطدام بالطبقات (تقفز تلقائياً بمجرد ما تلمس الطبقة وهي نازلة)
            platforms.forEach(p => {
                if (
                    ball.dy > 0 &&
                    ball.x + ball.r > p.x &&
                    ball.x - ball.r < p.x + p.w &&
                    ball.y + ball.r >= p.y &&
                    ball.y + ball.r <= p.y + p.h + 5
                ) {
                    ball.y = p.y - ball.r;
                    ball.dy = ball.jumpForce; // قفزة تلقائية ممتعة جداً
                }
            });

            // توليد طبقات جديدة من الأعلى
            let highestPlatform = Math.min(...platforms.map(p => p.y));
            if (highestPlatform > 40) {
                platforms.push({
                    x: Math.random() * (canvas.width - 130),
                    y: highestPlatform - 90,
                    w: 120,
                    h: 15
                });
            }

            // تنظيف الطبقات اللي نزلت تحت
            platforms = platforms.filter(p => p.y < canvas.height + 50);

            // شرط الخسارة
            if (ball.y >= lava.y || ball.y > canvas.height + 50) {
                gameRunning = false;
                alert("حرقتك الحمم! 🔥 مجموع نقاطك: " + Math.floor(score / 10));
                location.reload();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الطبقات
            ctx.fillStyle = "#38bdf8";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // رسم الكرة
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();

            // رسم الحمم البركانية
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(0, lava.y, canvas.width, canvas.height * 2);
            
            ctx.fillStyle = "rgba(244, 63, 94, 0.5)";
            ctx.fillRect(0, lava.y - 20, canvas.width, 20);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
</body>

</html>
