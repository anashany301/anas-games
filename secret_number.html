<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حزر الرقم الخفي - أونلاين 🔢</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        .scoreboard { font-size: 18px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; background: #0f172a; padding: 10px; border-radius: 5px; border: 1px dashed #38bdf8; }
        .hint-box { font-size: 20px; font-weight: bold; color: #fbbf24; margin: 15px 0; }
    </style>
</head>
<body>

<div id="topRoomBtnContainer" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 999999; font-family: Tahoma, sans-serif;">
    <a href="room.html" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #60a5fa; font-size: 14px; display: inline-block;">🔑 لدخول الغرفة بالأكواد</a>
</div>




























































































































    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myScore = 0;
        let opponentScore = 0;
        
        let secretNum = 0;
        let isMyTurn = false; // الـ Host بيبدأ الأول أو بنحدد بالدور

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            secretNum = Math.floor(Math.random() * 100) + 1; // رقم سري عشوائي
            isMyTurn = true; // الـ Host يبدأ

            peer = new Peer();
            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}&secret=${secretNum}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');
        const urlSecret = urlParams.get('secret');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك! اكتب اسمك للانضمام للعبة:");
                if(!name) return;
                myName = name;
                secretNum = parseInt(urlSecret);
                isMyTurn = false; // الضيف يلعب بعد الـ Host

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! التحدي بدأ 🎮";
            document.getElementById('playArea').classList.remove('hidden');
            updateTurnText();

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateUI();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك", secret: secretNum });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    secretNum = parseInt(data.secret);
                    updateUI();
                } else if(data.type === 'guess') {
                    handleOpponentGuess(data.guess, data.name);
                } else if(data.type === 'reset') {
                    secretNum = data.newSecret;
                    executeReset();
                }
            });
        }

        function updateUI() {
            document.getElementById('playersInfo').innerText = `${myName} ⚔️ ${opponentName}`;
            updateScoreboard();
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: أنت (${myScore}) - (${opponentScore}) ${opponentName}`;
        }

        function updateTurnText() {
            if(isMyTurn) {
                document.getElementById('hintText').innerText = "دورك! اكتب رقماً وحاول التخمين 🎯";
                document.getElementById('guessInput').disabled = false;
            } else {
                document.getElementById('hintText').innerText = `دور ${opponentName}، استنى تخمينه... ⏳`;
                document.getElementById('guessInput').disabled = true;
            }
        }

        function sendGuess() {
            if(!isMyTurn) return;
            let val = parseInt(document.getElementById('guessInput').value);
            if(isNaN(val) || val < 1 || val > 100) {
                alert("اكتب رقم صحيح بين 1 و 100!");
                return;
            }

            document.getElementById('guessInput').value = "";

            if(val === secretNum) {
                // فاز بالجولة!
                document.getElementById('hintText').innerText = `🎉 كررررتها! الرقم الصحيح كان ${secretNum}`;
                document.getElementById('resultText').innerText = `عاش يا ${myName}! أنت اللي حزرت الرقم الصح! 🏆`;
                myScore++;
                updateScoreboard();
                isMyTurn = false;
                document.getElementById('guessInput').disabled = true;
                document.getElementById('resetBtn').classList.remove('hidden');
                
                conn.send({ type: 'guess', guess: val, name: myName, win: true });
            } else {
                let hint = val < secretNum ? "الرقم الخفي أكبر 🔼" : "الرقم الخفي أصغر 🔽";
                document.getElementById('hintText').innerText = `تخمينك (${val}): ${hint}`;
                
                isMyTurn = false;
                updateTurnText();
                conn.send({ type: 'guess', guess: val, name: myName, win: false, hint: hint });
            }
        }

        function handleOpponentGuess(guess, name) {
            if(guess === secretNum) {
                document.getElementById('hintText').innerText = `😢 سبقك ${name}! الرقم كان ${secretNum}`;
                document.getElementById('resultText').innerText = `${name} قدر يحزر الرقم الخفي قبلك!`;
                opponentScore++;
                updateScoreboard();
                document.getElementById('resetBtn').classList.remove('hidden');
            } else {
                let hint = guess < secretNum ? "أكبر 🔼" : "أصغر 🔽";
                document.getElementById('hintText').innerText = `تخمين ${name} كان (${guess}) وهو (${hint})`;
                isMyTurn = true;
                updateTurnText();
            }
        }

        function resetRound() {
            let newSec = Math.floor(Math.random() * 100) + 1;
            secretNum = newSec;
            conn.send({ type: 'reset', newSecret: newSec });
            executeReset();
        }

        function executeReset() {
            document.getElementById('resultText').innerText = "";
            document.getElementById('resetBtn').classList.add('hidden');
            // تبادل الأدوار في بداية الجولة الجديدة
            isMyTurn = !isMyTurn; 
            updateTurnText();
            document.getElementById('hintText').innerText = "بدأت جولة جديدة! خمن الرقم السري 🔢";
        }
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>

































</body>

</html>
