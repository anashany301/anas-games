<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تيك تاك تو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: #38bdf8;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .score-item span {
            display: block;
            font-size: 1.2rem;
            margin-top: 4px;
        }
        .score-x { color: #f43f5e; }
        .score-o { color: #38bdf8; }
        .score-tie { color: #94a3b8; }
        .status {
            font-size: 1.1rem;
            margin-bottom: 16px;
            font-weight: 500;
            color: #cbd5e1;
            min-height: 30px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #334155;
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #f8fafc;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cell.x { color: #f43f5e; }
        .cell.o { color: #38bdf8; }
        .btn-restart {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>لعبة إكس أو</h1>
        <div class="scoreboard">
            <div class="score-item score-x">اللاعب X <span id="scoreX">0</span></div>
            <div class="score-item score-tie">تعادل <span id="scoreTie">0</span></div>
            <div class="score-item score-o">اللاعب O <span id="scoreO">0</span></div>
        </div>
        <div class="status" id="status">دور اللاعب: X</div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <button class="btn-restart" id="restartBtn">إعادة اللعب</button>
    </div>
    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreTieEl = document.getElementById('scoreTie');

        let gameState = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let scores = { X: 0, O: 0, tie: 0 };
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const index = parseInt(clickedCell.getAttribute('data-index'));
            if (gameState[index] !== '' || !gameActive) return;
            gameState[index] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());
            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }
            if (roundWon) {
                statusText.textContent = `فاز اللاعب: ${currentPlayer} 🎉`;
                scores[currentPlayer]++;
                updateScoreBoard();
                gameActive = false;
                return;
            }
            if (!gameState.includes('')) {
                statusText.textContent = `تعادلنا! 🤝`;
                scores.tie++;
                updateScoreBoard();
                gameActive = false;
                return;
            }
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.textContent = `دور اللاعب: ${currentPlayer}`;
        }

        function updateScoreBoard() {
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreTieEl.textContent = scores.tie;
        }

        function restartGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = ['', '', '', '', '', '', '', '', ''];
            statusText.textContent = `دور اللاعب: ${currentPlayer}`;
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);
    </script>
</body>
</html>
