<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - Anas Games</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; font-size: 22px; margin-bottom: 20px; }
        .stat-box {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
        }
        .stat-value {
            color: #3fb950;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        .hidden { display: none; }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-family: monospace;
        }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div class="container">
        <div id="dashboard">
            <h1>🚀 لوحة تحكم Anas Games</h1>
            
            <div class="stat-box">
                <div>إجمالي الزيارات للموقع</div>
                <div class="stat-value" id="total-visits">جارٍ الجلب...</div>
            </div>

            <button class="btn" onclick="fetchVisits()">تحديث البيانات 🔄</button>
        </div>
    </div>

    
</body>

</html>
