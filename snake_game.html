<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Xenzia Pro</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --apple-red: #ff4444;
            --ui-color: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--ui-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: 900;
        }

        #score-container {
            margin-bottom: 20px;
            font-size: 1.4rem;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
        }

        #score {
            color: var(--neon-green);
            font-weight: bold;
        }

        canvas {
            border: 4px solid var(--neon-green);
            background-color: #000000;
            box-shadow: 0px 0px 25px rgba(57, 255, 20, 0.4);
            border-radius: 15px;
            width: 380px;
            height: 380px;
            display: block;
        }

        #game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--neon-red);
            z-index: 10;
        }
        #game-message h3 {
            color: var(--neon-red);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px var(--neon-red);
        }
        #game-message p {
            font-size: 1.3rem;
            margin: 0 0 20px 0;
        }
        #game-message button {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background-color: var(--btn-bg);
            border: 3px solid var(--btn-border);
            color: var(--ui-color);
            cursor: pointer;
            border-radius: 50%;
            outline: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .btn:active {
            background-color: var(--neon-green);
            border-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 1; grid-row: 2; }

    </style>
</head>
<body>

    <h2>SNAKE XENZIA PRO</h2>
    <div id="score-container">النتيجة: <span id="score">0</span></div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="game-message">
        <h3>GAME OVER</h3>
        <p>النتيجة النهائية: <span id="final-score">0</span></p>
        <button onclick="initGame()">العب مجدداً</button>
    </div>

    <div class="controls">
        <button class="btn btn-up" onclick="setDirection('UP')">▲</button>
        <button class="btn btn-left" onclick="setDirection('LEFT')">◄</button>
        <button class="btn btn-down" onclick="setDirection('DOWN')">▼</button>
        <button class="btn btn-right" onclick="setDirection('RIGHT')">►</button>
    </div>

    
</body>

</html>
