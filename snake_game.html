<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Xenzia Pro</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --apple-red: #ff4444;
            --ui-color: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--ui-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: 900;
        }

        #score-container {
            margin-bottom: 20px;
            font-size: 1.4rem;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
        }

        #score {
            color: var(--neon-green);
            font-weight: bold;
        }

        canvas {
            border: 4px solid var(--neon-green);
            background-color: #000000;
            box-shadow: 0px 0px 25px rgba(57, 255, 20, 0.4);
            border-radius: 15px;
            width: 380px;
            height: 380px;
            display: block;
        }

        #game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--neon-red);
            z-index: 10;
        }
        #game-message h3 {
            color: var(--neon-red);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px var(--neon-red);
        }
        #game-message p {
            font-size: 1.3rem;
            margin: 0 0 20px 0;
        }
        #game-message button {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background-color: var(--btn-bg);
            border: 3px solid var(--btn-border);
            color: var(--ui-color);
            cursor: pointer;
            border-radius: 50%;
            outline: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .btn:active {
            background-color: var(--neon-green);
            border-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 1; grid-row: 2; }

    </style>
</head>
<body>

    <h2>SNAKE XENZIA PRO</h2>
    <div id="score-container">النتيجة: <span id="score">0</span></div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="game-message">
        <h3>GAME OVER</h3>
        <p>النتيجة النهائية: <span id="final-score">0</span></p>
        <button onclick="initGame()">العب مجدداً</button>
    </div>

    <div class="controls">
        <button class="btn btn-up" onclick="setDirection('UP')">▲</button>
        <button class="btn btn-left" onclick="setDirection('LEFT')">◄</button>
        <button class="btn btn-down" onclick="setDirection('DOWN')">▼</button>
        <button class="btn btn-right" onclick="setDirection('RIGHT')">►</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameMsg = document.getElementById("game-message");
        const finalScoreElement = document.getElementById("final-score");

        let gridSize = 20;
        let tileCount = 20;
        let score = 0;
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let gameLoop;
        let nextDirection = 'RIGHT';

        function initGame() {
            canvas.width = tileCount * gridSize;
            canvas.height = tileCount * gridSize;

            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            score = 0;
            scoreElement.innerText = score;
            dx = 1;
            dy = 0;
            nextDirection = 'RIGHT';
            
            gameMsg.style.display = 'none';
            
            placeFood();
            
            if (gameLoop) clearInterval(gameLoop);
            // السرعة أصبحت أبطأ قليلاً (185 ملي ثانية)
            gameLoop = setInterval(drawGame, 185);
        }

        function drawGame() {
            if (nextDirection) {
                if (nextDirection === 'UP' && dy === 0) { dx = 0; dy = -1; }
                else if (nextDirection === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
                else if (nextDirection === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
                else if (nextDirection === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || collision(head)) {
                clearInterval(gameLoop);
                finalScoreElement.innerText = score;
                gameMsg.style.display = 'flex';
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.innerText = score;
                placeFood();
            } else {
                snake.pop();
            }

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 * 0.8, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? '#39ff14' : '#2ecc71';
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }
        }

        function collision(head) {
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) placeFood();
            }
        }

        function setDirection(newDir) {
            if (newDir === 'UP' && dy === 0) nextDirection = 'UP';
            else if (newDir === 'DOWN' && dy === 0) nextDirection = 'DOWN';
            else if (newDir === 'LEFT' && dx === 0) nextDirection = 'LEFT';
            else if (newDir === 'RIGHT' && dx === 0) nextDirection = 'RIGHT';
        }

        initGame();
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
</body>

</html>
