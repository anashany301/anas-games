<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 100 مرحلة - فرقعة البالونات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .stage-title {
            font-size: 0.95rem;
            color: #f43f5e;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            background-color: #0f172a;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #cbd5e1;
        }
        canvas {
            background-color: #0f172a;
            border-radius: 10px;
            display: block;
            margin: 0 auto 10px auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .btn-restart {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-restart:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

<div id="topRoomBtnContainer" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 999999; font-family: Tahoma, sans-serif;">
    <a href="room.html" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #60a5fa; font-size: 14px; display: inline-block;">🔑 لدخول الغرفة بالأكواد</a>
</div>




























        <canvas id="targetCanvas" width="320" height="360"></canvas>

        <button class="btn-restart" id="restartBtn">ابدأ اللعبة</button>
    </div>

    
</body>

</html>
