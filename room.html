<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة اللعب الجماعي - فلامينجو 🎮</title>
    <!-- استدعاء مكتبة PeerJS للأونلاين عبر الأكواد -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; margin: 0; direction: rtl; }
        h1 { color: #38bdf8; font-size: 22px; }
        .card { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: right; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; background: #0f172a; border: 1px solid #64748b; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; transition: 0.2s; }
        button:hover { background: #059669; }
        .secondary-btn { background: #3b82f6; margin-top: 10px; }
        .secondary-btn:hover { background: #2563eb; }
        .hidden { display: none !important; }
        .status-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>🕹️ إعدادات الغرفة الجماعية</h1>

    <div class="card" id="setupCard">
        <label>👤 اكتب اسمك الكريم:</label>
        <input type="text" id="playerName" placeholder="مثلاً: أنس البطل">

        <label>🌐 اختر طريقة اللعب:</label>
        <select id="connectionType" onchange="toggleModeFields()">
            <option value="online">أونلاين (عبر الإنترنت باستخدام كود)</option>
            <option value="local">محلي (عبر الهوتسبوت / بدون نت)</option>
        </select>

        <!-- خيارات الأونلاين -->
        <div id="onlineModeDiv">
            <button onclick="createOnlineRoom()">إنشاء غرفة جديدة (الحصول على كود) 🔑</button>
            <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
            <label>أو اكتب كود صديقك للانضمام:</label>
            <input type="text" id="roomCodeInput" placeholder="أدخل كود الغرفة هنا...">
            <button class="secondary-btn" onclick="joinOnlineRoom()">انضمام للغرفة 🚀</button>
        </div>

        <!-- خيارات المحلي (هوتسبوت) -->
        <div id="localModeDiv" class="hidden">
            <label>📡 آيبي جهاز المضيف (Host IP):</label>
            <input type="text" id="hostIpInput" placeholder="مثلاً: 192.168.43.1">
            <button class="secondary-btn" onclick="connectLocalRoom()">الاتصال بشبكة الهوتسبوت المحلية 📶</button>
        </div>
    </div>

    <!-- صندوق عرض الحالة والاتصال -->
    <div class="card hidden" id="waitingCard">
        <h3>حالة الاتصال باللعبة</h3>
        <div class="status-box" id="statusText">جاري التوصيل... ⏳</div>
        <button class="secondary-btn" style="background:#ef4444;" onclick="location.reload()">إلغاء والرجوع</button>
    </div>

    <!-- إطار اللعبة اللي هتفتح جواها -->
    <div id="gameContainer" class="hidden" style="width:100%; height:100vh; position:fixed; top:0; left:0; background:#0f172a; z-index:9999;">
        <iframe id="gameFrame" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetGame = urlParams.get('game') || 'index.html';

        function toggleModeFields() {
            const mode = document.getElementById('connectionType').value;
            if (mode === 'online') {
                document.getElementById('onlineModeDiv').classList.remove('hidden');
                document.getElementById('localModeDiv').classList.add('hidden');
            } else {
                document.getElementById('onlineModeDiv').classList.add('hidden');
                document.getElementById('localModeDiv').classList.remove('hidden');
            }
        }

        let peer = null;
        let conn = null;
        let myName = "";

        function createOnlineRoom() {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            document.getElementById('setupCard').classList.add('hidden');
            document.getElementById('waitingCard').classList.remove('hidden');
            document.getElementById('statusText').innerText = "جاري إنشاء الغرفة وتوليد الكود... 🔄";

            const randomCode = "flamingo-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomCode);

            peer.on('open', (id) => {
                document.getElementById('statusText').innerHTML = `✅ تم إنشاء الغرفة بنجاح!<br><br>🔑 كود غرفتك هو: <span style="color:#10b981; font-size:20px;">${id}</span><br><br>ابعت الكود ده لصاحبِك وانتظره حتى ينضم... ⏳`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
            });

            peer.on('error', () => {
                alert("حدث خطأ في إنشاء الغرفة، جرب مرة أخرى.");
                location.reload();
            });
        }

        function joinOnlineRoom() {
            myName = document.getElementById('playerName').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim();

            if (!myName || !roomCode) {
                alert("من فضلك اكتب اسمك وكود الغرفة!");
                return;
            }

            document.getElementById('setupCard').classList.add('hidden');
            document.getElementById('waitingCard').classList.remove('hidden');
            document.getElementById('statusText').innerText = "جاري الاتصال بغرفة صديقك... 🔄";

            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnectionEvents();
            });

            peer.on('error', () => {
                alert("فشل العثور على الغرفة، تأكد من صحة الكود أو أن صديقك متصل.");
                location.reload();
            });
        }

        function connectLocalRoom() {
            myName = document.getElementById('playerName').value.trim();
            const hostIp = document.getElementById('hostIpInput').value.trim();

            if (!myName || !hostIp) {
                alert("اكتب اسمك وآيبي المضيف المحلي!");
                return;
            }
            alert("وضع الهوتسبوت المحلي جاهز للربط عبر الآيبي: " + hostIp);
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                document.getElementById('statusText').innerText = "🎉 تم الاتصال بنجاح بين اللاعبين! جاري فتح اللعبة...";
                conn.send({ type: 'JOIN', name: myName });

                setTimeout(() => {
                    document.getElementById('waitingCard').classList.add('hidden');
                    document.getElementById('gameContainer').classList.remove('hidden');
                    document.getElementById('gameFrame').src = targetGame;
                }, 1500);
            });

            conn.on('data', (data) => {
                if (data.type === 'JOIN') {
                    console.log("انضم اللاعب: " + data.name);
                }
            });

            conn.on('close', () => {
                alert("انقطع الاتصال مع اللاعب الآخر!");
                location.reload();
            });
        }
    </script>
</body>
</html>
