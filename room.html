<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة اللعب بالأكواد</title>
    <style>
        body { background: #0f172a; color: white; font-family: Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); width: 320px; text-align: center; border: 1px solid #38bdf8; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold; }
        .green-btn { background: #10b981; }
        .code-display { color: #38bdf8; font-size: 32px; font-weight: bold; letter-spacing: 4px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px dashed #38bdf8; margin: 15px 0; }
        .back-link { display: block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: إدخال الاسم وإنشاء الكود أو الانضمام -->
    <div id="screen1" class="box">
        <h3 style="color: #38bdf8; margin-top: 0;">غرفة اللعب الذكية</h3>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا">
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <button onclick="createRoom()">إنشاء غرفة جديدة</button>
        <div style="margin-top: 15px;">
            <input type="text" id="roomCodeInput" placeholder="أدخل كود صديقك">
            <button class="green-btn" onclick="joinRoom()">دخول اللعبة</button>
        </div>
        <a href="javascript:history.back()" class="back-link">← العودة للعبة</a>
    </div>

    <!-- الشاشة الثانية: شاشة الانتظار الثابتة -->
    <div id="screen2" class="box" style="display: none; border-color: #10b981;">
        <h3 style="color: #10b981; margin-top: 0;">✨ تم إنشاء الغرفة</h3>
        <p style="font-size: 14px; color: #cbd5e1;">كود الغرفة الخاص بك:</p>
        <div id="myCodeBox" class="code-display">----</div>
        <p style="font-size: 12px; color: #10b981;">📋 تم نسخ الكود للحافظة أرسله لصديقك!</p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <p style="font-size: 14px; color: #f59e0b; font-weight: bold; line-height: 1.6;">⏳ في انتظار صديقك لكتابة الكود والدخول...</p>
        <p style="font-size: 11px; color: #64748b; margin-top: 15px;">(هذه الصفحة ثابتة ولن تختفي حتى يدخل صديقك)</p>
        <button onclick="location.reload()" style="background: #ef4444; margin-top: 15px; font-size: 13px; padding: 8px;">إلغاء الغرفة</button>
    </div>

    <script>
        function createRoom() {
            const name = document.getElementById('playerName').value.trim();
            if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }

            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('myCodeBox').innerText = code;
            navigator.clipboard.writeText(code).catch(() => {});

            // التحويل لشاشة الانتظار المريحة والثابتة
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'block';
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim();
            if(!name || !code) { alert('اكتب اسمك وكود صديقك من فضلك!'); return; }

            alert('تم الاتصال بنجاح بالصديق ودخول اللعبة!');
            history.back();
        }
    </script>
</body>
</html>
