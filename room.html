<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة فلامينجو الذكية (محلي وعن بعد)</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .room-box {
            background: #1b263b;
            border: 2px solid #415a77;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            margin: 40px auto;
        }
        button {
            background-color: #7209b7;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button.danger {
            background-color: #f72585;
        }
        #status {
            margin: 15px 0;
            font-weight: bold;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="room-box">
        <h2>🎮 غرفة فلامينجو الذكية</h2>
        <div id="status">⏳ جاري اختيار أفضل طريقة اتصال...</div>
        
        <p>طريقة اللعب:</p>
        <button onclick="setMode('local')">📶 وضع محلي (بدون نت - قريبين)</button>
        <button onclick="setMode('online')">🌐 وضع عن بعد (بالنت - بعيدين)</button>
        
        <hr style="border-color: #415a77; margin: 20px 0;">

        <button id="micBtn" onclick="toggleMic()" disabled>🎤 تفعيل الميكروفون</button>
        <button class="danger" onclick="leaveRoom()">خروج</button>
    </div>

    <script>
        let ws = null;
        let peerConnection = null;
        let dataChannel = null;
        let localStream = null;
        let remoteAudio = new Audio();
        remoteAudio.autoplay = true;

        // إعدادات الربط السريعة
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] // سيرفر مجاني للتعارف فقط
        };

        function setMode(mode) {
            const status = document.getElementById('status');
            document.getElementById('micBtn').removeAttribute('disabled');

            if (mode === 'local') {
                status.innerText = "📶 تم تفعيل الوضع المحلي (تأكد أنكم على نفس الهوتسبوت)";
                status.style.color = "#4ade80";
                // في الوضع المحلي، نقدر نربط الأجهزة عبر الـ IP الداخلي مباشرة
                initLocalConnection();
            } else {
                status.innerText = "🌐 جاري الاتصال عبر السيرفر الخارجي...";
                status.style.color = "#38bdf8";
                initOnlineConnection();
            }
        }

        // اتصال عن بعد عبر سيرفر مجاني عام
        function initOnlineConnection() {
            ws = new WebSocket('wss://echo.websocket.events');
            
            ws.onopen = () => {
                document.getElementById('status').innerText = "🟢 متصل بالوضع عن بعد بنجاح";
            };

            ws.onmessage = (event) => {
                if (event.data instanceof Blob) {
                    const audioUrl = URL.createObjectURL(event.data);
                    remoteAudio.src = audioUrl;
                } else {
                    console.log("بيانات لعبة مستلمة:", event.data);
                }
            };
        }

        // اتصال محلي (بدون نت - عبر الهوتسبوت)
        function initLocalConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // إنشاء قناة نقل بيانات اللعبة والصوت محلياً وبسرعة فائقة
            dataChannel = peerConnection.createDataChannel("gameData");
            dataChannel.onmessage = (event) => {
                console.log("بيانات محلية مستلمة:", event.data);
            };

            document.getElementById('status').innerText = "🟢 الشبكة المحلية جاهزة للأجهزة القريبة";
        }

        // تشغيل الميكروفون وإرسال الصوت حسب الوضع المختار
        async function toggleMic() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(localStream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(event.data); // إرسال عبر النت لوضع البعد
                        } else if (dataChannel && dataChannel.readyState === 'open') {
                            dataChannel.send(event.data); // إرسال محلي لوضع القرب
                        }
                    }
                };

                mediaRecorder.start(500); // تقطيع الصوت كل نصف ثانية لسرعة النقل
                document.getElementById('micBtn').innerText = "🎤 الميكروفون يعمل الآن";
                document.getElementById('micBtn').style.backgroundColor = "#22c55e";
            } catch (err) {
                alert("تعذر الوصول للميكروفون، تأكد من الصلاحيات!");
            }
        }

        function leaveRoom() {
            if (ws) ws.close();
            if (peerConnection) peerConnection.close();
            window.location.reload();
        }
    </script>
</body>
</html>
