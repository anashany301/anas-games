<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز 2D - نسخة شاملة</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; touch-action: none; }
        canvas { background: #0f172a; border-bottom: 5px solid #38bdf8; display: block; }
        .ui { position: absolute; top: 20px; color: white; font-size: 24px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>

    <div class="ui">النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        canvas.width = 400;
        canvas.height = 200;

        let score = 0;
        let gameRunning = true;

        const player = { x: 50, y: 150, w: 30, h: 30, dy: 0, jumpForce: 11, isJumping: false };
        const obstacle = { x: 400, y: 155, w: 25, h: 25, speed: 6 };

        function draw() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الأرضية
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(0, 180, canvas.width, 5);

            // رسم اللاعب
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // رسم العائق
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

            // فيزياء القفز
            if (player.isJumping) {
                player.dy += 0.7; 
                player.y += player.dy;
                if (player.y >= 150) {
                    player.y = 150;
                    player.isJumping = false;
                    player.dy = 0;
                }
            }

            // حركة العائق
            obstacle.x -= obstacle.speed;
            if (obstacle.x + obstacle.w < 0) {
                obstacle.x = canvas.width;
                score += 10;
                scoreEl.textContent = score;
                obstacle.speed += 0.3; // زيادة الصعوبة
            }

            // التصادم
            if (player.x < obstacle.x + obstacle.w && player.x + player.w > obstacle.x &&
                player.y + player.h > obstacle.y) {
                gameRunning = false;
                alert("خسرت! مجموع نقاطك: " + score);
                location.reload();
            }

            requestAnimationFrame(draw);
        }

        // تحكم شامل (لمس أو كليك)
        function handleInput(e) {
            e.preventDefault();
            if (!player.isJumping) {
                player.isJumping = true;
                player.dy = -player.jumpForce;
            }
        }

        document.addEventListener("mousedown", handleInput);
        document.addEventListener("touchstart", handleInput);

        draw();
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
</body>

</html>
