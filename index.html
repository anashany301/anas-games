<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو اللانهائية</title>
    <style>
        body { background-color: #0d1117; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 0; }
        header { padding: 20px; background: #161b22; border-bottom: 2px solid #30363d; position: sticky; top: 0; z-index: 10; }
        h1 { color: #58a6ff; margin: 0; }
        .game-card { background: #21262d; margin: 15px auto; padding: 15px; width: 90%; max-width: 500px; border-radius: 12px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        #canvas-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #111; border: 4px solid #30363d; image-rendering: pixelated; box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
        .back-btn { background: #da3633; margin-top: 15px; }
        .back-btn:hover { background: #f85149; }
        #loading-more { padding: 20px; color: #8b949e; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🕹️ أركيد فلامينجو اللانهائي</h1>
        <p>عالم بكسل يتسع للأبد .. انزل للأسفل لتوليد ألعاب بلا حدود</p>
    </header>

    <div id="list-screen">
        <div id="games-list"></div>
        <div id="loading-more">جاري تخليق عوالم وألعاب جديدة... ⚡</div>
    </div>

    <div id="canvas-container">
        <h2 id="game-title-hud" style="color: #58a6ff; margin: 5px;"></h2>
        <canvas id="gameCanvas" width="320" height="400"></canvas>
        <div style="margin-top: 10px;">
            <button onclick="movePlayer(-1)">◀️ يسار</button>
            <button onclick="playerJump()">⬆️ ناط</button>
            <button onclick="movePlayer(1)">يمين ▶️</button>
        </div>
        <button class="back-btn" onclick="closeGame()">الرجوع للقائمة</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopInterval;
        let gameState = {};
        
        const gamesData = [];
        const adjectives = ["أساطير", "مملكة", "ثورة", "حرب", "تحدي", "معبد", "سرعة", "مغامرة", "فارس", "بكسل"];
        const nouns = ["المقاتلين", "الزمن", "الفضاء", "المتاهة", "العمالقة", "الصحراء", "المدينة", "الأبطال", "المجرة", "المستقبل"];
        const types = ["منصات بكسل كلاسيكية", "أركيد قتال ثنائي", "مغامرة الفضاء المفتوح", "متاهة الكنز البرتقالي"];

        let currentBatch = 1;

        // توليد دفعة جديدة من الألعاب
        function generateMoreGames(count) {
            const startIdx = gamesData.length + 1;
            for (let i = startIdx; i < startIdx + count; i++) {
                const adj = adjectives[i % adjectives.length];
                const noun = nouns[(i * 7) % nouns.length];
                gamesData.push({
                    id: i,
                    name: `${adj} ${noun} #${i}`,
                    type: types[i % types.length],
                    color: i % 2 === 0 ? '#ff4444' : '#00ffcc'
                });
            }
            renderList();
        }

        function renderList() {
            const container = document.getElementById('games-list');
            container.innerHTML = gamesData.map(g => `
                <div class="game-card">
                    <div style="text-align: right;">
                        <h3 style="margin:0; color:#58a6ff;">${g.name}</h3>
                        <small style="color:#8b949e;">${g.type}</small>
                    </div>
                    <button onclick="startGame(${g.id})">▶ تشغيل</button>
                </div>
            `).join('');
        }

        // التمرير اللانهائي (Infinite Scroll)
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
                generateMoreGames(20); // يضيف 20 لعبة جديدة أول ما توصل لآخر الصفحة
            }
        });

        function startGame(id) {
            const game = gamesData.find(g => g.id === id);
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = game.name;

            gameState = {
                x: 140,
                y: 320,
                vx: 0,
                vy: 0,
                color: game.color,
                enemies: [{x: 60, y: 120, vx: 2}, {x: 220, y: 220, vx: -2}],
                platforms: [{x: 30, y: 300, w: 260, h: 12}, {x: 70, y: 180, w: 180, h: 12}]
            };

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(updateAndRender, 1000 / 60);
        }

        function movePlayer(dir) {
            gameState.x += dir * 15;
            if (gameState.x < 10) gameState.x = 10;
            if (gameState.x > 290) gameState.x = 290;
        }

        function playerJump() {
            gameState.vy = -8;
        }

        function drawPixelSprite(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 16, 20); // الجسم
            ctx.fillStyle = "#ffccaa";
            ctx.fillRect(x + 2, y - 8, 12, 10); // الرأس
            ctx.fillStyle = "#000";
            ctx.fillRect(x + 8, y - 6, 3, 3); // العين
        }

        function updateAndRender() {
            ctx.fillStyle = "#111625";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            gameState.vy += 0.3;
            gameState.y += gameState.vy;

            gameState.platforms.forEach(p => {
                if (gameState.x + 16 > p.x && gameState.x < p.x + p.w &&
                    gameState.y + 20 >= p.y && gameState.y + 20 <= p.y + p.h + 10 && gameState.vy > 0) {
                    gameState.y = p.y - 20;
                    gameState.vy = 0;
                }
            });

            if (gameState.y > 360) {
                gameState.y = 360;
                gameState.vy = 0;
            }

            ctx.fillStyle = "#30363d";
            gameState.platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = "#58a6ff";
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            drawPixelSprite(gameState.x, gameState.y, gameState.color);

            gameState.enemies.forEach(en => {
                en.x += en.vx;
                if (en.x < 20 || en.x > 280) en.vx *= -1;
                drawPixelSprite(en.x, en.y, "#ff3333");
            });
        }

        function closeGame() {
            clearInterval(gameLoopInterval);
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }

        // توليد أول 30 لعبة عند فتح الصفحة
        generateMoreGames(30);
    </script>
</body>
</html>
