<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Games - منصة الألعاب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 20px;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
        }
        h1 {
            font-size: 22px;
            color: #38bdf8;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .game-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }
        .game-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
        }
        .game-card h3 {
            font-size: 14px;
            margin: 8px 0;
        }
        .play-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anas Games 🎮</h1>
    </header>

    <div class="container">
        <div class="games-grid">
            <!-- لعبة ماريو -->
            <div class="game-card" onclick="playGameWithAd('game-mario.html')">
                <img src="https://via.placeholder.com/150/ff0000/ffffff?text=Super+Mario" alt="Super Mario">
                <h3>Super Mario</h3>
                <button class="play-btn">تشغيل اللعبة</button>
            </div>
            
            <!-- لعبة سونيك -->
            <div class="game-card" onclick="playGameWithAd('game-sonic.html')">
                <img src="https://via.placeholder.com/150/0000ff/ffffff?text=Sonic" alt="Sonic">
                <h3>Sonic Classic</h3>
                <button class="play-btn">تشغيل اللعبة</button>
            </div>
        </div>
    </div>

    <!-- شاشة إعلان الفيديو قبل فتح اللعبة (ExoClick Video Only) -->
    <div id="video-ad-overlay" style="
        display: none; 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0, 0, 0, 0.95); 
        z-index: 999999; 
        align-items: center; 
        justify-content: center;
    ">
        <div style="text-align: center; color: white; width: 90%; max-width: 400px;">
            <!-- كود ExoClick Outstream Video -->
            <ins class="eas6a97888e37" data-zoneid="6028854"></ins>
            
            <div style="margin-top: 15px;">
                <span id="ad-timer" style="font-size: 14px; font-weight: bold; color: #38bdf8;">ستبدأ اللعبة خلال 5 ثوانٍ...</span>
            </div>
        </div>
    </div>

    <!-- ملفات سكريبت ExoClick والتحكم -->
    <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
    <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>

    <script>
    // تشغيل إعلان الفيديو والعداد عند الضغط على أي لعبة
    function playGameWithAd(gameUrl) {
        const overlay = document.getElementById('video-ad-overlay');
        const timerText = document.getElementById('ad-timer');
        
        overlay.style.display = 'flex';
        let secondsLeft = 5;
        
        const interval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                timerText.innerText = "ستبدأ اللعبة خلال " + secondsLeft + " ثوانٍ...";
            } else {
                clearInterval(interval);
                overlay.style.display = 'none';
                window.location.href = gameUrl;
            }
        }, 1000);
    }
    </script>
</body>
</html>
