<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة فلامينجو لمحرك Phaser - أوفلاين</title>
    <!-- تحميل مكتبة Phaser.js الشهيرة لألعاب الـ 2D -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #09090b; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #121216; padding: 8px 15px; border-bottom: 2px solid #3b82f6; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #3b82f6; margin: 0; font-size: 12px; }

        #game-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(59,130,246,0.3); border-radius: 4px; }

        /* أزرار التحكم اللمسية الاحترافية */
        .controls-deck { background: #121216; padding: 10px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #27272a; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; }
        .d-btn { background: #27272a; color: #fff; border: 1px solid #3f3f46; height: 40px; border-radius: 6px; font-size: 14px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .d-btn:active { background: #3b82f6; color: #000; }

        .action-pad { display: grid; grid-template-columns: repeat(2, 44px); gap: 6px; }
        .act-btn { background: #3b82f6; color: #fff; border: none; height: 44px; border-radius: 50%; font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center; box-shadow: 0 3px 6px rgba(59,130,246,0.4); cursor: pointer; }
        .act-btn:active { background: #1d4ed8; transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <h1>🔥 منصة فلامينجو لمحرك Phaser (شخصيات حقيقية)</h1>
        <span style="font-size: 9px; color: #10b981; font-weight: bold;">● شغال أوفلاين</span>
    </header>

    <div id="game-container"></div>

    <div class="controls-deck">
        <div class="action-pad">
            <div class="act-btn" id="jumpBtn">نط</div>
            <div class="act-btn" id="boostBtn" style="background:#10b981;">سرعة</div>
        </div>
        <div class="d-pad">
            <div></div><div class="d-btn" id="upBtn">⬆️</div><div></div>
            <div class="d-btn" id="leftBtn">⬅️</div>
            <div class="d-btn" id="fireBtn">⚡</div>
            <div class="d-btn" id="rightBtn">➡️</div>
            <div></div><div class="d-btn" id="downBtn">⬇️</div><div></div>
        </div>
    </div>

    <script>
        class MainGameScene extends Phaser.Scene {
            constructor() {
                super('MainGameScene');
            }

            preload() {
                // توليد رسومات بكسل آرت حقيقية وملونة بالبرمجة عشان تظهر فوراً من غير صور خارجية معططلة
                let graphics = this.make.graphics({ x: 0, y: 0, add: false });
                
                // رسم شخصية تشبه ماريو (قبعة حمراء ولبس أزرق)
                graphics.fillStyle(0xff0000); graphics.fillRect(0, 0, 24, 12); // القبعة
                graphics.fillStyle(0xffccaa); graphics.fillRect(4, 12, 16, 12); // الوجه
                graphics.fillStyle(0x0000ff); graphics.fillRect(4, 24, 16, 16); // الجسم
                graphics.generateTexture('marioSprite', 24, 40);
                graphics.clear();

                // رسم منصة الطوب للأرضية
                graphics.fillStyle(0xb91c1c); graphics.fillRect(0, 0, 32, 32);
                graphics.fillStyle(0xfbbf24); graphics.lineStyle(2, 0x000000); graphics.strokeRect(0, 0, 32, 32);
                graphics.generateTexture('brickTile', 32, 32);
                graphics.clear();

                // رسم عملة ذهبية دائرية لامعة
                graphics.fillStyle(0xfacc15);
                graphics.fillCircle(10, 10, 10);
                graphics.generateTexture('coin', 20, 20);
            }

            create() {
                // خلفية سماوية زاهية
                this.cameras.main.setBackgroundColor('#38bdf8');

                // إنشاء أرضية من الطوب
                this.platforms = this.physics.add.staticGroup();
                for (let x = 0; x < 800; x += 32) {
                    this.platforms.create(x, 280, 'brickTile');
                }

                // إضافة البطل (ماريو)
                this.player = this.physics.add.sprite(100, 150, 'marioSprite');
                this.player.setBounce(0.1);
                this.player.setCollideWorldBounds(true);
                this.physics.add.collider(this.player, this.platforms);

                // إضافة عملات ذهبية للتجميع
                this.coins = this.physics.add.group({
                    key: 'coin',
                    repeat: 5,
                    setXY: { x: 150, y: 100, stepX: 80 }
                });

                this.coins.children.iterate((child) => {
                    child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
                });

                this.physics.add.collider(this.coins, this.platforms);
                this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);

                // عداد النقاط على الشاشة
                this.score = 0;
                this.scoreText = this.add.text(16, 16, 'النقاط: 0', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' });

                // ربط أزرار اللمس الحقيقية بالحركة
                window.moveDir = { left: false, right: false, jump: false };

                document.getElementById('leftBtn').addEventListener('touchstart', () => { window.moveDir.left = true; });
                document.getElementById('leftBtn').addEventListener('touchend', () => { window.moveDir.left = false; });
                document.getElementById('rightBtn').addEventListener('touchstart', () => { window.moveDir.right = true; });
                document.getElementById('rightBtn').addEventListener('touchend', () => { window.moveDir.right = false; });
                document.getElementById('jumpBtn').addEventListener('touchstart', () => { 
                    if (this.player.body.touching.down) { this.player.setVelocityY(-300); }
                });
            }

            collectCoin(player, coin) {
                coin.disableBody(true, true);
                this.score += 10;
                this.scoreText.setText('النقاط: ' + this.score);
            }

            update() {
                if (window.moveDir && window.moveDir.left) {
                    this.player.setVelocityX(-160);
                } else if (window.moveDir && window.moveDir.right) {
                    this.player.setVelocityX(160);
                } else {
                    this.player.setVelocityX(0);
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 360,
            height: 220,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 500 }, debug: false }
            },
            scene: MainGameScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
