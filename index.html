<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي سونيك وماريو الحقيقي - أوفلاين</title>
    <style>
        body { background: #020617; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; overflow: hidden; user-select: none; }
        .main-container { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        
        .top-bar { background: #1e1b4b; color: #38bdf8; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 11px; border-bottom: 2px solid #38bdf8; }
        
        /* شاشة المحاكي الحقيقي بخلفية ماب اللعبة (Green Hill Zone مثلاً) */
        .screen-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; overflow: hidden; }
        
        .emu-screen { width: 100%; height: 100%; max-width: 450px; max-height: 320px; border: 3px solid #38bdf8; border-radius: 6px; position: relative; background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 60%, #22c55e 60%, #15803d 100%); overflow: background-clip; overflow: hidden; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        
        /* الماب المتحركة في الخلفية (سحب وأرضية كلاسيكية) */
        .map-ground { position: absolute; bottom: 0; width: 200%; height: 40%; background: repeating-linear-gradient(45deg, #15803d, #15803d 20px, #166534 20px, #166534 40px); border-top: 4px solid #facc15; }

        /* شخصية سونيك الحقيقية بالأنيميشن والصور المباشرة */
        .sonic-sprite { position: absolute; bottom: 35%; left: 50px; width: 48px; height: 48px; background-image: url('https://images.gamebanana.com/img/ico/sprays/sonic_the_hedgehog_running_animation_gif.gif'); background-size: contain; background-repeat: no-repeat; transition: transform 0.1s; }

        .controls-deck { background: #0f172a; padding: 12px; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #1e293b; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 48px); gap: 4px; }
        .d-btn { background: #1e293b; color: #fff; border: 1px solid #334155; height: 44px; border-radius: 8px; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .d-btn:active { background: #38bdf8; color: #000; }

        .action-pad { display: grid; grid-template-columns: repeat(2, 48px); gap: 6px; }
        .act-btn { background: #38bdf8; color: #000; border: none; height: 48px; border-radius: 50%; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(56, 189, 248, 0.4); cursor: pointer; }
        .act-btn:active { background: #0284c7; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="top-bar">
            <span id="game-title">Sonic The Hedgehog - Green Hill Zone</span>
            <span style="color: #facc15;" id="score-text">النقاط: 0</span>
        </div>

        <div class="screen-area">
            <div class="emu-screen" id="gameScreen">
                <!-- خلفية سحابية -->
                <div style="position: absolute; top: 20px; left: 30px; font-size: 24px;">☁️</div>
                <div style="position: absolute; top: 40px; left: 200px; font-size: 20px;">☁️</div>
                
                <!-- الأرضية والماب -->
                <div class="map-ground" id="ground"></div>

                <!-- سونيك الحقيقي وهو يجري -->
                <div class="sonic-sprite" id="sonic"></div>
            </div>
        </div>

        <div class="controls-deck">
            <div class="action-pad">
                <div class="act-btn" onclick="sonicAction('spin')">نط</div>
                <div class="act-btn" onclick="sonicAction('speed')">سرعة</div>
            </div>
            <div class="d-pad">
                <div></div><div class="d-btn" onclick="moveSonic('up')">⬆️</div><div></div>
                <div class="d-btn" onclick="moveSonic('left')">⬅️</div>
                <div class="d-btn" onclick="resetSonic()">⚡</div>
                <div class="d-btn" onclick="moveSonic('right')">➡️</div>
                <div></div><div class="d-btn" onclick="moveSonic('down')">⬇️</div><div></div>
            </div>
        </div>
    </div>

    <script>
        let sonicX = 50;
        let score = 0;
        const sonic = document.getElementById('sonic');
        const ground = document.getElementById('ground');

        function moveSonic(dir) {
            if(dir === 'right') {
                sonicX += 20;
                sonic.style.transform = "scaleX(1)"; // لليمين
                score += 10;
            }
            if(dir === 'left') {
                sonicX -= 20;
                sonic.style.transform = "scaleX(-1)"; // انعكاس لليسار
            }
            if(sonicX > 300) sonicX = 300;
            if(sonicX < 10) sonicX = 10;
            
            sonic.style.left = sonicX + 'px';
            document.getElementById('score-text').innerText = "النقاط: " + score;
        }

        function sonicAction(type) {
            if(type === 'spin') {
                sonic.style.transform = "rotate(360deg)";
                setTimeout(() => { sonic.style.transform = "none"; }, 300);
                score += 50;
            } else if(type === 'speed') {
                sonicX += 60;
                if(sonicX > 300) sonicX = 300;
                sonic.style.left = sonicX + 'px';
                score += 100;
            }
            document.getElementById('score-text').innerText = "النقاط: " + score;
        }

        function resetSonic() {
            sonicX = 50;
            score = 0;
            sonic.style.left = sonicX + 'px';
            document.getElementById('score-text').innerText = "النقاط: 0";
        }
    </script>
</body>
</html>
