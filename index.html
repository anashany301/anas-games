<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة ألعاب فلامينجو 🕹️ - المحرك الذكي</title>
    <link rel="manifest" href="manifest.json?v=10.0">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { font-family: Tahoma, sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; direction: rtl; overflow-x: hidden; }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 24px; }
        
        .install-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px dashed #38bdf8;
            padding: 12px;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            max-width: 380px;
            text-align: center;
        }
        .install-banner p { margin: 0 0 8px 0; color: #38bdf8; font-size: 13px; font-weight: bold; }
        .install-banner button {
            background: #10b981; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%;
        }

        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        .game-card { padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: right; }
        .game-card:hover { background: #334155; }

        /* شاشة اللعبة النشطة */
        #game-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            flex-direction: column;
        }
        canvas {
            flex: 1;
            background: #111;
            display: block;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 10px;
            right: 15px;
            left: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 102;
        }
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 102;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            z-index: 103;
            pointer-events: auto;
        }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية -->
    <div id="main-interface">
        <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

        <div class="install-banner">
            <p>📱 تبغى تثبيت الموقع كـ تطبيق أوفلاين بالكامل؟</p>
            <button onclick="showInstallHelp()">اضغط هنا لمعرفة طريقة التثبيت السريعة 📥</button>
        </div>

        <div class="filter-container">
            <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
            <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
            <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
        </div>

        <div class="games-grid" id="gamesGrid">
            <div class="loading">جاري تحميل المحرك الذكي وقائمة الألعاب أوفلاين... ⏳</div>
        </div>
    </div>

    <!-- شاشة تشغيل الألعاب التوليدية والرسومية عبر الكانفاس -->
    <div id="game-screen">
        <button id="back-btn" onclick="exitGame()">رجوع للقائمة</button>
        <div id="hud">
            <span id="score-display">النقاط: 0</span>
            <span id="game-title-display">العنوان</span>
        </div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="mobile-controls">
            <div class="control-group">
                <button class="ctrl-btn" id="btn-left">◀</button>
                <button class="ctrl-btn" id="btn-right">▶</button>
            </div>
            <div class="control-group">
                <button class="ctrl-btn" id="btn-action">▲</button>
            </div>
        </div>
    </div>

    <script>
        let engineData = null;
        let isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
        let mobileControls = document.getElementById("mobile-controls");
        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        let animationFrameId = null;
        let keys = {};
        let touchState = { left: false, right: false, action: false };

        // تسجيل Service Worker للعمل أوفلاين بالكامل
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    reg.update();
                }).catch(() => {});
            });
        }

        // جلب ملف engine.json وقراءة المحرك الذكي
        async function loadEngine() {
            try {
                let response = await fetch('./engine.json');
                engineData = await response.json();
                buildGamesList();
            } catch (e) {
                // لو فشل التحميل المباشر، نجرب القراءة من الكاش الداخلي أوفلاين
                try {
                    let cacheRes = await caches.match('./engine.json');
                    if(cacheRes) {
                        engineData = await cacheRes.json();
                        buildGamesList();
                        return;
                    }
                } catch(err) {}
                document.getElementById('gamesGrid').innerHTML = `<p style="color: #38bdf8;">🌐 تأكد من الاتصال لأول مرة لتخزين الملفات، أو أن ملف engine.json موجود بنفس المجلد.</p>`;
            }
        }

        // بناء قائمة الألعاب بناءً على بيانات الـ JSON
        function buildGamesList() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = "";

            // 1. إضافة الألعاب الكلاسيكية المثبتة في مقدمة القائمة (ماريو وتيكن)
            if (engineData.infinite_autonomous_game_engine.priority_featured_classics) {
                engineData.infinite_autonomous_game_engine.priority_featured_classics.forEach(game => {
                    let card = document.createElement('div');
                    card.className = 'game-card';
                    let catClass = game.type.includes('جماعية') ? 'multi' : 'single';
                    card.setAttribute('data-category', catClass);
                    card.innerHTML = `<div><h3>🎮 ${game.name}</h3><p style="font-size:11px; color:#888;">${game.description}</p></div><span style="color:#666;">▶</span>`;
                    card.onclick = () => launchEngineGame(game.id, game.name);
                    grid.appendChild(card);
                });
            }

            // 2. توليد القائمة اللانهائية للمئات من الألعاب تلقائياً
            for (let i = 2; i < 50; i++) {
                let prefixes = engineData.infinite_autonomous_game_engine.smart_distribution_and_type_classifier.arabic_prefixes;
                let suffixes = engineData.infinite_autonomous_game_engine.smart_distribution_and_type_classifier.arabic_suffixes;
                
                let p = prefixes[i % prefixes.length];
                let s = suffixes[(i * 3) % suffixes.length];
                let typeRoll = i % 100;
                let isMulti = typeRoll >= 90;
                let typeText = isMulti ? "جماعية (ثنائية) 👥" : "فردية (مستقلة) 👤";
                let catClass = isMulti ? 'multi' : 'single';
                
                let gameName = `${p} ${s} #${i}`;

                let card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-category', catClass);
                card.innerHTML = `<div><h3>🕹️ ${gameName}</h3><p style="font-size:11px; color:#888;">نوع اللعبة: ${typeText}</p></div><span style="color:#666;">▶</span>`;
                card.onclick = () => launchEngineGame(i, gameName);
                grid.appendChild(card);
            }
        }

        // فلترة الألعاب
        window.filterGames = function(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // إعدادات التحكم التلقائي للجهاز (موبايل أو كمبيوتر)
        if (isMobile) {
            mobileControls.style.display = "flex";
        }

        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        function bindTouchButton(id, stateKey) {
            let btn = document.getElementById(id);
            if(!btn) return;
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); touchState[stateKey] = true; });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); touchState[stateKey] = false; });
            btn.addEventListener("mousedown", () => { touchState[stateKey] = true; });
            btn.addEventListener("mouseup", () => { touchState[stateKey] = false; });
        }
        bindTouchButton("btn-left", "left");
        bindTouchButton("btn-right", "right");
        bindTouchButton("btn-action", "action");

        // نظام الصوت المدمج بدون نت (Web Audio API) باستخدام بيانات الـ JSON
        let audioCtx = null;
        function playEngineSound(effectName) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let effects = engineData.infinite_autonomous_game_engine.sound_and_effects_engine.effects_mapping;
                let fx = effects[effectName] || { frequency: 440, duration: 0.1, type: 'sine' };

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = fx.type;
                osc.frequency.value = fx.frequency;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + fx.duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + fx.duration);
            } catch (e) {}
        }

        // تشغيل اللعبة عبر محرك الـ Canvas اللحظي
        function launchEngineGame(seed, name) {
            document.getElementById("main-interface").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            document.getElementById("game-title-display").innerText = name;
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;

            initGameLoop(seed);
        }

        window.exitGame = function() {
            cancelAnimationFrame(animationFrameId);
            document.getElementById("game-screen").style.display = "none";
            document.getElementById("main-interface").style.display = "block";
        }

        let player, obstacles, score, gameSpeed;

        function initGameLoop(seed) {
            score = 0;
            gameSpeed = 4;
            let playerColor = seed === 0 ? '#E52521' : seed === 1 ? '#FF4500' : '#4CAF50';
            
            player = {
                x: 80,
                y: canvas.height - 150,
                width: 40,
                height: 50,
                vy: 0,
                jumpPower: -12,
                gravity: 0.6,
                grounded: false,
                color: playerColor
            };
            obstacles = [];

            function loop() {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // رسم الأرضية
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

                // حركة اللاعب عبر الكيبورد أو الأزرار
                let moveLeft = keys["ArrowLeft"] || keys["KeyA"] || touchState.left;
                let moveRight = keys["ArrowRight"] || keys["KeyD"] || touchState.right;
                let jumpAction = keys["Space"] || keys["ArrowUp"] || keys["KeyW"] || touchState.action;

                if (moveLeft) player.x -= 5;
                if (moveRight) player.x += 5;
                if (jumpAction && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    playEngineSound('jump');
                }

                // الجاذبية
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y > canvas.height - 80 - player.height) {
                    player.y = canvas.height - 80 - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                // توليد العقبات
                if (Math.random() < 0.02) {
                    obstacles.push({
                        x: canvas.width,
                        y: canvas.height - 120,
                        width: 30,
                        height: 40,
                        color: '#38bdf8'
                    });
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;

                    ctx.fillStyle = obs.color;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // الاصطدام
                    if (
                        player.x < obs.x + obs.width &&
                        player.x + player.width > obs.x &&
                        player.y < obs.y + obs.height &&
                        player.y + player.height > obs.y
                    ) {
                        playEngineSound('hit');
                        score = Math.max(0, score - 5);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                        score += 10;
                        playEngineSound('coin');
                    }
                }

                // رسم الشخصية
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(player.x + 25, player.y + 10, 8, 8);

                document.getElementById("score-display").innerText = "النقاط: " + score;

                animationFrameId = requestAnimationFrame(loop);
            }

            loop();
        }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        window.showInstallHelp = async function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("طريقة التثبيت السريعة:\n\n1. اضغط على زر القائمة (⋮) أعلى يمين متصفح كروم.\n2. اختر \"تثبيت التطبيق\" أو \"إضافة إلى الشاشة الرئيسية\".\n\nومبروك عليك الألعاب والمحرك يشتغلون أوفلاين تماماً! 🎮🚀");
            }
        }

        // تشغيل تحميل المحرك عند فتح الصفحة
        loadEngine();
    </script>
</body>
</html>
