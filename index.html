<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anas Games - مكتبة ماريو</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    h1 { margin-bottom: 20px; color: #ff4757; }
    #search { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 2px solid #ff4757; background: #1e1e1e; color: #fff; font-size: 16px; margin-bottom: 30px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { transform: translateY(-5px); border-color: #ff4757; }
    .card h3 { font-size: 16px; margin-bottom: 15px; height: 40px; overflow: hidden; }
    .btn { background: #ff4757; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; }
    .btn:hover { background: #ff6b81; }
    
    /* Play Modal */
    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    #modal-content { width: 90%; max-width: 800px; height: 70vh; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    #modal-content iframe { width: 100%; height: 100%; border: none; }
    .close-btn { margin-top: 15px; background: #e74c3c; padding: 10px 25px; }
  </style>
</head>
<body>

  <h1>مكتبة الألعاب (Flamingo)</h1>
  <input type="text" id="search" placeholder="ابحث عن لعبه..." onkeyup="filterGames()">

  <div class="grid" id="games-container"></div>

  <!-- Modal View for Playing -->
  <div id="modal">
    <div id="modal-content"></div>
    <button class="btn close-btn" onclick="closeGame()">إغلاق اللعبة</button>
  </div>

  <script>
    let gamesData = [];

    // جلب ملف JSON وتشغيل الشبكة
    async function loadGames() {
      try {
        const response = await fetch('flamingo.json');
        gamesData = await response.json();
        renderGames(gamesData);
      } catch (err) {
        console.error("خطأ في تحميل ملف JSON:", err);
      }
    }

    function renderGames(list) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';
      list.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${game.title}</h3>
          <button class="btn" onclick="playGame(${index})">تشغيل اللعبة 🎮</button>
        `;
        container.appendChild(card);
      });
    }

    function filterGames() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = gamesData.filter(g => g.title.toLowerCase().includes(query));
      renderGames(filtered);
    }

    function playGame(index) {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = gamesData[index].embed;
      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = '';
      modal.style.display = 'none';
    }

    loadGames();
  </script>
</body>
</html>
