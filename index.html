<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* الشريط الجانبي (القائمة) */
        #sidebar {
            width: 320px;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #334155;
        }
        .header {
            padding: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            text-align: center;
        }
        .header h2 {
            margin: 0 0 10px 0;
            color: #38bdf8;
        }
        #search-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }
        #games-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .game-item {
            padding: 12px 15px;
            margin-bottom: 6px;
            background-color: #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-item:hover {
            background-color: #0284c7;
            color: #fff;
        }
        /* منطقة عرض اللعبة */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0b0f19;
            padding: 20px;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-msg {
            text-align: center;
            color: #64748b;
        }
        .welcome-msg h1 { color: #cbd5e1; margin-bottom: 10px; }
        /* تخصيص الـ iframe داخل العرض */
        #game-container iframe {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2> flamingogames 🎮</h2>
            <p style="margin: 0 0 12px 0; font-size: 13px; color: #94a3b8;">إجمالي الألعاب: <span id="count">0</span></p>
            <input type="text" id="search-box" placeholder="ابحث عن لعبة..." onkeyup="filterGames()">
        </div>
        <div id="games-list">
            <div style="text-align: center; color: #94a3b8; margin-top: 20px;">جاري تحميل القائمة...</div>
        </div>
    </div>

    <div id="content">
        <div id="game-container">
            <div class="welcome-msg">
                <h1>مرحباً بك في مكتبة ألعاب فلامينجو</h1>
                <p>اختر لعبة من القائمة الجانبية أو ابحث عنها للبدء باللعب فوراً!</p>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];

        // جلب ملف flamingo.json من نفس المستودع
        fetch('flamingo.json')
            .then(res => res.json())
            .then(data => {
                allGames = data;
                document.getElementById('count').innerText = data.length;
                displayGames(data);
                checkUrlParam(); // لفتح اللعبة لو فيه رابط مباشر في المتصفح
            })
            .catch(err => {
                console.error("Error loading flamingo.json:", err);
                document.getElementById('games-list').innerHTML = '<div style="color: #ef4444; text-align: center;">خطأ في تحميل ملف الألعاب!</div>';
            });

        function displayGames(games) {
            let listDiv = document.getElementById('games-list');
            listDiv.innerHTML = '';

            if (games.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 20px;">لا توجد نتائج مطابقة</div>';
                return;
            }

            games.forEach((game) => {
                let div = document.createElement('div');
                div.className = 'game-item';
                div.innerText = game.title;
                div.title = game.title; // عرض الاسم كاملاً عند الوقوف عليه بالماوس
                div.onclick = () => loadGame(game);
                listDiv.appendChild(div);
            });
        }

        function loadGame(game) {
            document.getElementById('game-container').innerHTML = game.embed;
            
            // تغيير رابط المتصفح ديناميكياً باسم اللعبة بدون إعادة تحميل الصفحة
            let slug = game.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            window.history.pushState({}, '', `?game=${slug}`);
        }

        // خاصية البحث السريع في القائمة
        function filterGames() {
            let query = document.getElementById('search-box').value.toLowerCase();
            let filtered = allGames.filter(g => g.title.toLowerCase().includes(query));
            displayGames(filtered);
        }

        // التحقق لو اليوزر فاتح برابط لعبة مباشر
        function checkUrlParam() {
            const params = new URLSearchParams(window.location.search);
            const gameQuery = params.get('game');
            if (gameQuery && allGames.length > 0) {
                let found = allGames.find(g => g.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') === gameQuery);
                if (found) {
                    loadGame(found);
                }
            }
        }
    </script>
</body>
</html>
