<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">Flamingo Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 40px;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ef4444;
        }
        h1 {
            font-size: 22px;
            color: #ef4444;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .game-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-3px);
            border-color: #ef4444;
        }
        .game-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #1e293b;
        }
        .game-card h3 {
            font-size: 13px;
            margin: 8px 0;
            height: 32px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .play-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }
        .page-btn {
            background: #1e293b;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn:disabled {
            border-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        #page-info {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">🦩 Flamingo Games</h1>
    </header>

    <div class="container">
        <div id="games-container" class="games-grid">
            <p style="text-align:center; grid-column: 1/-1;">جاري تحميل الألعاب...</p>
        </div>

        <div class="pagination">
            <button id="prev-btn" class="page-btn" onclick="changePage(-1)">السابق / Prev</button>
            <span id="page-info">1</span>
            <button id="next-btn" class="page-btn" onclick="changePage(1)">التالي / Next</button>
        </div>
    </div>

    <!-- شاشة إعلان الفيديو (ExoClick Video) -->
    <div id="video-ad-overlay" style="
        display: none; 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0, 0, 0, 0.95); 
        z-index: 999999; 
        align-items: center; 
        justify-content: center;
    ">
        <div style="text-align: center; color: white; width: 90%; max-width: 400px;">
            <ins class="eas6a97888e37" data-zoneid="6028854"></ins>
            <div style="margin-top: 15px;">
                <span id="ad-timer" style="font-size: 14px; font-weight: bold; color: #ef4444;">ستبدأ اللعبة خلال 5 ثوانٍ...</span>
            </div>
        </div>
    </div>

    <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
    <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>

    <script>
    let allGames = [];
    let currentPage = 1;
    const gamesPerPage = 24;

    const userLang = navigator.language || navigator.userLanguage;
    const isArabic = userLang.startsWith('ar');

    const titleEl = document.getElementById('header-title');
    const docTitle = document.getElementById('site-title');

    if (isArabic) {
        titleEl.innerText = "🦩 مكتبة ألعاب فلامينجو";
        docTitle.innerText = "مكتبة ألعاب فلامينجو";
    } else {
        titleEl.innerText = "🦩 Flamingo Games";
        docTitle.innerText = "Flamingo Games";
        document.documentElement.dir = "ltr";
        document.documentElement.lang = "en";
    }

    fetch('flamingo.json')
        .then(response => response.json())
        .then(data => {
            allGames = data;
            renderPage(currentPage);
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('games-container').innerHTML = '<p style="text-align:center; grid-column: 1/-1;">عذراً، تعذر تحميل الألعاب.</p>';
        });

    function renderPage(page) {
        const container = document.getElementById('games-container');
        container.innerHTML = '';
        
        const startIndex = (page - 1) * gamesPerPage;
        const endIndex = startIndex + gamesPerPage;
        const pageGames = allGames.slice(startIndex, endIndex);

        pageGames.forEach(game => {
            // قراءة اسم اللعبة
            const title = game.title || game.name || game.game_name || "Retro Game";
            
            // قراءة الرابط بجميع الأسماء المحتملة
            let targetUrl = game.url || game.link || game.iframe || game.embed || game.file || game.path || game.id || "";
            
            // معالجة صيغة الرابط
            if (targetUrl && typeof targetUrl === 'string') {
                targetUrl = targetUrl.trim();
                if (!targetUrl.startsWith('http') && !targetUrl.endsWith('.html') && !targetUrl.includes('?')) {
                    targetUrl = targetUrl + '.html';
                }
            }

            // التعامل مع الصور غير المتاحة
            const fallbackImage = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="90" viewBox="0 0 150 90"><rect width="100%" height="100%" fill="%231e293b"/><text x="50%" y="50%" fill="%23ef4444" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14">🎮 Game</text></svg>';
            const imageUrl = game.image || game.img || game.thumbnail || fallbackImage;

            const btnText = isArabic ? "تشغيل اللعبة" : "Play Game";

            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => playGameWithAd(targetUrl);
            
            card.innerHTML = `
                <img src="${imageUrl}" onerror="this.src='${fallbackImage}'" alt="${title}">
                <h3>${title}</h3>
                <button class="play-btn">${btnText}</button>
            `;
            container.appendChild(card);
        });

        document.getElementById('page-info').innerText = `${page} / ${Math.ceil(allGames.length / gamesPerPage)}`;
        document.getElementById('prev-btn').disabled = (page === 1);
        document.getElementById('next-btn').disabled = (endIndex >= allGames.length);

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changePage(step) {
        currentPage += step;
        renderPage(currentPage);
    }

    function playGameWithAd(gameUrl) {
        if (!gameUrl) {
            alert(isArabic ? "رابط اللعبة غير متاح حالياً" : "Game link not available");
            return;
        }
        
        const overlay = document.getElementById('video-ad-overlay');
        const timerText = document.getElementById('ad-timer');
        
        overlay.style.display = 'flex';
        let secondsLeft = 5;
        
        const interval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                timerText.innerText = isArabic ? 
                    `ستبدأ اللعبة خلال ${secondsLeft} ثوانٍ...` : 
                    `Game starts in ${secondsLeft}s...`;
            } else {
                clearInterval(interval);
                overlay.style.display = 'none';
                window.location.href = gameUrl;
            }
        }, 1000);
    }
    </script>
</body>
</html>
