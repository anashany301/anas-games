<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مكتبة ألعاب فلامينجو 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        
        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        
        .game-card-wrapper { background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .game-link { text-decoration: none; color: white; font-weight: bold; font-size: 15px; display: block; }
        .game-link:hover { color: #38bdf8; }
        
        /* زرار نسخ اللينك الذكي للألعاب الجماعية */
        .share-btn { background: #0284c7; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .share-btn:hover { background: #38bdf8; color: #0f172a; }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
    </div>

    <div class="games-grid" id="gamesGrid">
        <div class="loading">جاري تحليل وفحص الألعاب أوتوماتيك... ⏳</div>
    </div>

    <script>
        const username = "anashany301"; 
        const repo = "anas-games"; 

        async function fetchAndAnalyzeGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                grid.innerHTML = ""; 

                for (const file of files) {
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        let category = 'single'; 
                        let displayName = file.name.replace('.html', '').replace(/_/g, ' ');

                        try {
                            const fileResponse = await fetch(file.download_url);
                            const fileContent = await fileResponse.text();

                            const multiKeywords = ['room', 'createroom', 'join', 'socket', 'peer', 'multiplayer', 'online', 'روم'];
                            const isMulti = multiKeywords.some(keyword => fileContent.toLowerCase().includes(keyword));

                            if (isMulti) {
                                category = 'multi';
                            }
                        } catch (err) {
                            console.log("تعذر فحص محتوى الملف:", file.name);
                        }

                        // إنشاء كارت اللعبة
                        const wrapper = document.createElement('div');
                        wrapper.className = 'game-card-wrapper';
                        wrapper.setAttribute('data-category', category);

                        const card = document.createElement('a');
                        card.href = file.name;
                        card.className = 'game-link';
                        card.textContent = displayName;
                        wrapper.appendChild(card);

                        // لو اللعبة جماعية، نضيف ليها زرار "نسخ رابط اللعبة الذكي" أوتوماتيكياً
                        if (category === 'multi') {
                            const shareBtn = document.createElement('button');
                            shareBtn.className = 'share-btn';
                            shareBtn.textContent = '🔗 نسخ رابط اللعبة الذكي (جماعي)';
                            
                            shareBtn.onclick = () => {
                                // رابط اللعبة الكامل على الموقع
                                let gameUrl = window.location.origin + window.location.pathname.replace('index.html', '') + file.name;
                                
                                // تحويله لرابط عميق (Deep Link) الخاص بالتطبيق
                                let smartLink = `flamengogames://open?game=${encodeURIComponent(gameUrl)}`;
                                
                                navigator.clipboard.writeText(smartLink).then(() => {
                                    alert("تم نسخ الرابط الذكي للعبة الجماعية! 🚀 ابعته لصاحبك.");
                                });
                            };
                            
                            wrapper.appendChild(shareBtn);
                        }

                        grid.appendChild(wrapper);
                    }
                }
            } catch (error) {
                grid.innerHTML = `<p style="color: red;">عذراً، حصل خطأ أثناء جلب الألعاب!</p>`;
                console.error(error);
            }
        }

        function filterGames(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const wrappers = document.querySelectorAll('.game-card-wrapper');
            wrappers.forEach(wrapper => {
                const cardCategory = wrapper.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    wrapper.classList.remove('hidden');
                } else {
                    wrapper.classList.add('hidden');
                }
            });
        }

        fetchAndAnalyzeGames();
    </script>

</body>
</html>
