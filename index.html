<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلامينجو أركيد - محاكي الألعاب الحقيقي</title>
    <style>
        :root { --bg: #030712; --card: #0f172a; --accent: #f43f5e; --text: #f8fafc; --muted: #94a3b8; }
        body { background-color: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 0; user-select: none; }
        
        header { padding: 14px; background: #0b1120; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 10; }
        h1 { color: var(--accent); margin: 0; font-size: 15px; }
        p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }

        .arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 15px; max-width: 1200px; margin: 0 auto; }
        
        .game-card { 
            background: linear-gradient(145deg, var(--card), #030712); 
            padding: 8px; border-radius: 10px; border: 2px solid #1e293b; 
            text-align: center; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s;
        }
        .game-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        
        .game-thumb { width: 100%; height: 90px; background: #000; border-radius: 6px; object-fit: cover; border: 1px solid #334155; }

        button { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 10px; margin-top: 6px; width: 100%; }
        button:hover { background: #e11d48; }

        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        
        #emulator-screen { width: 256px; height: 240px; background: #000; border: 3px solid var(--accent); border-radius: 6px; box-shadow: 0 0 25px rgba(244,63,94,0.6); }

        .controls { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-top: 15px; justify-content: center; }
        .controls button { padding: 10px; font-size: 12px; background: #1e293b; border: 1px solid #334155; }

        .back-btn { background: #ef4444; margin-top: 15px; padding: 7px 22px; font-size: 11px; border-radius: 5px; color: #fff; border: none; cursor: pointer; font-weight: bold; width: auto; }
    </style>
</head>
<body>

    <header>
        <h1>🦩 فلامينجو أركيد - المحاكي الداخلي</h1>
        <p>تشغيل الألعاب والكلاسيكيات بمحاكي الويب المباشر</p>
    </header>

    <div id="list-screen">
        <div class="arcade-grid">
            <div class="game-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1566577739112-5130d4214ce0?w=300&q=80" class="game-thumb" alt="سوبر ماريو">
                    <h4 style="margin:6px 0 2px; color:#f8fafc; font-size:11px;">سوبر ماريو الكلاسيكية</h4>
                    <p style="margin:0; color:var(--muted); font-size:8px; height:20px;">لعبة منصات نينتندو الأصلية</p>
                </div>
                <button onclick="launchEmulator('mario')">العب الآن</button>
            </div>
            <div class="game-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=300&q=80" class="game-thumb" alt="ديناصور الكروم">
                    <h4 style="margin:6px 0 2px; color:#f8fafc; font-size:11px;">ديناصور الكروم</h4>
                    <p style="margin:0; color:var(--muted); font-size:8px; height:20px;">القفز فوق الصبار</p>
                </div>
                <button onclick="launchDino()">العب الآن</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <h3 id="game-title-hud" style="color: var(--accent); margin: 6px; font-size: 14px;"></h3>
        <canvas id="emulator-screen" width="256" height="240"></canvas>
        
        <div class="controls">
            <div></div><button onclick="pressKey('Up')">⬆️</button><div></div>
            <button onclick="pressKey('Left')">⬅️</button><button onclick="pressKey('Select')">⚡</button><button onclick="pressKey('Right')">➡️</button>
            <div></div><button onclick="pressKey('Down')">⬇️</button><div></div>
        </div>

        <button class="back-btn" onclick="closeGame()">الرجوع للقائمة الرئيسية</button>
    </div>

    <script>
        function launchEmulator(game) {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = "سوبر ماريو الأسطورية";
            
            // رسم شاشة تشغيل المحاكي التفاعلي المحلي
            const canvas = document.getElementById('emulator-screen');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#5c94fc";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#fff";
            ctx.font = "12px Tahoma";
            ctx.fillText("اضغط على أزرار التحكم للبدء", 45, 120);
        }

        function launchDino() {
            window.location.href = "https://chromedino.com/";
        }

        function pressKey(dir) {
            console.log("تم ضغط زر: " + dir);
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }
    </script>
</body>
</html>
