<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">مكتبة ألعاب فلامينجو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 30px;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ef4444;
        }
        h1 {
            font-size: 22px;
            color: #ef4444;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }
        .game-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-3px);
            border-color: #ef4444;
        }
        .game-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
        }
        .game-card h3 {
            font-size: 13px;
            margin: 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .play-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">🦩 مكتبة ألعاب فلامينجو</h1>
    </header>

    <div class="container">
        <div id="games-container" class="games-grid">
            <!-- سيتم تحميل الألعاب من ملف flamingo.json تلقائياً هنا -->
        </div>
    </div>

    <!-- شاشة إعلان الفيديو (ExoClick Video) -->
    <div id="video-ad-overlay" style="
        display: none; 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0, 0, 0, 0.95); 
        z-index: 999999; 
        align-items: center; 
        justify-content: center;
    ">
        <div style="text-align: center; color: white; width: 90%; max-width: 400px;">
            <ins class="eas6a97888e37" data-zoneid="6028854"></ins>
            <div style="margin-top: 15px;">
                <span id="ad-timer" style="font-size: 14px; font-weight: bold; color: #ef4444;">ستبدأ اللعبة خلال 5 ثوانٍ...</span>
            </div>
        </div>
    </div>

    <!-- سكريبت إعلانات ExoClick -->
    <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
    <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>

    <script>
    // 1. تحديد لغة الجهاز وعرض العنوان المناسب (عربي أم أجنبي)
    const userLang = navigator.language || navigator.userLanguage;
    const isArabic = userLang.startsWith('ar');

    const titleEl = document.getElementById('header-title');
    const docTitle = document.getElementById('site-title');

    if (isArabic) {
        titleEl.innerText = "🦩 مكتبة ألعاب فلامينجو";
        docTitle.innerText = "مكتبة ألعاب فلامينجو";
    } else {
        titleEl.innerText = "🦩 Flamingo Games";
        docTitle.innerText = "Flamingo Games";
        document.documentElement.dir = "ltr";
        document.documentElement.lang = "en";
    }

    // 2. قراءة الألعاب من ملف flamingo.json وعرضها
    fetch('flamingo.json')
        .then(response => response.json())
        .then(games => {
            const container = document.getElementById('games-container');
            container.innerHTML = '';
            
            games.forEach(game => {
                const btnText = isArabic ? "تشغيل اللعبة" : "Play Game";
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => playGameWithAd(game.url);
                
                card.innerHTML = `
                    <img src="${game.image || 'https://via.placeholder.com/150'}" alt="${game.title}">
                    <h3>${game.title}</h3>
                    <button class="play-btn">${btnText}</button>
                `;
                container.appendChild(card);
            });
        })
        .catch(err => console.error('Error loading flamingo.json:', err));

    // 3. تشغيل إعلان الفيديو 5 ثوانٍ ثم فتح اللعبة
    function playGameWithAd(gameUrl) {
        const overlay = document.getElementById('video-ad-overlay');
        const timerText = document.getElementById('ad-timer');
        
        overlay.style.display = 'flex';
        let secondsLeft = 5;
        
        const interval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                timerText.innerText = isArabic ? 
                    `ستبدأ اللعبة خلال ${secondsLeft} ثوانٍ...` : 
                    `Game starts in ${secondsLeft}s...`;
            } else {
                clearInterval(interval);
                overlay.style.display = 'none';
                window.location.href = gameUrl;
            }
        }, 1000);
    }
    </script>
</body>
</html>
