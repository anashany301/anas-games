<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب السحابية من GitHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 900px; }
        h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        
        .stats-bar { background: #1e293b; border: 1px solid #334155; padding: 8px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #38bdf8; font-size: 0.95rem; width: 100%; max-width: 900px; text-align: center; }

        .controls { width: 100%; max-width: 900px; display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select { padding: 10px 14px; font-size: 0.95rem; border-radius: 8px; border: 2px solid #334155; background-color: #1e293b; color: #fff; outline: none; cursor: pointer; }
        
        .grid-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .game-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .game-info h3 { font-size: 1rem; color: #f1f5f9; margin-bottom: 6px; word-break: break-word; }
        .game-info span { display: inline-block; background-color: #0369a1; color: #e0f2fe; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-bottom: 12px; }
        
        .play-btn { background: #0284c7; color: white; border: none; padding: 9px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: bold; text-align: center; width: 100%; text-decoration: none; display: block; }
        .play-btn:hover { background: #0ea5e9; }

        #loading { color: #38bdf8; font-weight: bold; margin: 20px 0; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>منصة الألعاب السحابية من GitHub</h1>
        <p>ألعاب جاهزة ومستودعات مباشرة تعمل بكامل المحاكي</p>
    </header>

    <div class="stats-bar" id="statsBar">عدد الألعاب المتاحة: 0</div>

    <div class="controls">
        <select id="platformSelect" onchange="loadGitHubCatalog()">
            <option value="nes">ألعاب نينتندو (NES)</option>
            <option value="snes">ألعاب سوبر نينتندو (SNES)</option>
            <option value="sega">ألعاب سيجا (SEGA)</option>
        </select>
    </div>

    <div id="loading">جاري جلب القائمة من مستودع GitHub...</div>
    <div class="grid-container" id="gamesGrid"></div>

    <script>
        async function loadGitHubCatalog() {
            const platform = document.getElementById('platformSelect').value;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('gamesGrid').innerHTML = '';
            document.getElementById('statsBar').innerText = 'جاري الاتصال بالمستودع...';

            // سحب ملف الـ JSON المباشر من مستودع GitHub موثوق لألعاب الكلاسيك
            const jsonUrl = 'https://raw.githubusercontent.com/gamesforsite/webretro/main/roms.json';

            try {
                const response = await fetch(jsonUrl);
                const data = await response.json();
                
                // تصفية الألعاب بناءً على المنصة المختارة
                let games = data.listing.filter(game => {
                    if (platform === 'nes') return game.system === 'nes';
                    if (platform === 'snes') return game.system === 'snes';
                    if (platform === 'sega') return game.system === 'sega' || game.system === 'genesis';
                    return true;
                });

                renderGrid(games, platform);
            } catch (e) {
                console.error("خطأ في الاتصال بمستودع جيت هب", e);
                document.getElementById('statsBar').innerText = 'فشل الاتصال بالمستودع الخارجي';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderGrid(games, platform) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if(games.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">لا توجد ألعاب متاحة لهذه القائمة حالياً</p>';
                document.getElementById('statsBar').innerText = 'عدد الألعاب المتاحة: 0';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                // رابط تشغيل يعتمد على محاكي ويب مباشر
                const playUrl = `https://webretro.io/?system=${platform}&rom=${encodeURIComponent(game.filename)}`;

                card.innerHTML = `
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <span>${platform.toUpperCase()}</span>
                    </div>
                    <a class="play-btn" href="${playUrl}" target="_blank">تشغيل مباشر</a>
                `;
                grid.appendChild(card);
            });

            document.getElementById('statsBar').innerText = `عدد الألعاب المتاحة: ${games.length}`;
        }

        window.onload = function() {
            loadGitHubCatalog();
        };
    </script>
</body>
</html>
