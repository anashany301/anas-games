<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Anas Games - مكتبة الألعاب</title>

  <!-- meta verification for SEO -->
  <meta name="google-site-verification" content="googlecae08424b" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    h1 { margin-bottom: 20px; color: #ff4757; }
    #search { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 2px solid #ff4757; background: #1e1e1e; color: #fff; font-size: 16px; margin-bottom: 25px; outline: none; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { transform: translateY(-5px); border-color: #ff4757; }
    .card h3 { font-size: 16px; margin-bottom: 15px; min-height: 40px; overflow: hidden; }
    .btn { background: #ff4757; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
    .btn:hover { background: #ff6b81; }

    /* النافذة المنبثقة للعبة */
    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    #modal-content { width: 95%; max-width: 850px; height: 75vh; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    #modal-content iframe { width: 100%; height: 100%; border: none; }
    .close-btn { margin-top: 15px; background: #e74c3c; padding: 10px 30px; }
  </style>
</head>
<body>

  <h1 id="main-heading">مكتبة الألعاب (Flamingo)</h1>
  <input type="text" id="search" placeholder="ابحث عن لعبة..." onkeyup="filterGames()">

  <div class="grid" id="games-container">
    <p id="loading-text">جاري تحميل الألعاب...</p>
  </div>

  <div id="modal">
    <div id="modal-content"></div>
    <button class="btn close-btn" id="close-btn" onclick="closeGame()">إغلاق اللعبة</button>
  </div>

  <script>
    let gamesData = [];

    // 🔗 رابط Monetag Direct Link الخاص بك
    const monetagDirectLink = "https://omg10.com/4/11798311";

    // 🌍 قاموس اللغات للواجهة
    const translations = {
      ar: {
        title: "Anas Games - مكتبة الألعاب",
        heading: "مكتبة الألعاب (Flamingo)",
        searchPlaceholder: "ابحث عن لعبة...",
        loading: "جاري تحميل الألعاب...",
        error: "فشل تحميل الألعاب!",
        playBtn: "تشغيل اللعبة 🎮",
        closeBtn: "إغلاق اللعبة",
        dir: "rtl"
      },
      en: {
        title: "Anas Games - Game Library",
        heading: "Flamingo Game Library",
        searchPlaceholder: "Search for a game...",
        loading: "Loading games...",
        error: "Failed to load games!",
        playBtn: "Play Game 🎮",
        closeBtn: "Close Game",
        dir: "ltr"
      }
    };

    // فحص لغة متصفح الزائر
    const userLang = navigator.language || navigator.userLanguage;
    const isArabic = userLang.startsWith('ar');
    const lang = isArabic ? translations.ar : translations.en;

    // تطبيق لغة الواجهة والاتجاه فور تحميل الصفحة
    function applyLanguage() {
      document.getElementById('html-root').lang = isArabic ? 'ar' : 'en';
      document.getElementById('html-root').dir = lang.dir;
      document.getElementById('page-title').innerText = lang.title;
      document.getElementById('main-heading').innerText = lang.heading;
      document.getElementById('search').placeholder = lang.searchPlaceholder;
      document.getElementById('loading-text').innerText = lang.loading;
      document.getElementById('close-btn').innerText = lang.closeBtn;
    }

    async function fetchGames() {
      const container = document.getElementById('games-container');
      try {
        const response = await fetch('./flamingo.json');
        if (!response.ok) throw new Error('File not found');
        gamesData = await response.json();
        renderGames(gamesData);
      } catch (error) {
        container.innerHTML = `<p style="color:#ff4757;">${lang.error}</p>`;
      }
    }

    function renderGames(list) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';
      list.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${game.title}</h3>
          <button class="btn" onclick="playGame(${index})">${lang.playBtn}</button>
        `;
        container.appendChild(card);
      });
    }

    function filterGames() {
      const query = document.getElementById('search').value.toLowerCase();
      renderGames(gamesData.filter(g => g.title.toLowerCase().includes(query)));
    }

    function playGame(index) {
      window.open(monetagDirectLink, '_blank');
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = gamesData[index].embed;
      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = '';
      modal.style.display = 'none';
    }

    // تشغيل اللغة والتحميل عند البداية
    applyLanguage();
    fetchGames();
  </script>
</body>
</html>
