<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; margin: 0; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        
        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        
        .game-card { padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 15px; transition: 0.3s; display: block; text-align: right; }
        .game-card:hover { background: #334155; }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
    </div>

    <div class="games-grid" id="gamesGrid">
        <div class="loading">جاري تحليل وفحص الألعاب أوتوماتيك... ⏳</div>
    </div>

    <script>
        const username = "anashany301"; 
        const repo = "anas-games"; 

        async function fetchAndAnalyzeGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                grid.innerHTML = ""; 

                for (const file of files) {
                    if (file.name.endsWith('.html') && file.name !== 'index.html' && file.name !== 'multiplayer-helper.html') {
                        let category = 'single'; 
                        let displayName = file.name.replace('.html', '').replace(/_/g, ' ');

                        try {
                            const fileResponse = await fetch(file.download_url);
                            let fileContent = await fileResponse.text();

                            const multiKeywords = ['room', 'createroom', 'join', 'socket', 'peer', 'multiplayer', 'online', 'روم'];
                            const isMulti = multiKeywords.some(keyword => fileContent.toLowerCase().includes(keyword));

                            if (isMulti) {
                                category = 'multi';
                                
                                // حقن كود الرابط العميق لتعديل زر النسخ داخل الألعاب الجماعية تلقائياً
                                fileContent = fileContent.replace('</body>', `
                                    <script>
                                        window.addEventListener('DOMContentLoaded', () => {
                                            const buttons = document.querySelectorAll('button');
                                            buttons.forEach(btn => {
                                                if(btn.innerText.includes('نسخ') || btn.id.includes('copy')) {
                                                    btn.onclick = function(e) {
                                                        e.preventDefault();
                                                        let roomUrl = window.location.href; // رابط الغرفة الكامل
                                                        
                                                        // تحويله لرابط عميق متوافق مع تطبيق الحاوية WebintoApp
                                                        let deepLink = "flamengogames://open?url=" + encodeURIComponent(roomUrl);
                                                        
                                                        navigator.clipboard.writeText(deepLink).then(() => {
                                                            alert("تم نسخ الرابط العميق الذكي بنجاح! 🚀 ابعته لصاحبك.");
                                                        });
                                                    }
                                                }
                                            });
                                        });
                                    <\/script>
                                </body>`);
                            }
                        } catch (err) {
                            console.log("تعذر فحص محتوى الملف:", file.name);
                        }

                        // إنشاء كارت اللعبة النظيف في الواجهة برة
                        const card = document.createElement('a');
                        card.href = file.name;
                        card.className = 'game-card';
                        card.setAttribute('data-category', category);
                        card.textContent = `🎮 ${displayName}`;

                        grid.appendChild(card);
                    }
                }
            } catch (error) {
                grid.innerHTML = `<p style="color: red;">عذراً، حصل خطأ أثناء جلب الألعاب!</p>`;
                console.error(error);
            }
        }

        function filterGames(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        fetchAndAnalyzeGames();
    </script>

</body>
</html>
