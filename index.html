<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anas Games - مكتبة الألعاب</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    h1 { margin-bottom: 15px; color: #ff4757; }
    #search { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 2px solid #ff4757; background: #1e1e1e; color: #fff; font-size: 16px; margin-bottom: 25px; outline: none; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { transform: translateY(-5px); border-color: #ff4757; }
    .card h3 { font-size: 16px; margin-bottom: 15px; min-height: 40px; overflow: hidden; }
    .btn { background: #ff4757; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
    .btn:hover { background: #ff6b81; }

    /* Modal */
    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    #modal-content { width: 95%; max-width: 850px; height: 75vh; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    #modal-content iframe { width: 100%; height: 100%; border: none; }
    .close-btn { margin-top: 15px; background: #e74c3c; padding: 10px 30px; }

    /* Ad Container */
    .ad-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #181818; }
    .ad-timer { font-size: 18px; color: #ffbf00; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>مكتبة الألعاب (Flamingo)</h1>
  <input type="text" id="search" placeholder="ابحث عن لعبة..." onkeyup="filterGames()">

  <div class="grid" id="games-container">
    <p>جاري تحميل الألعاب...</p>
  </div>

  <div id="modal">
    <div id="modal-content"></div>
    <button class="btn close-btn" onclick="closeGame()">إغلاق</button>
  </div>

  <script>
    let gamesData = [];
    let currentAdTimer = null;

    async function fetchGames() {
      const container = document.getElementById('games-container');
      try {
        const response = await fetch('./flamingo.json');
        if (!response.ok) throw new Error('لم يتم العثور على الملف');
        gamesData = await response.json();
        renderGames(gamesData);
      } catch (error) {
        container.innerHTML = `<p style="color:#ff4757;">فشل تحميل الألعاب!</p>`;
      }
    }

    function renderGames(list) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';
      list.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${game.title}</h3>
          <button class="btn" onclick="playGame(${index})">تشغيل اللعبة 🎮</button>
        `;
        container.appendChild(card);
      });
    }

    function filterGames() {
      const query = document.getElementById('search').value.toLowerCase();
      renderGames(gamesData.filter(g => g.title.toLowerCase().includes(query)));
    }

    function playGame(index) {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      modal.style.display = 'flex';

      let timeLeft = 5;

      // إنشاء Ad Frame مستقل عبر srcdoc لتنفيذ سكريبت ExoClick بشكل صحيح
      const adHtml = `
        <!DOCTYPE html>
        <html>
        <body style="margin:0; background:#181818; display:flex; justify-content:center; align-items:center; height:100vh;">
          <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"><\/script>
          <ins class="eas6a97888e37" data-zoneid="6028854"></ins>
          <script>(AdProvider = window.AdProvider || []).push({"serve": {}});<\/script>
        </body>
        </html>
      `;

      content.innerHTML = `
        <div class="ad-wrapper">
          <div class="ad-timer">جاري تحميل اللعبة... ستعمل خلال <span id="timer">${timeLeft}</span> ثوانٍ</div>
          <iframe id="ad-frame" style="width:100%; height:300px; border:none;"></iframe>
        </div>
      `;

      document.getElementById('ad-frame').srcdoc = adHtml;

      currentAdTimer = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('timer');
        if (timerEl) timerEl.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(currentAdTimer);
          startActualGame(index);
        }
      }, 1000);
    }

    function startActualGame(index) {
      if (currentAdTimer) clearInterval(currentAdTimer);
      const content = document.getElementById('modal-content');
      content.innerHTML = gamesData[index].embed;
    }

    function closeGame() {
      if (currentAdTimer) clearInterval(currentAdTimer);
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = '';
      modal.style.display = 'none';
    }

    fetchGames();
  </script>
</body>
</html>
