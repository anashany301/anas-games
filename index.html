<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فلامينجو الأركيد العالمية</title>
    <style>
        :root { --bg: #090d16; --card: #131c31; --accent: #f43f5e; --text: #f8fafc; --muted: #94a3b8; }
        body { background-color: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 0; user-select: none; }
        
        header { padding: 18px; background: #0b1120; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1 { color: var(--accent); margin: 0; font-size: 18px; text-shadow: 0 0 12px rgba(244,63,94,0.6); }
        p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }

        .search-box { margin: 15px auto; width: 90%; max-width: 400px; }
        .search-box input { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; outline: none; }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(244,63,94,0.4); }

        .section-title { text-align: right; padding: 0 20px; margin: 20px 0 10px; color: #38bdf8; font-size: 14px; font-weight: bold; }
        
        .arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 15px 20px; max-width: 1200px; margin: 0 auto; }
        
        .game-card { 
            background: linear-gradient(145deg, var(--card), #0b1120); 
            padding: 10px; border-radius: 12px; border: 2px solid #1e293b; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); text-align: center; transition: 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .game-card:hover { border-color: var(--accent); transform: translateY(-4px); }
        
        .game-thumb { width: 100%; height: 100px; background: #000; border-radius: 8px; object-fit: cover; border: 1px solid #334155; }

        button { background: var(--accent); color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-top: 8px; width: 100%; transition: 0.2s; }
        button:hover { background: #e11d48; }

        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        
        #game-frame-wrapper { width: 95%; max-width: 750px; height: 80vh; border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(244, 63, 94, 0.6); border-radius: 10px; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .back-btn { background: #ef4444; margin-top: 15px; padding: 8px 25px; font-size: 12px; border-radius: 6px; color: #fff; border: none; cursor: pointer; font-weight: bold; width: auto; }
    </style>
</head>
<body>

    <header>
        <h1>🦩 فلامينجو أركيد الأسطورية</h1>
        <p>مكتبة ضخمة تضم أشهر الألعاب الكلاسيكية الأصلية بررسومياتها الكاملة</p>
    </header>

    <div id="list-screen">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن لعبتك المفضلة..." onkeyup="filterGames()">
        </div>

        <div class="section-title">🕹️ الألعاب الأصلية الكبرى والريترو</div>
        <div class="arcade-grid" id="games-grid"></div>
    </div>

    <div id="game-container">
        <h3 id="game-title-hud" style="color: var(--accent); margin: 8px; font-size: 15px;"></h3>
        <div id="game-frame-wrapper">
            <iframe id="real-game-iframe" src="" allowfullscreen></iframe>
        </div>
        <button class="back-btn" onclick="closeGame()">الرجوع للقائمة الرئيسية</button>
    </div>

    <script>
        // قاعدة بيانات ضخمة لأشهر الألعاب الأصلية بروابط إيمبد حقيقية
        const masterGames = [
            { name: "سوبر ماريو بروس", url: "https://www.retrogames.cc/embed/2813-super-mario-bros.html", thumb: "https://images.unsplash.com/photo-1566577739112-5130d4214ce0?w=300&q=80", desc: "مغامرة ماريو الكلاسيكية" },
            { name: "سونيك القنفذ", url: "https://www.retrogames.cc/embed/4183-sonic-the-hedgehog-usa.html", thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&q=80", desc: "أسطورة السرعة لسيجا" },
            { name: "تيكن 3 الأسطورية", url: "https://www.retrogames.cc/embed/3282-tekken-3.html", thumb: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300&q=80", desc: "القتال الحربي الشهير" },
            { name: "مورتال كومبات", url: "https://www.retrogames.cc/embed/9355-mortal-kombat.html", thumb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300&q=80", desc: "قتال الشوارع القوي" },
            { name: "باك مان الكلاسيكية", url: "https://www.retrogames.cc/embed/10146-pac-man.html", thumb: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300&q=80", desc: "أكل النقاط والمتاهات" },
            { name: "ستريت فايتر 2", url: "https://www.retrogames.cc/embed/20512-street-fighter-ii.html", thumb: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300&q=80", desc: "معارك الشوارع الثنائية" },
            { name: "ميجا مان الأصلية", url: "https://www.retrogames.cc/embed/18320-mega-man.html", thumb: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300&q=80", desc: "مغامرات البطل الآلي" },
            { name: "سبيس إنفادرز", url: "https://www.retrogames.cc/embed/21262-space-invaders.html", thumb: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=300&q=80", desc: "حرب الفضاء الكلاسيكية" },
            { name: "دونكي كونج", url: "https://www.retrogames.cc/embed/2750-donkey-kong.html", thumb: "https://images.unsplash.com/photo-1566577739112-5130d4214ce0?w=300&q=80", desc: "تحدي البراميل والصعود" },
            { name: "تاتريس الأركيد", url: "https://www.retrogames.cc/embed/29845-tetris.html", thumb: "https://images.unsplash.com/photo-1614680376593-902f749f7ffc?w=300&q=80", desc: "ترتيب المكعبات الشهير" },
            { name: "جولدن آي 007", url: "https://www.retrogames.cc/embed/9820-goldeneye-007.html", thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&q=80", desc: "التجسس والحركة الكلاسيكية" },
            { name: "بوكيمون يلو", url: "https://www.retrogames.cc/embed/21432-pokemon-yellow-version.html", thumb: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=300&q=80", desc: "إصدار بوكيمون الأصلي" }
        ];

        function renderGames(array) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = array.map(g => `
                <div class="game-card">
                    <div>
                        <img src="${g.thumb}" class="game-thumb" alt="${g.name}">
                        <h4 style="margin:8px 0 3px; color:#f8fafc; font-size:12px;">${g.name}</h4>
                        <p style="margin:0; color:var(--muted); font-size:9px; height:22px;">${g.desc}</p>
                    </div>
                    <button onclick="launchGame('${g.url}', '${g.name}')">العب الآن</button>
                </div>
            `).join('');
        }

        function filterGames() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = masterGames.filter(g => g.name.toLowerCase().includes(term));
            renderGames(filtered);
        }

        function launchGame(url, title) {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = title;
            document.getElementById('real-game-iframe').src = url;
        }

        function closeGame() {
            document.getElementById('real-game-iframe').src = '';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }

        renderGames(masterGames);
    </script>
</body>
</html>
