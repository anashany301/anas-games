<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; margin: 0; direction: rtl; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        
        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        
        .game-card { padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 15px; transition: 0.3s; display: block; text-align: right; cursor: pointer; }
        .game-card:hover { background: #334155; }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }

        /* ستايل نافذة إدخال الاسم المباشرة */
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; border: 2px solid #38bdf8; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box input { width: 90%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #38bdf8; text-align: center; background: #0f172a; color: white; font-size: 16px; outline: none; }
        .modal-box button { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-copy { background: #10b981; color: white; }
        .btn-play { background: #38bdf8; color: #0f172a; }
        .btn-close { background: #ef4444; color: white; margin-top: 12px; font-size: 12px; padding: 8px; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

    <div class="filter-container">
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
    </div>

    <div class="games-grid" id="gamesGrid">
        <div class="loading">جاري فحص وتصنيف الألعاب بدقة... ⏳</div>
    </div>

    <!-- نافذة إدخال الاسم ورابط الحاوية المباشر -->
    <div id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalGameTitle" style="color: #38bdf8; margin-top: 0;">غرفة اللعب الجماعي</h3>
            <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">اكتب اسمك عشان تنسخ رابط الحاوية المباشر:</p>
            <input type="text" id="modalPlayerName" placeholder="اكتب اسمك هنا...">
            <button class="btn-copy" onclick="copyHelperLink()">📋 نسخ رابط الحاوية المباشر</button>
            <button class="btn-play" onclick="playDirectly()">🎮 العب فوراً لوحدك</button>
            <button class="btn-close" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const username = "anashany301"; 
        const repo = "anas-games"; 
        let selectedGameFile = "";

        async function fetchAndAnalyzeGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                grid.innerHTML = ""; 

                for (const file of files) {
                    if (file.name.endsWith('.html') && file.name !== 'index.html' && file.name !== 'multiplayer-helper.html') {
                        let displayName = file.name.replace('.html', '').replace(/_/g, ' ');
                        let category = 'single'; 

                        try {
                            const gameRes = await fetch(file.download_url);
                            const gameHtml = await gameRes.text();
                            
                            if (
                                gameHtml.includes('إنشاء غرفة جديدة') || 
                                gameHtml.includes('انشاء غرفة جديدة') ||
                                gameHtml.toLowerCase().includes('peerjs') || 
                                gameHtml.toLowerCase().includes('socket.io')
                            ) {
                                category = 'multi';
                            }
                        } catch (e) {
                            console.log("خطأ في فحص الملف:", file.name);
                        }

                        const card = document.createElement('a');
                        card.className = 'game-card';
                        card.setAttribute('data-category', category);
                        card.textContent = `🎮 ${displayName} ${category === 'multi' ? '👥' : ''}`;

                        // لو اللعبة جماعية، عند الضغط تفتح نافذة إدخال الاسم بدل فتح اللعبة مباشرة
                        if (category === 'multi') {
                            card.href = "#";
                            card.onclick = (e) => {
                                e.preventDefault();
                                openModal(file.name, displayName);
                            };
                        } else {
                            card.href = file.name;
                        }

                        grid.appendChild(card);
                    }
                }
            } catch (error) {
                grid.innerHTML = `<p style="color: red;">عذراً، حصل خطأ أثناء جلب الألعاب!</p>`;
                console.error(error);
            }
        }

        function openModal(fileName, displayName) {
            selectedGameFile = fileName;
            document.getElementById('modalGameTitle').textContent = displayName;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalPlayerName').value = "";
            document.getElementById('modalPlayerName').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function copyHelperLink() {
            const playerName = document.getElementById('modalPlayerName').value.trim();
            if (!playerName) {
                alert("من فضلك اكتب اسمك الأول يا بطل! 🎮");
                document.getElementById('modalPlayerName').focus();
                return;
            }

            // رابط تطبيق الحاوية الأساسي
            let helperBaseUrl = "https://anas-games-omega.vercel.app/multiplayer-helper.html";
            
            // بناء الرابط المباشر الذي يفتح الحاوية ويسلمها اسم اللعبة واسم اللاعب
            let directHelperLink = `${helperBaseUrl}?game=${selectedGameFile}&name=${encodeURIComponent(playerName)}`;

            navigator.clipboard.writeText(directHelperLink).then(() => {
                alert(`تم نسخ رابط الحاوية المباشر يا ${playerName}! 🚀 ابعته لصاحبك هيفتحه يدخله على الحاوية فوراً.`);
                closeModal();
            });
        }

        function playDirectly() {
            const playerName = document.getElementById('modalPlayerName').value.trim();
            if (playerName) {
                localStorage.setItem('multiPlayerName', playerName);
            }
            window.location.href = selectedGameFile;
        }

        function filterGames(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        fetchAndAnalyzeGames();
    </script>

</body>
</html>
