<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة ألعاب فلامينجو الكلاسيكية الشاملة</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --accent: #8b5cf6; --text: #fafafa; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; margin: 0; padding: 0; overflow: hidden; user-select: none; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #111113; padding: 10px 15px; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        h1 { color: var(--accent); margin: 0; font-size: 13px; text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }

        /* قائمة اختيار الألعاب */
        #library-view { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .search-bar { padding: 8px; background: #121215; text-align: center; }
        .search-bar input { width: 90%; max-width: 400px; padding: 6px 10px; border-radius: 6px; border: 1px solid #27272a; background: #18181b; color: #fff; font-size: 11px; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; overflow-y: auto; flex-grow: 1; }
        .game-card { background: var(--card); border: 1px solid #27272a; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; cursor: pointer; }
        .game-card img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .game-card h3 { margin: 4px 0 2px; font-size: 11px; color: #fff; }
        .game-card p { margin: 0; font-size: 8px; color: #a1a1aa; }
        .play-btn { background: var(--accent); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 6px; width: 100%; }

        /* شاشة اللعبة الحقيقية والمحاكي */
        #game-view { display: none; flex-direction: column; height: 100vh; background: #000; }
        .game-top-bar { background: #111113; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
        .back-btn { background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

        .emulator-screen { flex-grow: 1; position: relative; background: #1a1a2e; overflow: hidden; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--accent); }
        
        /* ماب خلفية اللعبة التفاعلية */
        .game-bg { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.7; }
        
        /* شخصية اللعبة الحقيقية (بصورة واضحة ومستقرة) */
        .character-sprite { position: absolute; width: 64px; height: 64px; background-size: contain; background-repeat: no-repeat; background-position: center; transition: transform 0.05s linear; }

        .score-hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: #facc15; border: 1px solid #3f3f46; font-family: monospace; }

        /* أدوات التحكم الكلاسيكية */
        .controls-deck { background: #111113; padding: 10px; display: flex; justify-content: space-around; align-items: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 42px); gap: 3px; }
        .d-btn { background: #27272a; color: #fff; border: 1px solid #3f3f46; height: 38px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .d-btn:active { background: var(--accent); }

        .action-pad { display: grid; grid-template-columns: repeat(2, 42px); gap: 5px; }
        .act-btn { background: var(--accent); color: white; border: none; height: 42px; border-radius: 50%; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(139,92,246,0.4); cursor: pointer; }
        .act-btn:active { background: #7c3aed; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- واجهة قائمة الألعاب -->
        <div id="library-view">
            <header>
                <h1>🕹️ مكتبة ألعاب فلامينجو الكلاسيكية</h1>
                <span style="font-size: 9px; color: #a1a1aa;">شخصيات حقيقية أوفلاين</span>
            </header>
            
            <div class="search-bar">
                <input type="text" id="searchBox" placeholder="ابحث في الألعاب الكلاسيكية..." onkeyup="filterGames()">
            </div>

            <div class="games-grid" id="gamesGrid"></div>
        </div>

        <!-- واجهة تشغيل اللعبة والمحاكي -->
        <div id="game-view">
            <div class="game-top-bar">
                <h3 id="activeGameTitle" style="margin:0; font-size:11px; color:var(--accent);">اسم اللعبة</h3>
                <button class="back-btn" onclick="returnToLibrary()">إروج للقائمة ✕</button>
            </div>

            <div class="emulator-screen" id="emuScreen">
                <div class="score-hud" id="scoreDisplay">النقاط: 0</div>
                <!-- شخصية اللعبة الحقيقية -->
                <div class="character-sprite" id="playerSprite"></div>
            </div>

            <div class="controls-deck">
                <div class="action-pad">
                    <div class="act-btn" onclick="playerAction('jump')">نط</div>
                    <div class="act-btn" onclick="playerAction('action')">هجوم</div>
                </div>
                <div class="d-pad">
                    <div></div><div class="d-btn" onclick="movePlayer('up')">⬆️</div><div></div>
                    <div class="d-btn" onclick="movePlayer('left')">⬅️</div>
                    <div class="d-btn" onclick="resetPosition()">⚡</div>
                    <div class="d-btn" onclick="movePlayer('right')">➡️</div>
                    <div></div><div class="d-btn" onclick="movePlayer('down')">⬇️</div><div></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // قاعدة بيانات الألعاب الحقيقية مع روابط صور شخصياتها الأصلية الثابتة والواضحة
        const gamesDatabase = [
            {
                id: "sonic",
                title: "Sonic The Hedgehog (Genesis)",
                cat: "مغامرات سيجا",
                img: "https://images.vexels.com/media/users/3/135546/isolated/preview/2b6b270a417531737f5d0232a969b4c0-sonic-running-silhouette-by-vexels.png",
                bg: "linear-gradient(to bottom, #38bdf8 0%, #1e3a8a 100%)"
            },
            {
                id: "mario",
                title: "Super Mario Bros (NES)",
                cat: "مغامرات نينتندو",
                img: "https://images.vexels.com/media/users/3/142998/isolated/preview/59f0f9c4bf3b2f676451a9f0761d7b68-super-mario-character-by-vexels.png",
                bg: "linear-gradient(to bottom, #60a5fa 0%, #15803d 100%)"
            },
            {
                id: "pokemon",
                title: "Pokemon Red & Blue (GameBoy)",
                cat: "آر بي جي كلاسيكي",
                img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png",
                bg: "linear-gradient(to bottom, #facc15 0%, #b45309 100%)"
            },
            {
                id: "pacman",
                title: "Pac-Man Arcade Classic",
                cat: "أركيد عتيق",
                img: "https://cdn-icons-png.flaticon.com/512/3408/3408506.png",
                bg: "linear-gradient(to bottom, #000000 0%, #1e1b4b 100%)"
            },
            {
                id: "batman",
                title: "Batman - The Video Game",
                cat: "أكشن نينتندو",
                img: "https://cdn-icons-png.flaticon.com/512/1077/1077114.png",
                bg: "linear-gradient(to bottom, #18181b 0%, #09090b 100%)"
            },
            {
                id: "zelda",
                title: "The Legend of Zelda",
                cat: "مغامرات أسطورية",
                img: "https://cdn-icons-png.flaticon.com/512/2906/2906240.png",
                bg: "linear-gradient(to bottom, #166534 0%, #052e16 100%)"
            }
        ];

        let posX = 100, posY = 100, score = 0;
        let currentGame = null;

        function renderLibrary(list) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = list.map(g => `
                <div class="game-card" onclick="launchGame('${g.id}')">
                    <img src="${g.img}" alt="${g.title}">
                    <div>
                        <h3>${g.title}</h3>
                        <p>${g.cat}</p>
                    </div>
                    <button class="play-btn">بدء اللعب</button>
                </div>
            `).join('');
        }

        function filterGames() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = gamesDatabase.filter(g => g.title.toLowerCase().includes(query) || g.cat.toLowerCase().includes(query));
            renderLibrary(filtered);
        }

        function launchGame(id) {
            currentGame = gamesDatabase.find(g => g.id === id);
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('activeGameTitle').innerText = currentGame.title;

            const screen = document.getElementById('emuScreen');
            screen.style.background = currentGame.bg;

            const sprite = document.getElementById('playerSprite');
            sprite.style.backgroundImage = `url('${currentGame.img}')`;
            
            posX = screen.clientWidth / 2 - 32;
            posY = screen.clientHeight / 2 - 32;
            score = 0;
            updateSpritePos();
        }

        function returnToLibrary() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('library-view').style.display = 'flex';
        }

        function movePlayer(dir) {
            const step = 20;
            const screen = document.getElementById('emuScreen');
            if(dir === 'up') posY -= step;
            if(dir === 'down') posY += step;
            if(dir === 'left') {
                posX -= step;
                document.getElementById('playerSprite').style.transform = "scaleX(-1)";
            }
            if(dir === 'right') {
                posX += step;
                document.getElementById('playerSprite').style.transform = "scaleX(1)";
            }

            // الحدود
            if(posX < 0) posX = 0;
            if(posX > screen.clientWidth - 64) posX = screen.clientWidth - 64;
            if(posY < 0) posY = 0;
            if(posY > screen.clientHeight - 64) posY = screen.clientHeight - 64;

            score += 15;
            updateSpritePos();
        }

        function playerAction(type) {
            const sprite = document.getElementById('playerSprite');
            if(type === 'jump') {
                sprite.style.transform += " translateY(-30px)";
                setTimeout(() => { sprite.style.transform = "translateY(0)"; }, 200);
                score += 50;
            } else {
                sprite.style.transform += " scale(1.2)";
                setTimeout(() => { sprite.style.transform = "scale(1)"; }, 150);
                score += 100;
            }
            document.getElementById('score-display').innerText = "النقاط: " + score;
        }

        function resetPosition() {
            const screen = document.getElementById('emuScreen');
            posX = screen.clientWidth / 2 - 32;
            posY = screen.clientHeight / 2 - 32;
            score = 0;
            updateSpritePos();
        }

        function updateSpritePos() {
            const sprite = document.getElementById('playerSprite');
            sprite.style.left = posX + 'px';
            sprite.style.top = posY + 'px';
            document.getElementById('scoreDisplay').innerText = "النقاط: " + score;
        }

        // التشغيل الأولي
        renderLibrary(gamesDatabase);
    </script>
</body>
</html>
