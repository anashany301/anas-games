<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو 🎮</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; margin: 0; direction: rtl; }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 24px; }
        
        .install-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px dashed #38bdf8;
            padding: 12px;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            max-width: 380px;
            text-align: center;
        }
        .install-banner p { margin: 0 0 8px 0; color: #38bdf8; font-size: 13px; font-weight: bold; }
        .install-banner button {
            background: #10b981; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%;
        }

        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        .game-card { padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 15px; transition: 0.3s; display: block; text-align: right; cursor: pointer; }
        .game-card:hover { background: #334155; }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

    <div class="install-banner">
        <p>📱 تبغى تثبيت الموقع كـ تطبيق أوفلاين؟</p>
        <button onclick="showInstallHelp()">اضغط هنا لمعرفة طريقة التثبيت السريعة 📥</button>
    </div>

    <div class="filter-container">
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
    </div>

    <div class="games-grid" id="gamesGrid">
        <div class="loading">جاري فحص وتنزيل الألعاب بدقة... ⏳</div>
    </div>

    <script>
        let swRegistration = null;

        // تسجيل الـ Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    swRegistration = reg;
                }).catch(() => {});
            });

            // إظهار اشعار عند تنزيل لعبة جديدة
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'NEW_GAME_DOWNLOADED') {
                    showToast(`🎮 تم تنزيل لعبة جديدة أوفلاين: ${event.data.gameName.replace('.html', '')}`);
                }
            });
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#38bdf8; color:#0f172a; padding:10px 20px; border-radius:8px; font-weight:bold; z-index:10000; box-shadow:0 4px 10px rgba(0,0,0,0.3);';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        async function showInstallHelp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("طريقة التثبيت السريعة:\n\n1. اضغط على زر القائمة (⋮) أعلى يمين متصفح كروم.\n2. اختر \"تثبيت التطبيق\" أو \"إضافة إلى الشاشة الرئيسية\".\n\nومبروك عليك الألعاب بتشتغل أوفلاين! 🎮🚀");
            }
        }

        const username = "anashany301"; 
        const repo = "anas-games"; 

        const excludedFiles = [
            'index.html', 'room.html', 'sw.js', 'manifest.json', 'icon.png',
            'multiplayer-helper.html', 'injector.py', 'vercel.json', 'package.json', 'server.js', 'README.md'
        ];

        async function fetchAndAnalyzeGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                grid.innerHTML = ""; 

                for (const file of files) {
                    if (file.name.endsWith('.html') && !excludedFiles.includes(file.name)) {
                        let displayName = file.name.replace('.html', '').replace(/_/g, ' ');
                        let category = 'single'; 

                        try {
                            const gameRes = await fetch(file.download_url);
                            const gameHtml = await gameRes.text();
                            
                            if (
                                gameHtml.includes('إنشاء غرفة جديدة') || 
                                gameHtml.includes('انشاء غرفة جديدة') ||
                                gameHtml.toLowerCase().includes('peerjs') || 
                                gameHtml.toLowerCase().includes('socket.io')
                            ) {
                                category = 'multi';
                            }
                        } catch (e) {}

                        // أمر الـ Service Worker لتنزيل اللعبة وتخزينها للعمل أوفلاين
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({
                                type: 'CACHE_NEW_GAME',
                                url: `./${file.name}`,
                                name: file.name
                            });
                        }

                        const card = document.createElement('a');
                        card.className = 'game-card';
                        card.setAttribute('data-category', category);
                        card.textContent = `🎮 ${displayName} ${category === 'multi' ? '👥' : ''}`;

                        if (category === 'multi') {
                            card.href = "#";
                            card.onclick = (e) => {
                                e.preventDefault();
                                window.location.href = `room.html?game=${file.name}`;
                            };
                        } else {
                            card.href = file.name;
                        }

                        grid.appendChild(card);
                    }
                }

                if (grid.innerHTML === "") {
                    grid.innerHTML = `<p style="color: #cbd5e1;">لا توجد ألعاب مضافة حالياً.</p>`;
                }

            } catch (error) {
                grid.innerHTML = `<p style="color: #38bdf8;">🌐 أنت أوفلاين حالياً، جاري عرض الألعاب المحفوظة في الموبايل.</p>`;
                loadOfflineGames();
            }
        }

        // عرض الألعاب من الكاش لو الجهاز أوفلاين
        async function loadOfflineGames() {
            const grid = document.getElementById('gamesGrid');
            if ('caches' in window) {
                const cache = await caches.open('flamingo-games-v2');
                const keys = await cache.keys();
                grid.innerHTML = "";
                
                keys.forEach(request => {
                    const url = request.url;
                    if (url.endsWith('.html') && !url.includes('index.html') && !url.includes('room.html')) {
                        const fileName = url.split('/').pop();
                        const displayName = fileName.replace('.html', '').replace(/_/g, ' ');
                        
                        const card = document.createElement('a');
                        card.className = 'game-card';
                        card.href = fileName;
                        card.textContent = `🎮 ${displayName} (أوفلاين ⚡)`;
                        grid.appendChild(card);
                    }
                });
            }
        }

        function filterGames(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        fetchAndAnalyzeGames();
    </script>
</body>
</html>
