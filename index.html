<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مكتبة ألعاب أنس 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        
        /* أزرار التصفية (الذكية) فوق */
        .filter-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .filter-btn { padding: 10px 20px; background: #1e293b; border: 2px solid #38bdf8; color: white; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: #38bdf8; color: #0f172a; }

        /* شبكة الألعاب */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 500px; margin: 0 auto; }
        .game-card { padding: 15px; background: #1e293b; border: 2px solid #38bdf8; border-radius: 10px; text-decoration: none; color: white; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .game-card:hover { background: #334155; transform: scale(1.02); }
        
        /* إخفاء الألعاب حسب الفلتر */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب أنس 🕹️</h1>

    <!-- زرارين التصفية الذكية -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
    </div>

    <!-- قائمة الألعاب (كل لعبة معها التصنيف بتاعها) -->
    <div class="games-grid" id="gamesGrid">
        <!-- ألعاب فردية -->
        <a href="balloons.html" class="game-card" data-category="single">بالونات بوب</a>
        <a href="fishing.html" class="game-card" data-category="single">لعبة الصيد</a>
        <a href="circle.html" class="game-card" data-category="single">تحدي الدائرة</a>
        <a href="flappy.html" class="game-card" data-category="single">فلابي بيرد</a>
        <a href="lava.html" class="game-card" data-category="single">فطيرة الحمم البركانية</a>
        <a href="memory.html" class="game-card" data-category="single">لعبة الذاكرة</a>
        <a href="2d_box.html" class="game-card" data-category="single">مربع 2d</a>
        <a href="3d_box.html" class="game-card" data-category="single">مربع ثلاثي الأبعاد</a>

        <!-- ألعاب جماعية (أونلاين) -->
        <a href="tic-tac-to.html" class="game-card" data-category="multi">Tic - tac - to (أونلاين)</a>
    </div>

    <script>
        function filterGames(category, btn) {
            // تغيير لون الزرار النشط
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // إظهار أو إخفاء الألعاب حسب التصنيف
            const cards = document.querySelectorAll('.game-card');
            cards.card = cards;
            
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }
    </script>

</body>
</html>
