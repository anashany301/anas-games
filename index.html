<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب الـ Embed المباشرة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        h1 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        
        .grid-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .game-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .game-card h3 { font-size: 1.1rem; margin-bottom: 10px; color: #f1f5f9; }
        
        .play-btn { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .play-btn:hover { background: #0ea5e9; }

        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; flex-direction: column; padding: 10px; }
        .modal-content { background: #1e293b; padding: 10px; border-radius: 10px; width: 100%; max-width: 800px; height: 80vh; position: relative; display: flex; flex-direction: column; }
        .close-btn { position: absolute; top: -40px; right: 0; background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        iframe { width: 100%; flex: 1; border: none; border-radius: 6px; background: #000; }
    </style>
</head>
<body>

    <h1>آلاف ألعاب الـ Embed المباشرة</h1>

    <div class="grid-container" id="gamesGrid">جاري التحميل...</div>

    <div id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">إغلاق اللعبة X</button>
            <iframe id="embedFrame" src=""></iframe>
        </div>
    </div>

    <script>
        async function loadGames() {
            try {
                const response = await fetch('games.json');
                const games = await response.json();
                const grid = document.getElementById('gamesGrid');
                grid.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3>${game.title}</h3>
                        <button class="play-btn" onclick="playGame('${game.embed_url}')">تشغيل الإيمبيد</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('gamesGrid').innerHTML = '<p>تعذر تحميل قائمة الألعاب.</p>';
            }
        }

        function playGame(url) {
            document.getElementById('embedFrame').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('embedFrame').src = '';
        }

        loadGames();
    </script>
</body>
</html>
