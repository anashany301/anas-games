<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو 🎮</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 15px; margin: 0; direction: rtl; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        
        .filter-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1e293b; border: 1px solid #38bdf8; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }

        .games-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        
        .game-card { padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 15px; transition: 0.3s; display: block; text-align: right; cursor: pointer; }
        .game-card:hover { background: #334155; }

        .hidden { display: none !important; }
        .loading { color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مكتبة ألعاب فلامينجو 🕹️</h1>

    <!-- زر تثبيت التطبيق الذكي -->
    <div id="installBox" style="display: none; background: #1e293b; border: 2px solid #10b981; padding: 12px; border-radius: 10px; margin: 15px auto; max-width: 350px; text-align: center;">
        <p style="margin: 0 0 10px 0; color: #38bdf8; font-size: 14px; font-weight: bold;">🎮 ثبت تطبيق فلامينجو واستمتع بالألعاب أوفلاين!</p>
        <button id="installBtn" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%;">تثبيت التطبيق الآن 📥</button>
    </div>

    <div class="filter-container">
        <button class="filter-btn" onclick="filterGames('multi', this)">👥 ألعاب جماعية</button>
        <button class="filter-btn" onclick="filterGames('single', this)">👤 ألعاب فردية</button>
        <button class="filter-btn active" onclick="filterGames('all', this)">جميع الألعاب</button>
    </div>

    <div class="games-grid" id="gamesGrid">
        <div class="loading">جاري فحص وتصنيف الألعاب بدقة... ⏳</div>
    </div>

    <script>
        // تسجيل الـ Service Worker لتفعيل الأوفلاين
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('✅ تم تفعيل العمل أوفلاين بنجاح!'))
                    .catch((err) => console.log('❌ خطأ في تفعيل الأوفلاين:', err));
            });
        }

        let deferredPrompt = null;
        const installBox = document.getElementById('installBox');
        const installBtn = document.getElementById('installBtn');

        // استقبال حدث التثبيت من متصفح كروم
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // إظهار صندوق التثبيت فوراً للمستخدم
            installBox.style.display = 'block';
        });

        // تنفيذ أمر التثبيت عند الضغط على الزر
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('المستخدم وافق وتم تثبيت التطبيق');
                } else {
                    console.log('المستخدم رفض تثبيت التطبيق');
                }
                deferredPrompt = null;
                installBox.style.display = 'none';
            } else {
                alert("التطبيق جاهز بالفعل أو متصفحك لا يدعم التثبيت المباشر. يمكنك تثبيته يدوياً من قائمة إعدادات المتصفح (ثلاث نقاط) واختار 'إضافة إلى الشاشة الرئيسية' أو 'تثبيت التطبيق'.");
            }
        });

        const username = "anashany301"; 
        const repo = "anas-games"; 

        const excludedFiles = [
            'index.html', 
            'room.html',
            'sw.js',
            'manifest.json',
            'icon.png',
            'multiplayer-helper.html', 
            'injector.py', 
            'vercel.json', 
            'package.json', 
            'server.js',
            'README.md'
        ];

        async function fetchAndAnalyzeGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                grid.innerHTML = ""; 

                for (const file of files) {
                    if (file.name.endsWith('.html') && !excludedFiles.includes(file.name)) {
                        let displayName = file.name.replace('.html', '').replace(/_/g, ' ');
                        let category = 'single'; 

                        try {
                            const gameRes = await fetch(file.download_url);
                            const gameHtml = await gameRes.text();
                            
                            if (
                                gameHtml.includes('إنشاء غرفة جديدة') || 
                                gameHtml.includes('انشاء غرفة جديدة') ||
                                gameHtml.toLowerCase().includes('peerjs') || 
                                gameHtml.toLowerCase().includes('socket.io')
                            ) {
                                category = 'multi';
                            }
                        } catch (e) {
                            console.log("خطأ في فحص الملف:", file.name);
                        }

                        const card = document.createElement('a');
                        card.className = 'game-card';
                        card.setAttribute('data-category', category);
                        card.textContent = `🎮 ${displayName} ${category === 'multi' ? '👥' : ''}`;

                        if (category === 'multi') {
                            card.href = "#";
                            card.onclick = (e) => {
                                e.preventDefault();
                                window.location.href = `room.html?game=${file.name}`;
                            };
                        } else {
                            card.href = file.name;
                        }

                        grid.appendChild(card);
                    }
                }

                if (grid.innerHTML === "") {
                    grid.innerHTML = `<p style="color: #cbd5e1;">لا توجد ألعاب مضافة حالياً.</p>`;
                }

            } catch (error) {
                grid.innerHTML = `<p style="color: #38bdf8;">🌐 أنت أوفلاين حالياً، يتم عرض الألعاب المتاحة في الذاكرة.</p>`;
                console.error(error);
            }
        }

        function filterGames(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        fetchAndAnalyzeGames();
    </script>

</body>
</html>
