<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فلامينجو أركيد - الشاشة الكاملة</title>
    <style>
        :root { --bg: #030712; --card: #0f172a; --accent: #f43f5e; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; margin: 0; padding: 0; overflow-x: hidden; user-select: none; }
        
        header { padding: 10px; background: #0b1120; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        h1 { color: var(--accent); margin: 0; font-size: 14px; }

        .search-box { padding: 10px; text-align: center; background: #080d1a; }
        .search-box input { width: 92%; max-width: 450px; padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; outline: none; }

        .arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 10px; max-width: 1000px; margin: 0 auto; }
        .game-card { background: var(--card); padding: 8px; border-radius: 8px; border: 1px solid #1e293b; text-align: center; }
        .game-thumb { width: 100%; height: 85px; background: #000; border-radius: 5px; object-fit: cover; }
        
        button { background: var(--accent); color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; margin-top: 5px; width: 100%; }

        /* شاشة اللعبة بالعرض بالكامل */
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; flex-direction: column; justify-content: space-between; align-items: center; padding: 5px; }
        
        .game-top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(11, 17, 32, 0.8); padding: 5px 10px; border-radius: 6px; }
        
        #game-frame-wrapper { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* أزرار التحكم الأنيقة السفلية */
        .controls-deck { display: flex; gap: 15px; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); width: 100%; padding: 8px; border-radius: 8px; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 40px); gap: 3px; }
        .d-btn { background: #1e293b; color: #fff; border: 1px solid #334155; height: 35px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .d-btn:active { background: var(--accent); }
        
        .action-btns { display: flex; gap: 8px; }
        .action-btn { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; color: white; font-weight: bold; border: none; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 4px 10px rgba(244,63,94,0.4); }
        
        .back-btn-hud { background: #ef4444; padding: 5px 12px; font-size: 10px; border-radius: 4px; color: #fff; border: none; cursor: pointer; width: auto; }
    </style>
</head>
<body>

    <header>
        <h1>🦩 فلامينجو أركيد</h1>
        <span style="font-size: 10px; color: var(--muted);">وضع الشاشة العرضية</span>
    </header>

    <div id="list-screen">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن ألعاب كلاسيكية وأركيد..." onkeyup="filterGames()">
        </div>
        <div class="arcade-grid" id="games-grid"></div>
    </div>

    <div id="game-container">
        <div class="game-top-bar">
            <h3 id="game-title-hud" style="color: var(--accent); margin: 0; font-size: 12px;"></h3>
            <button class="back-btn-hud" onclick="closeGame()">إغلاق ✕</button>
        </div>
        
        <div id="game-frame-wrapper">
            <iframe id="real-game-iframe" src="" allowfullscreen></iframe>
        </div>

        <div class="controls-deck">
            <div class="d-pad">
                <div></div><div class="d-btn" onclick="simulateKey('ArrowUp')">⬆️</div><div></div>
                <div class="d-btn" onclick="simulateKey('ArrowLeft')">⬅️</div><div class="d-btn" onclick="simulateKey(' ')">⏺️</div><div class="d-btn" onclick="simulateKey('ArrowRight')">➡️</div>
                <div></div><div class="d-btn" onclick="simulateKey('ArrowDown')">⬇️</div><div></div>
            </div>
            <div class="action-btns">
                <button class="action-btn" onclick="simulateKey('KeyB')">B</button>
                <button class="action-btn" onclick="simulateKey('KeyA')">A</button>
            </div>
        </div>
    </div>

    <script>
        const masterGames = [
            { name: "ديناصور الكروم الأسطوري", url: "https://chromedino.com/", thumb: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=300&q=80" },
            { name: "تتريس الكلاسيكية العالمية", url: "https://tetris.com/play-tetris", thumb: "https://images.unsplash.com/photo-1614680376593-902f749f7ffc?w=300&q=80" },
            { name: "لعبة الثعبان الكلاسيكية", url: "https://s3-us-west-2.amazonaws.com/s.cdpn.io/78417/snake.html", thumb: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300&q=80" },
            { name: "لعبة 2048 الشهيرة", url: "https://play2048.co/", thumb: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300&q=80" },
            { name: "أركيد الفضاء السريع", url: "https://chromedino.com/", thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&q=80" }
        ];

        function renderGames(array) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = array.map(g => `
                <div class="game-card">
                    <img src="${g.thumb}" class="game-thumb" alt="${g.name}">
                    <h4 style="margin:5px 0; color:#f8fafc; font-size:10px;">${g.name}</h4>
                    <button onclick="launchGame('${g.url}', '${g.name}')">العب الآن</button>
                </div>
            `).join('');
        }

        function filterGames() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderGames(masterGames.filter(g => g.name.toLowerCase().includes(term)));
        }

        function launchGame(url, title) {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = title;
            document.getElementById('real-game-iframe').src = url;
        }

        function closeGame() {
            document.getElementById('real-game-iframe').src = '';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }

        function simulateKey(key) {
            const iframe = document.getElementById('real-game-iframe');
            try {
                iframe.contentWindow.postMessage({ type: 'key', key: key }, '*');
            } catch(e) {
                console.log("التحكم مباشر داخل الإطار");
            }
        }

        renderGames(masterGames);
    </script>
</body>
</html>
