<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب فلامينجو - Flamingo Games</title>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 0; }
        header { padding: 20px; background: linear-gradient(135deg, #ec4899, #8b5cf6); border-bottom: 2px solid #334155; }
        h1 { color: #fff; margin: 0; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .game-card { background: #1e293b; margin: 12px auto; padding: 15px; width: 90%; max-width: 480px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-2px); border-color: #ec4899; }
        button { background: #ec4899; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #db2777; }
        #canvas-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #090d16; border: 3px solid #ec4899; box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 6px; margin-top: 10px; }
        .ctrl-btn { background: #334155; padding: 12px; font-size: 16px; border-radius: 8px; color: #fff; border: none; cursor: pointer; }
        .ctrl-btn:hover { background: #475569; }
        .back-btn { background: #dc2626; margin-top: 10px; padding: 8px 20px; }
        .back-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <header>
        <h1>🦩 مكتبة ألعاب فلامينجو الرسمية</h1>
        <p style="margin:5px 0 0; color:#fbcfe8; font-size:12px;">أفضل وأمتع ألعاب الكلاسيك والمغامرات بتصميم فلامينجو الفريد</p>
    </header>

    <div id="list-screen">
        <div id="games-list" style="margin-top: 20px;"></div>
    </div>

    <div id="canvas-container">
        <h3 id="game-title-hud" style="color: #ec4899; margin: 3px; font-size: 16px;"></h3>
        <div id="hud-stats" style="color: #f87171; font-weight: bold; margin-bottom: 4px; font-size: 13px;"></div>
        <canvas id="gameCanvas" width="300" height="340"></canvas>
        
        <div class="controls">
            <div></div>
            <button class="ctrl-btn" onclick="handleInput('UP')">⬆️</button>
            <div></div>
            <button class="ctrl-btn" onclick="handleInput('LEFT')">⬅️</button>
            <button class="ctrl-btn" onclick="handleInput('ACTION')">🔥 تفاعل</button>
            <button class="ctrl-btn" onclick="handleInput('RIGHT')">➡️</button>
            <div></div>
            <button class="ctrl-btn" onclick="handleInput('DOWN')">⬇️</button>
            <div></div>
        </div>
        <button class="back-btn" onclick="closeGame()">الرجوع للقائمة</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopInterval;
        let game;

        // قائمة مكتبة ألعاب فلامينجو الحصرية
        const flamingoGames = [
            { id: 1, name: "رحلة فلامينجو في البحيرة الوردية", genre: "flamingo_fly", desc: "طير وتفادى العقبات واجمع الكريستال الوردي" },
            { id: 2, name: "قفزة فلامينجو المنصات العالية", genre: "flamingo_jump", desc: "تحدي الصعود والقفز فوق المرتفعات المتدرجة" },
            { id: 3, name: "معبد فلامينجو ومتاهة الأسرار", genre: "flamingo_maze", desc: "فك الألغاز واكتشاف كنوز المعبد القديم" },
            { id: 4, name: "سباق فلامينجو الليلي السريع", genre: "flamingo_race", desc: "انطلق بسرعة وتجنب الاصطدام بالعوائق" }
        ];

        function renderList() {
            const container = document.getElementById('games-list');
            container.innerHTML = flamingoGames.map(g => `
                <div class="game-card">
                    <div style="text-align: right;">
                        <h4 style="margin:0; color:#f472b6; font-size:14px;">🦩 ${g.name}</h4>
                        <small style="color:#94a3b8; font-size:11px;">${g.desc}</small>
                    </div>
                    <button onclick="launchGame(${g.id})">العب الآن</button>
                </div>
            `).join('');
        }

        function launchGame(id) {
            const gData = flamingoGames.find(g => g.id === id);
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = gData.name;

            game = {
                genre: gData.genre,
                hp: 100,
                score: 0,
                px: 130, py: 240
            };

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(updateAndRenderGame, 1000 / 60);
        }

        function handleInput(action) {
            const step = 14;
            if (action === 'UP') game.py -= step;
            if (action === 'DOWN') game.py += step;
            if (action === 'LEFT') game.px -= step;
            if (action === 'RIGHT') game.px += step;
            if (action === 'ACTION') {
                game.score += 25;
            }
            if (game.px < 10) game.px = 10;
            if (game.px > 260) game.px = 260;
            if (game.py < 40) game.py = 40;
            if (game.py > 280) game.py = 280;
        }

        function drawFlamingo(x, y) {
            // رسم شكل مبسط لشخصية فلامينجو وردية اللون على الكانفاس
            ctx.fillStyle = "#ec4899"; // الجسم الوردي
            ctx.fillRect(x + 4, y + 8, 14, 14);
            ctx.fillStyle = "#f472b6"; // الرقبة الطويلة والمنقار
            ctx.fillRect(x + 12, y - 6, 4, 16);
            ctx.fillStyle = "#fbbf24"; // المنقار الأصفر
            ctx.fillRect(x + 16, y - 6, 6, 4);
            ctx.fillStyle = "#ffffff"; // العين
            ctx.fillRect(x + 14, y - 4, 3, 3);
        }

        function updateAndRenderGame() {
            ctx.fillStyle = "#090d16";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            document.getElementById('hud-stats').innerText = `❤️ الصحة: ${game.hp}%   |   ⭐ النقاط: ${game.score}`;

            // أرضية اللعبة
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(10, 300, 280, 8);

            // رسم بيئة اللعبة حسب نوعها
            if (game.genre === 'flamingo_jump') {
                ctx.fillStyle = "#db2777";
                ctx.fillRect(40, 210, 90, 10);
                ctx.fillRect(170, 140, 90, 10);
            } else {
                ctx.fillStyle = "#831843";
                ctx.fillRect(20, 220, 260, 6);
            }

            drawFlamingo(game.px, game.py);
        }

        function closeGame() {
            clearInterval(gameLoopInterval);
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }

        renderList();
    </script>
</body>
</html>
