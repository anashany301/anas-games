<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ألعاب فلامينجو</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #38bdf8;
            margin: 0 0 10px 0;
        }
        .section-title {
            max-width: 1400px;
            margin: 20px auto 10px auto;
            color: #38bdf8;
            font-size: 20px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 5px;
        }
        #search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto 30px auto;
        }
        .game-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .game-card:hover {
            background-color: #0284c7;
            transform: translateY(-3px);
            border-color: #38bdf8;
        }
        .game-title {
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #game-name-title {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
        }
        .exit-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .exit-btn:hover { background-color: #dc2626; }
        #iframe-wrapper {
            width: 100%;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #iframe-wrapper iframe {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>flamingo games 🕹️</h1>
        <p style="color: #94a3b8; margin-bottom: 20px;">إجمالي الألعاب المتاحة: <span id="count">0</span></p>
        <input type="text" id="search-box" placeholder="ابحث عن لعبتك المفضلة من بين آلاف الألعاب..." onkeyup="filterGames()">
    </header>

    <div id="main-content">
        <!-- ألعاب ماريو وسونيك المميزة في المقدمة -->
        <div class="section-title">⭐ ألعاب مميزة (ماريو وسونيك)</div>
        <div id="featured-grid" class="games-grid"></div>

        <!-- جميع الألعاب مرتبة بشكل عشوائي تماماً -->
        <div class="section-title">🎲 جميع الألعاب (عشوائي)</div>
        <div id="all-games-grid" class="games-grid"></div>
    </div>

    <!-- شاشة نتائج البحث -->
    <div id="search-results-section" style="display:none;">
        <div class="section-title">🔍 نتائج البحث</div>
        <div id="search-grid" class="games-grid"></div>
    </div>

    <!-- شاشة اللعب -->
    <div id="player-overlay">
        <div id="top-bar">
            <span id="game-name-title"></span>
            <button class="exit-btn" onclick="closeGame()">✖ خروج للقائمة</button>
        </div>
        <div id="iframe-wrapper"></div>
    </div>

    <script>
        let allGames = [];

        fetch('flamingo.json')
            .then(res => res.json())
            .then(data => {
                allGames = data;
                document.getElementById('count').innerText = data.length;
                setupHomepage();
                checkUrlParam();
            })
            .catch(err => console.error("Error:", err));

        function setupHomepage() {
            let marioGames = allGames.filter(g => g.title.toLowerCase().includes('mario')).slice(0, 2);
            let sonicGames = allGames.filter(g => g.title.toLowerCase().includes('sonic')).slice(0, 3);
            let featured = [...marioGames, ...sonicGames];
            renderGrid(featured, 'featured-grid');

            // نسخة من القائمة ويتم خلطها عشوائياً بالكامل لجميع الـ 17 ألف لعبة
            let shuffledAll = [...allGames];
            shuffleArray(shuffledAll);
            renderGrid(shuffledAll, 'all-games-grid');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderGrid(games, elementId) {
            let grid = document.getElementById(elementId);
            grid.innerHTML = '';
            
            let fragment = document.createDocumentFragment();
            games.forEach((game) => {
                let card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<div class="game-title">${game.title}</div>`;
                card.onclick = () => openGame(game);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        function openGame(game) {
            document.getElementById('game-name-title').innerText = game.title;
            document.getElementById('iframe-wrapper').innerHTML = game.embed;
            document.getElementById('player-overlay').style.display = 'flex';

            let slug = game.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            window.history.pushState({}, '', `?game=${slug}`);
        }

        function closeGame() {
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('iframe-wrapper').innerHTML = '';
            window.history.pushState({}, '', window.location.pathname);
        }

        function filterGames() {
            let query = document.getElementById('search-box').value.toLowerCase().trim();
            let mainContent = document.getElementById('main-content');
            let searchSection = document.getElementById('search-results-section');

            if (query === '') {
                mainContent.style.display = 'block';
                searchSection.style.display = 'none';
                return;
            }

            mainContent.style.display = 'none';
            searchSection.style.display = 'block';

            let filtered = allGames.filter(g => g.title.toLowerCase().includes(query));
            renderGrid(filtered, 'search-grid');
        }

        function checkUrlParam() {
            const params = new URLSearchParams(window.location.search);
            const gameQuery = params.get('game');
            if (gameQuery && allGames.length > 0) {
                let found = allGames.find(g => g.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') === gameQuery);
                if (found) {
                    openGame(found);
                }
            }
        }
    </script>
</body>
</html>
