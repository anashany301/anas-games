<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الكلاسيكية الشاملة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 900px; }
        h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        
        .stats-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #38bdf8; font-size: 1.05rem; width: 100%; max-width: 900px; text-align: center; }

        .controls { width: 100%; max-width: 900px; display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        select, input { padding: 10px 14px; font-size: 0.95rem; border-radius: 8px; border: 2px solid #334155; background-color: #1e293b; color: #fff; outline: none; }
        select { cursor: pointer; }
        input { flex: 1; min-width: 220px; }
        
        .grid-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .game-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .game-info h3 { font-size: 1rem; color: #f1f5f9; margin-bottom: 6px; word-break: break-word; }
        .game-info span { display: inline-block; background-color: #0369a1; color: #e0f2fe; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-bottom: 12px; }
        
        .play-btn { background: #0284c7; color: white; border: none; padding: 9px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: bold; text-align: center; width: 100%; }
        .play-btn:hover { background: #0ea5e9; }

        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; padding: 10px; flex-direction: column; }
        .modal-content { background: #1e293b; padding: 12px; border-radius: 14px; width: 100%; max-width: 700px; text-align: center; position: relative; border: 1px solid #334155; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        
        .emulator-container { width: 100%; height: 400px; background: #000; border-radius: 8px; margin-top: 10px; overflow: hidden; border: 2px solid #334155; }
        iframe { width: 100%; height: 100%; border: none; }

        #loading { color: #38bdf8; font-weight: bold; margin: 20px 0; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>منصة الألعاب الكلاسيكية الشاملة</h1>
        <p>مكتبة خفيفة وسريعة التصفح</p>
    </header>

    <div class="stats-bar" id="statsBar">جاري تحميل الألعاب...</div>

    <div class="controls">
        <select id="platformSelect" onchange="loadPlatformCatalog()">
            <option value="nes">نينتندو (NES)</option>
            <option value="segaMD">سيجا جينسيس (Sega Genesis)</option>
            <option value="snes">سوبر نينتندو (SNES)</option>
            <option value="arcade">آركيد (Arcade)</option>
        </select>
        <input type="text" id="searchInput" placeholder="ابحث عن اسم اللعبة..." oninput="filterGames()">
    </div>

    <div id="loading">جاري تحميل المكتبة...</div>
    <div class="grid-container" id="gamesGrid"></div>

    <div id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h2 id="modalGameTitle" style="color: #38bdf8; margin-bottom: 5px; font-size: 1rem;">تشغيل اللعبة</h2>
            <div class="emulator-container">
                <iframe id="emulatorFrame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        let currentPlatformGames = [];

        async function loadPlatformCatalog() {
            const platform = document.getElementById('platformSelect').value;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('gamesGrid').innerHTML = '';
            document.getElementById('statsBar').innerText = 'جاري جلب البيانات...';

            try {
                const response = await fetch(`data/${platform}.json`);
                currentPlatformGames = await response.json();
                filterGames();
            } catch (e) {
                console.error("خطأ في التحميل", e);
                document.getElementById('statsBar').innerText = 'تعذر تحميل بيانات هذه المنصة حالياً';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const platform = document.getElementById('platformSelect').value;

            let filtered = currentPlatformGames.filter(game => game.title.toLowerCase().includes(query));

            renderGrid(filtered, platform);
        }

        function renderGrid(games, platform) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            document.getElementById('statsBar').innerText = `عدد الألعاب المتاحة: ${games.length} لعبة`;

            if (games.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">لا توجد ألعاب مطابقة</p>';
                return;
            }

            // عرض أول 300 لعبة لضمان خفة وسرعة التصفح للمستخدم
            const displayList = games.slice(0, 300);

            displayList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                card.innerHTML = `
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <span>${platform.toUpperCase()}</span>
                    </div>
                    <button class="play-btn" onclick="playGame('${platform}', '${game.file}', '${game.title.replace(/'/g, "")}')">تشغيل مباشر</button>
                `;
                grid.appendChild(card);
            });
        }

        function playGame(platform, file, title) {
            // توليد رابط الـ Embed لحظياً عند الضغط فقط بدون إجهاد التخزين
            const embedUrl = `https://play.emulatorjs.com/emulatorv2/index.html?system=${platform}&game=${encodeURIComponent(file)}`;

            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('emulatorFrame').src = embedUrl;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('emulatorFrame').src = '';
        }

        window.onload = loadPlatformCatalog;
    </script>
</body>
</html>
