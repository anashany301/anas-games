<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصنع الألعاب الكلاسيكية - تشغيل مضمون</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 800px; }
        h1 { font-size: 2.3rem; color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1rem; }
        
        .stats-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; color: #38bdf8; }
        
        .controls { width: 100%; max-width: 800px; display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        input, select { padding: 12px 16px; font-size: 1rem; border-radius: 10px; border: 2px solid #334155; background-color: #1e293b; color: #fff; outline: none; }
        input { flex: 1; min-width: 250px; }
        select { cursor: pointer; }
        
        .grid-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .game-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); border-color: #38bdf8; }
        
        .game-card.featured { border: 2px solid #f59e0b; background: linear-gradient(135deg, #1e293b, #292524); }
        .featured-tag { display: inline-block; background-color: #f59e0b; color: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }

        .game-info h3 { font-size: 1rem; color: #f1f5f9; margin-bottom: 6px; word-break: break-word; }
        .game-info span { display: inline-block; background-color: #0369a1; color: #e0f2fe; padding: 3px 8px; border-radius: 15px; font-size: 0.75rem; margin-bottom: 12px; }
        
        .play-btn { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: bold; text-align: center; }
        .play-btn:hover { opacity: 0.9; }

        #loading { color: #38bdf8; font-weight: bold; margin: 30px 0; text-align: center; display: none; }

        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; padding: 10px; flex-direction: column; }
        .modal-content { background: #1e293b; padding: 15px; border-radius: 14px; width: 100%; max-width: 650px; text-align: center; position: relative; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; z-index: 10; }
        
        .emulator-screen { width: 100%; height: 360px; background: #000; border-radius: 8px; margin-top: 10px; border: 2px solid #334155; }

        .gamepads { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; padding: 0 10px; align-items: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 2px; }
        .pad-btn { background: #334155; color: white; border: none; font-size: 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .pad-btn:active { background: #38bdf8; color: #0f172a; }
        
        .action-btns { display: flex; gap: 15px; }
        .action-btn { width: 55px; height: 55px; background: #0284c7; color: white; border: none; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .action-btn:active { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

    <header>
        <h1>مصنع الألعاب الكلاسيكية</h1>
        <p>ماريو وسونيك الأصلية (تشغيل فوري مع أزرار التحكم)</p>
    </header>

    <div class="stats-bar" id="statsBar">عدد الألعاب المتاحة: 0</div>

    <div class="controls">
        <select id="platformSelect" onchange="resetAndLoad()">
            <option value="nes">ألعاب نينتندو الكلاسيكية</option>
            <option value="sega">ألعاب سيجا وتصنيع الثمانينات والتسعينيات</option>
            <option value="arcade">ألعاب الآركيد والصالات</option>
        </select>
        <input type="text" id="searchInput" placeholder="ابحث في الألعاب..." oninput="filterCatalog()">
    </div>

    <div class="grid-container" id="gamesGrid"></div>
    <div id="loading">جاري جلب الألعاب الأصلية...</div>

    <div id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h2 id="modalGameTitle" style="color: #38bdf8; margin-bottom: 5px; font-size: 1.1rem;">تشغيل اللعبة</h2>
            
            <iframe id="emulatorFrame" class="emulator-screen" src=""></iframe>

            <div class="gamepads">
                <div class="d-pad">
                    <div></div>
                    <button class="pad-btn">▲</button>
                    <div></div>
                    <button class="pad-btn">◀</button>
                    <div style="background: #1e293b;"></div>
                    <button class="pad-btn">▶</button>
                    <div></div>
                    <button class="pad-btn">▼</button>
                    <div></div>
                </div>
                <div class="action-btns">
                    <button class="action-btn">B</button>
                    <button class="action-btn">A</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let uniqueMap = new Map();
        let seenTitles = new Set();
        let currentPage = 1;
        let isLoading = false;
        let currentPlatform = "nes";

        function cleanGameTitle(title) {
            return title.toLowerCase()
                .replace(/\(.*?\)/g, '')
                .replace(/\[.*?\]/g, '')
                .replace(/v\d+(\.\d+)?/g, '')
                .trim();
        }

        async function resetAndLoad() {
            currentPlatform = document.getElementById('platformSelect').value;
            uniqueMap.clear();
            seenTitles.clear();
            currentPage = 1;
            document.getElementById('gamesGrid').innerHTML = '';
            
            await loadPriorityGames();
            await loadMoreGames();
        }

        async function loadPriorityGames() {
            try {
                // استعلام دقيق يستهدف الألعاب الأصلية لماريو وسونيك ضمن مجموعات الأرشيف المدعومة
                const priorityUrl = `https://archive.org/advancedsearch.php?q=((collection:(nes) OR collection:(sega) OR collection:(softwarelibrary)) AND (title:(Mario) OR title:(Sonic))) AND mediatype:(software)&output=json&rows=30&page=1`;
                const response = await fetch(priorityUrl);
                const data = await response.json();
                const docs = data.response.docs;

                if (docs && docs.length > 0) {
                    docs.forEach(game => {
                        if (game.identifier && game.title) {
                            const cleanName = cleanGameTitle(game.title);
                            if (!uniqueMap.has(game.identifier) && !seenTitles.has(cleanName)) {
                                seenTitles.add(cleanName);
                                uniqueMap.set(game.identifier, {
                                    identifier: game.identifier,
                                    title: game.title,
                                    platform: "RETRO CLASSIC",
                                    isFeatured: true
                                });
                            }
                        }
                    });
                    renderGrid();
                }
            } catch (error) {
                console.error("خطأ في جلب الألعاب المميزة", error);
            }
        }

        async function loadMoreGames() {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loading').style.display = 'block';

            let query = "";
            if (currentPlatform === 'nes') query = "collection:(nes) AND mediatype:(software)";
            else if (currentPlatform === 'sega') query = "collection:(sega) AND mediatype:(software)";
            else query = "collection:(arcade) AND mediatype:(software)";

            try {
                const apiUrl = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&output=json&rows=40&page=${currentPage}`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                const docs = data.response.docs;

                if (docs && docs.length > 0) {
                    docs.forEach(game => {
                        if (game.identifier && game.title) {
                            const cleanName = cleanGameTitle(game.title);
                            if (!uniqueMap.has(game.identifier) && !seenTitles.has(cleanName)) {
                                seenTitles.add(cleanName);
                                uniqueMap.set(game.identifier, {
                                    identifier: game.identifier,
                                    title: game.title,
                                    platform: currentPlatform.toUpperCase(),
                                    isFeatured: false
                                });
                            }
                        }
                    });
                    currentPage++;
                    renderGrid();
                }
            } catch (error) {
                console.error("خطأ في جلب الألعاب", error);
            } finally {
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('gamesGrid');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            let count = 0;
            uniqueMap.forEach(game => {
                if (!query || game.title.toLowerCase().includes(query)) {
                    count++;
                    // استخدام رابط التشغيل المباشر الصحيح للملفات المدمجة في الأرشيف
                    const emulatorUrl = `https://archive.org/embed/${game.identifier}`;
                    const card = document.createElement('div');
                    
                    card.className = game.isFeatured ? 'game-card featured' : 'game-card';
                    
                    card.innerHTML = `
                        <div class="game-info">
                            ${game.isFeatured ? '<span class="featured-tag">★ أصلية مميزة</span>' : ''}
                            <h3>${game.title}</h3>
                            <span>${game.platform}</span>
                        </div>
                        <button class="play-btn" onclick="playGame('${game.title.replace(/'/g, "")}', '${emulatorUrl}')">تشغيل اللعبة</button>
                    `;
                    grid.appendChild(card);
                }
            });

            document.getElementById('statsBar').innerText = `عدد الألعاب المتاحة: ${count}`;
        }

        function filterCatalog() {
            renderGrid();
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
                loadMoreGames();
            }
        });

        function playGame(title, url) {
            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('emulatorFrame').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('emulatorFrame').src = '';
        }

        window.onload = resetAndLoad;
    </script>
</body>
</html>
