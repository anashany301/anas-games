<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة فلامينجو الأركيد - Phaser Engine</title>
    <!-- استدعاء مكتبة Phaser 3 من CDN رسمي سريع -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { background-color: #05070f; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 0; user-select: none; }
        header { padding: 10px; background: #0f172a; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 10; }
        h1 { color: #f43f5e; margin: 0; font-size: 15px; }
        .game-card { background: #1e293b; margin: 6px auto; padding: 8px 12px; width: 92%; max-width: 400px; border-radius: 8px; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; }
        button { background: #f43f5e; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; }
        button:hover { background: #e11d48; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #030712; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #phaser-target { border: 2px solid #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); border-radius: 4px; overflow: hidden; }
        .back-btn { background: #ef4444; margin-top: 10px; padding: 6px 20px; font-size: 11px; border-radius: 5px; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🦩 مكتبة فلامينجو - محرك Phaser الاحترافي</h1>
        <p style="margin:2px 0 0; color:#fda4af; font-size:9px;">أداء خرافي، فيزياء حقيقية، وألعاب لا تنتهي!</p>
    </header>

    <div id="list-screen">
        <div id="games-list" style="margin-top: 10px;"></div>
    </div>

    <div id="game-container">
        <h3 id="game-title-hud" style="color: #f43f5e; margin: 4px; font-size: 13px;"></h3>
        <div id="phaser-target"></div>
        <button class="back-btn" onclick="closeGame()">الرجوع للقائمة الرئيسية</button>
    </div>

    <script>
        const gamesDB = [
            { id: 1, name: "1. فلابي بيرد - الأنابيب الذكية", type: "flappy", desc: "تحدي الأنابيب المتقطعة بفيزياء الطيران الحقيقية" },
            { id: 2, name: "2. سونيك - عداء السرعة اللانهائي", type: "sonic", desc: "انطلق بأقصى سرعة وتجاوز الموانع بلا وقف" },
            { id: 3, name: "3. ماريو - مغامرة المنصات والعملات", type: "mario", desc: "اقفز فوق المنصات واجمع العملات في عوالم متجددة" },
            { id: 4, name: "4. تيكن - حلبة النزال والضربات", type: "tekken", desc: "معركة حية وأسلوب القتال الحر ضد الخصم" },
            { id: 5, name: "5. أساسين كريد - الظل والتخفي", type: "assassin", desc: "مهمات باركور ليلية وتجنب الحراس في الأبراج" }
        ];

        function renderList() {
            document.getElementById('games-list').innerHTML = gamesDB.map(g => `
                <div class="game-card">
                    <div style="text-align: right;">
                        <h4 style="margin:0; color:#fb7185; font-size:12px;">${g.name}</h4>
                        <small style="color:#94a3b8; font-size:9px;">${g.desc}</small>
                    </div>
                    <button onclick="launchGame('${g.type}', '${g.name}')">العب الآن</button>
                </div>
            `).join('');
        }

        let gameInstance = null;

        function launchGame(type, title) {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('game-title-hud').innerText = title;

            if (gameInstance) {
                gameInstance.destroy(true);
            }

            let sceneConfig;

            if (type === 'flappy') {
                sceneConfig = class extends Phaser.Scene {
                    constructor() { super('Flappy'); }
                    create() {
                        this.cameras.main.setBackgroundColor('#1e293b');
                        this.bird = this.add.rectangle(60, 143, 20, 16, 0xfacc15);
                        this.physics.add.existing(this.bird);
                        this.bird.body.setGravityY(600);
                        
                        this.pipes = this.physics.add.group();
                        this.score = 0;
                        this.scoreText = this.add.text(12, 12, 'النقاط: 0', { font: '12px Tahoma', fill: '#38bdf8' });

                        this.input.on('pointerdown', () => {
                            this.bird.body.setVelocityY(-220);
                        });

                        this.time.addEvent({
                            delay: 1600,
                            callback: () => {
                                if (!this.scene.isActive()) return;
                                let gapY = Phaser.Math.Between(80, 180);
                                let topPipe = this.add.rectangle(300, gapY - 60, 32, 140, 0x15803d);
                                let botPipe = this.add.rectangle(300, gapY + 140, 32, 140, 0x15803d);
                                this.pipes.add(topPipe);
                                this.pipes.add(botPipe);
                                topPipe.body.setVelocityX(-130);
                                botPipe.body.setVelocityX(-130);
                                topPipe.body.setAllowGravity(false);
                                botPipe.body.setAllowGravity(false);
                                this.score += 5;
                                this.scoreText.setText('النقاط: ' + this.score);
                            },
                            loop: true
                        });
                    }
                    update() {
                        if (this.bird.y > 280 || this.bird.y < 0) {
                            this.scene.restart();
                        }
                    }
                };
            } else if (type === 'sonic') {
                sceneConfig = class extends Phaser.Scene {
                    constructor() { super('Sonic'); }
                    create() {
                        this.cameras.main.setBackgroundColor('#0f172a');
                        this.score = 0;
                        this.scoreText = this.add.text(12, 12, 'المسافة والخواتم: 0', { font: '12px Tahoma', fill: '#38bdf8' });
                        
                        this.player = this.add.rectangle(50, 220, 16, 20, 0x2563eb);
                        this.physics.add.existing(this.player);
                        this.player.body.setCollideWorldBounds(true);
                        this.player.body.setGravityY(800);

                        let ground = this.add.rectangle(143, 275, 286, 20, 0x15803d);
                        this.physics.add.existing(ground, true);
                        this.physics.add.collider(this.player, ground);

                        this.input.on('pointerdown', () => {
                            if (this.player.body.touching.down) {
                                this.player.body.setVelocityY(-330);
                            }
                        });
                    }
                    update() {
                        this.score++;
                        this.scoreText.setText('المسافة والخواتم: ' + this.score);
                    }
                };
            } else {
                // قالب عام للألعاب الأخرى لضمان الاستقرار الفوري وتجربة سلسة
                sceneConfig = class extends Phaser.Scene {
                    constructor() { super('Generic'); }
                    create() {
                        this.cameras.main.setBackgroundColor('#1e293b');
                        this.add.text(40, 130, 'لعبة ' + title + '\n\nجاري تشغيل محرك الأركيد...', { font: '13px Tahoma', fill: '#f43f5e', align: 'center' });
                        this.input.on('pointerdown', () => {
                            this.add.text(Phaser.Math.Between(20, 200), Phaser.Math.Between(50, 220), '⭐', { font: '16px' });
                        });
                    }
                };
            }

            const config = {
                type: Phaser.AUTO,
                width: 286,
                height: 286,
                parent: 'phaser-target',
                physics: {
                    default: 'arcade',
                    arcade: { gravity: { y: 400 }, debug: false }
                },
                scene: sceneConfig
            };

            gameInstance = new Phaser.Game(config);
        }

        function closeGame() {
            if (gameInstance) {
                gameInstance.destroy(true);
                gameInstance = null;
            }
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        }

        renderList();
    </script>
</body>
</html>
