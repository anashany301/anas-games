<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التفادي 3D - الشاملة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #38bdf8;
        }
        .info-panel {
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        #canvas-container {
            width: 320px;
            height: 320px;
            margin: 0 auto 10px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ctrl-btn {
            flex: 1;
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn:active {
            background-color: #475569;
        }
        .btn-restart {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-restart:hover {
            background-color: #0369a1;
        }
    </style>
    <!-- استدعاء مكتبة Three.js للـ 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>لعبة التفادي 3D 100%</h1>
        <div class="info-panel">النقاط: <span id="score">0</span></div>
        
        <div id="canvas-container"></div>

        <div class="controls">
            <button class="ctrl-btn" id="leftBtn">⬅️ يمين</button>
            <button class="ctrl-btn" id="rightBtn">يسار ➡️</button>
        </div>

        <button class="btn-restart" id="restartBtn">ابدأ اللعبة</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scoreEl = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');

        let scene, camera, renderer;
        let player, obstacle;
        let score = 0;
        let isPlaying = false;
        let obstacleSpeed = 0.12;
        let lane = 0; // -1: يمين، 0: وسط، 1: يسار

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, 320 / 320, 0.1, 1000);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 0, -2);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(0, 5, 2);
            scene.add(pointLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(320, 320);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // اللاعب
            const playerGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.4, 0);
            scene.add(player);

            // الخصم (مربع أحمر)
            const obsGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e });
            obstacle = new THREE.Mesh(obsGeo, obsMat);
            resetObstacle();
            scene.add(obstacle);

            renderer.render(scene, camera);
        }

        function resetObstacle() {
            // المربع الخصم يظهر 100% في نفس إحداثيات مسار اللاعب الحالي
            let targetX = lane * 1.2;
            obstacle.position.set(targetX, 0.4, -18);
        }

        function startGame() {
            score = 0;
            obstacleSpeed = 0.12;
            scoreEl.textContent = score;
            lane = 0;
            player.position.x = 0;
            resetObstacle();
            isPlaying = true;
            restartBtn.style.display = 'none';
            animate();
        }

        function animate() {
            if (!isPlaying) return;

            // حركة انسيابية لانتقال الشخصية بين المسارات
            let targetX = lane * 1.2;
            player.position.x += (targetX - player.position.x) * 0.3;

            // تحريك الخصم للأمام نحو اللاعب
            obstacle.position.z += obstacleSpeed;

            // إذا تعدّى الخصم اللاعب بنجاح (سجّل نقطة)
            if (obstacle.position.z > player.position.z + 1) {
                score += 10;
                scoreEl.textContent = score;
                
                // كلما زادت النقاط، زادت سرعة المربع الخصم
                obstacleSpeed = 0.12 + (score / 100) * 0.1;
                
                resetObstacle();
            }

            // فحص الاصطدام المباشر
            if (
                Math.abs(player.position.x - obstacle.position.x) < 0.45 &&
                obstacle.position.z >= -0.5 && obstacle.position.z <= 0.6
            ) {
                gameOver();
                return;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function gameOver() {
            isPlaying = false;
            restartBtn.style.display = 'block';
            restartBtn.textContent = 'إعادة المحاولة';
        }

        // أزرار التحكم
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (lane > -1) lane--;
        });
        document.getElementById('rightBtn').addEventListener('click', () => {
            if (lane < 1) lane++;
        });

        restartBtn.addEventListener('click', startGame);

        init3D();
    </script>
</body>
</html>
