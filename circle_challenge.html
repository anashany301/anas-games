<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التفادي 3D - الشاملة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #38bdf8;
        }
        .info-panel {
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        #canvas-container {
            width: 320px;
            height: 320px;
            margin: 0 auto 10px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ctrl-btn {
            flex: 1;
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn:active {
            background-color: #475569;
        }
        .btn-restart {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-restart:hover {
            background-color: #0369a1;
        }
    </style>
    <!-- استدعاء مكتبة Three.js للـ 3D -->
    
</body>

</html>
