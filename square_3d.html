<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #38bdf8;
        }
        .info-panel {
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        #canvas-container {
            width: 320px;
            height: 320px;
            margin: 0 auto 10px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ctrl-btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn:active {
            background-color: #0369a1;
        }
        .btn-restart {
            width: 100%;
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-restart:hover {
            background-color: #475569;
        }
    </style>
    <!-- استدعاء مكتبة Three.js للـ 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>لعبة القفز 3D</h1>
        <div class="info-panel">النقاط: <span id="score">0</span></div>
        
        <div id="canvas-container"></div>

        <div class="controls">
            <button class="ctrl-btn" id="jumpBtn">⬆️ قفز (Jump)</button>
        </div>

        <button class="btn-restart" id="restartBtn" style="display:none;">إعادة المحاولة</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scoreEl = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        let scene, camera, renderer;
        let player, obstacle;
        let score = 0;
        let isPlaying = false;
        
        // متغيرات الفيزياء للقفز
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        let obstacleSpeed = 0.15;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, 320 / 320, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, -2);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(0, 5, 2);
            scene.add(pointLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(320, 320);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // اللاعب (مكعب أزرق)
            const playerGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, -0.3, 0);
            scene.add(player);

            // العائق الأرضي (مكعب أحمر للقفز من فوقه)
            const obsGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e });
            obstacle = new THREE.Mesh(obsGeo, obsMat);
            resetObstacle();
            scene.add(obstacle);

            renderer.render(scene, camera);
        }

        function resetObstacle() {
            obstacle.position.set(0, -0.3, -15);
        }

        function startGame() {
            score = 0;
            obstacleSpeed = 0.15;
            scoreEl.textContent = score;
            player.position.y = -0.3;
            isJumping = false;
            jumpVelocity = 0;
            resetObstacle();
            isPlaying = true;
            restartBtn.style.display = 'none';
            animate();
        }

        function jump() {
            if (!isPlaying) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.22; // قوة القفزة
            }
        }

        function animate() {
            if (!isPlaying) return;

            // فيزياء القفز والجاذبية
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= gravity;

                // العودة للأرض
                if (player.position.y <= -0.3) {
                    player.position.y = -0.3;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            // تحريك العائق نحو اللاعب
            obstacle.position.z += obstacleSpeed;

            // إذا تجاوز العائق اللاعب بنجاح
            if (obstacle.position.z > player.position.z + 1) {
                score += 10;
                scoreEl.textContent = score;
                obstacleSpeed = 0.15 + (score / 100) * 0.08; // زيادة السرعة تدريجياً
                resetObstacle();
            }

            // فحص الاصطدام (إذا لم يقفز اللاعب في الوقت المناسب واصطدم بالعائق)
            if (
                Math.abs(obstacle.position.z - player.position.z) < 0.5 &&
                player.position.y < 0.2 // معيار الارتفاع عند القفز
            ) {
                gameOver();
                return;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function gameOver() {
            isPlaying = false;
            restartBtn.style.display = 'block';
        }

        jumpBtn.addEventListener('click', jump);
        restartBtn.addEventListener('click', startGame);

        init3D();
        startGame(); // تبدأ اللعبة فور الفتح
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
</body>

</html>
