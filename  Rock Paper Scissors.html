<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجر ورقة مقص - أونلاين 🎮</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .box { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0284c7; color: white; }
        .hidden { display: none !important; }
        .choices { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .choice-btn { font-size: 30px; padding: 15px; background: #334155; border: 2px solid #38bdf8; border-radius: 10px; cursor: pointer; }
        .choice-btn:hover { background: #475569; }
        .scoreboard { font-size: 18px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; background: #0f172a; padding: 10px; border-radius: 5px; border: 1px dashed #38bdf8; }
    </style>
</head>
<body>

<!-- نظام أكواد الغرف المُحقن أوتوماتيكياً -->
<div id="room-system-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 99999; display: flex; align-items: center; justify-content: center; font-family: Tahoma, sans-serif; color: white; direction: rtl;">
    <div style="background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #38bdf8;">
        <h3 style="color: #38bdf8; margin-top: 0;">غرفة الألعاب الذكية</h3>
        <input type="text" id="autoPlayerName" placeholder="اكتب اسمك هنا" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <button onclick="autoCreateRoom()" style="background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">إنشاء غرفة جديدة</button>
        <div id="autoCodeDisplay" style="color: #38bdf8; font-weight: bold; margin: 12px 0; font-size: 22px; letter-spacing: 2px;"></div>
        <input type="text" id="autoRoomCode" placeholder="أدخل كود الغرفة" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
        <button onclick="autoJoinRoom()" style="background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">دخول اللعبة</button>
    </div>
</div>

<script>
    // جلب الاسم والكود لو موجودين في الرابط مسبقاً
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const pName = urlParams.get('name');
        const pRoom = urlParams.get('room');
        if (pName) document.getElementById('autoPlayerName').value = decodeURIComponent(pName);
        if (pRoom) {
            document.getElementById('autoRoomCode').value = decodeURIComponent(pRoom);
            // إخفاء الشاشة فوراً والدخول لو الكود والاسم جاهزين
            if(pName) document.getElementById('room-system-overlay').style.display = 'none';
        }
    });

    function autoCreateRoom() {
        const name = document.getElementById('autoPlayerName').value.trim();
        if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('autoCodeDisplay').innerText = code;
        setTimeout(() => {
            document.getElementById('room-system-overlay').style.display = 'none';
        }, 2500);
    }

    function autoJoinRoom() {
        const name = document.getElementById('autoPlayerName').value.trim();
        const code = document.getElementById('autoRoomCode').value.trim();
        if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
        document.getElementById('room-system-overlay').style.display = 'none';
    }
</script>





    <h1>✂️ حجر ورقة مقص (أونلاين) 🪨</h1>

    <!-- شاشة إدخال الاسم وإنشاء الغرفة -->
    <div id="setupScreen" class="box">
        <p>أنشئ غرفة جديدة أو انضم لصاحبك!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." />
        <br>
        <button onclick="createRoom()">إنشاء غرفة ونسخ الرابط 🔗</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="box hidden">
        <h3 id="playersInfo" style="margin-top: 0;"></h3>
        
        <!-- لوحة النتائج -->
        <div class="scoreboard" id="scoreboardText">
            النتيجة: أنت (0) - (0) الخصم
        </div>

        <h2 id="statusText" style="font-size: 16px; color: #cbd5e1;">في انتظار انضمام اللاعب الثاني... ⏳</h2>

        <div id="playArea" class="hidden">
            <p>اختر حركتك:</p>
            <div class="choices" id="choicesContainer">
                <button class="choice-btn" onclick="makeChoice('حجر')">🪨</button>
                <button class="choice-btn" onclick="makeChoice('ورقة')">📄</button>
                <button class="choice-btn" onclick="makeChoice('مقص')">✂️</button>
            </div>
            <h2 id="resultText" style="margin-top: 15px; font-size: 18px; color: #38bdf8;"></h2>
            
            <!-- زر إعادة اللعب -->
            <button id="resetBtn" class="hidden" onclick="resetRound()" style="margin-top: 15px; background: #22c55e; color: white;">🔄 إعادة اللعب</button>
        </div>
    </div>

    <!-- مكتبة الاتصال PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let myName = "";
        let opponentName = "الخصم";
        let myChoice = "";
        let opponentChoice = "";
        
        let myScore = 0;
        let opponentScore = 0;

        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if(!myName) {
                alert("من فضلك اكتب اسمك الأول!");
                return;
            }

            peer = new Peer();

            peer.on('open', function(id) {
                let roomLink = window.location.origin + window.location.pathname + `?room=${id}&hostName=${encodeURIComponent(myName)}`;
                navigator.clipboard.writeText(roomLink);
                alert("تم نسخ رابط الغرفة! ابعته لصاحبك 🚀");
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "في انتظار انضمام الخصم... (تم نسخ اللينك)";
            });

            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');
        const hostName = urlParams.get('hostName');

        if(hostId) {
            window.addEventListener('load', () => {
                let name = prompt("أهلاً بك! اكتب اسمك للانضمام للعبة:");
                if(!name) return;
                myName = name;

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('statusText').innerText = "جاري الاتصال بصاحبك...";

                peer = new Peer();
                peer.on('open', function(id) {
                    conn = peer.connect(hostId);
                    conn.on('open', function() {
                        setupConnection();
                        conn.send({ type: 'join', name: myName });
                    });
                });
            });
        }

        function setupConnection() {
            document.getElementById('statusText').innerText = "متصل بنجاح! اختر حركتك 🎮";
            document.getElementById('playArea').classList.remove('hidden');

            conn.on('data', function(data) {
                if(data.type === 'join') {
                    opponentName = data.name;
                    updateUI();
                    conn.send({ type: 'welcome', name: hostName || "صاحبك" });
                } else if(data.type === 'welcome') {
                    opponentName = data.name;
                    updateUI();
                } else if(data.type === 'choice') {
                    opponentChoice = data.choice;
                    checkWinner();
                } else if(data.type === 'reset') {
                    executeReset();
                }
            });
        }

        function updateUI() {
            document.getElementById('playersInfo').innerText = `${myName} ⚔️ ${opponentName}`;
            updateScoreboard();
        }

        function updateScoreboard() {
            document.getElementById('scoreboardText').innerText = `النتيجة: ${myName} (${myScore}) - (${opponentScore}) ${opponentName}`;
        }

        function makeChoice(choice) {
            if (myChoice) return; 
            myChoice = choice;
            document.getElementById('statusText').innerText = `أنت اخترت (${choice}). في انتظار الخصم...`;
            
            document.querySelectorAll('.choice-btn').forEach(btn => btn.style.opacity = "0.5");

            conn.send({ type: 'choice', choice: choice });
            checkWinner();
        }

        function checkWinner() {
            if(myChoice && opponentChoice) {
                let res = "";
                if(myChoice === opponentChoice) {
                    res = "تعادل في هذه الجولة! 🤝";
                } else if(
                    (myChoice === 'حجر' && opponentChoice === 'مقص') ||
                    (myChoice === 'ورقة' && opponentChoice === 'حجر') ||
                    (myChoice === 'مقص' && opponentChoice === 'ورقة')
                ) {
                    res = `مبروك يا ${myName}، فزت الجولة! 🎉`;
                    myScore++;
                } else {
                    res = `خسرت الجولة للأسف يا ${myName}! 😢`;
                    opponentScore++;
                }

                updateScoreboard();
                document.getElementById('statusText').innerText = res;
                document.getElementById('resultText').innerText = `اختيارك: ${myChoice} | اختيار ${opponentName}: ${opponentChoice}`;
                
                document.getElementById('resetBtn').classList.remove('hidden');
            }
        }

        function resetRound() {
            conn.send({ type: 'reset' });
            executeReset();
        }

        function executeReset() {
            myChoice = "";
            opponentChoice = "";
            document.getElementById('statusText').innerText = "اختر حركتك للجولة الجديدة! 🎮";
            document.getElementById('resultText').innerText = "";
            document.getElementById('resetBtn').classList.add('hidden');
            
            document.querySelectorAll('.choice-btn').forEach(btn => btn.style.opacity = "1");
        }
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>

































</body>

</html>
