<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الطائر القفاز</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        canvas {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            max-width: 100%;
        }
        .instructions {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>الطائر القفاز</h1>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <div class="instructions">اضغط على الشاشة أو انقر للقفز!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let bird = {
            x: 50,
            y: 150,
            width: 24,
            height: 24,
            gravity: 0.35,
            lift: -7.0,
            velocity: 0
        };

        let pipes = [];
        let pipeWidth = 50;
        let pipeGap = 130;
        let frameCount = 0;
        let score = 0;
        let isGameOver = false;

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            isGameOver = false;
            loop();
        }

        function drawBird() {
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(bird.x + bird.width / 2, bird.y + bird.height / 2, bird.width / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPipes() {
            ctx.fillStyle = '#38bdf8';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });
        }

        function updatePipes() {
            if (frameCount % 90 === 0) {
                let minHeight = 50;
                let maxHeight = canvas.height - pipeGap - 50;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                let bottomHeight = canvas.height - topHeight - pipeGap;

                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: bottomHeight,
                    passed: false
                });
            }

            pipes.forEach(pipe => {
                pipe.x -= 2.5;

                // حساب النقاط
                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    score++;
                    pipe.passed = true;
                }

                // الاصطدام
                if (
                    bird.x < pipe.x + pipeWidth &&
                    bird.x + bird.width > pipe.x &&
                    (bird.y < pipe.top || bird.y + bird.height > canvas.height - pipe.bottom)
                ) {
                    isGameOver = true;
                }
            });

            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
        }

        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(`النقاط: ${score}`, canvas.width / 2, 40);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 28px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('انتهت اللعبة!', canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = '#f8fafc';
            ctx.font = '18px Segoe UI';
            ctx.fillText(`النتيجة النهائية: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = '#38bdf8';
            ctx.font = '15px Segoe UI';
            ctx.fillText('انقر لإعادة المحاولة', canvas.width / 2, canvas.height / 2 + 55);
        }

        function loop() {
            if (isGameOver) {
                drawGameOver();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
                isGameOver = true;
            }

            updatePipes();
            drawPipes();
            drawBird();
            drawScore();

            frameCount++;
            requestAnimationFrame(loop);
        }

        function jump() {
            if (isGameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') jump();
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        resetGame();
    </script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const smartBtn = document.createElement('button');
        smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
        smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
        
        smartBtn.onclick = function() {
            let roomUrl = window.location.href; 
            let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
            
            navigator.clipboard.writeText(smartLink).then(() => {
                alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك في الواتساب.");
            });
        };

        document.body.insertBefore(smartBtn, document.body.firstChild);
    });
</script>
</body>

</html>
