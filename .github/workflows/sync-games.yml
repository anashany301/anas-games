name: Auto Fetch & Verify Retro Games

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: python:3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Massive Game Catalog
        run: |
          python -c '
          import json
          import urllib.request

          print("جاري الاتصال بقواعد بيانات الألعاب الضخمة...")
          
          # جلب قائمة ألعاب مجانية ومرخصة للتشغيل الفوري من API موثوق
          api_url = "https://www.freetogame.com/api/games"
          
          discovered_games = []
          seen_titles = set()

          try:
              req = urllib.request.Request(
                  api_url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  games_data = json.loads(response.read().decode("utf-8"))
                  
                  for game in games_data:
                      title = game.get("title")
                      game_url = game.get("game_url") # أو رابط الـ embed المباشر للعبة
                      
                      if title and game_url:
                          clean_title = str(title).strip()
                          if clean_title not in seen_titles:
                              seen_titles.add(clean_title)
                              discovered_games.append({
                                  "title": clean_title,
                                  "embed_url": game_url
                              })
              
              print(تم بنجاح جلب {len(discovered_games)} لعبة مفلترة بدون تكرار!)
          except Exception as e:
              print(f"حدث خطأ أثناء الجلب: {e}")

          # احتياطي في حال فشل الاتصال المؤقت
          if not discovered_games:
              discovered_games = [
                  {"title": "Pac-Man Classic", "embed_url": "https://mamedev.org/"}
              ]

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(discovered_games, f, ensure_ascii=False, indent=4)
          '

      - name: Commit and Push Games Catalog
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add games.json
          git commit -m "Auto-update: massive verified games catalog" || echo "No changes"
          git push
