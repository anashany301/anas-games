name: Sync Embed Games Catalog

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Embed JSON Catalog
        run: |
          python -c '
          import json

          # قائمة ألعاب جاهزة بصيغة الـ Embed المباشر (أمثلة حقيقية لألعاب ويب ومحاكيات داعمة للإيمبيد)
          embed_games = [
              {"title": "Pac-Man (Retro)", "embed_url": "https://mamedev.org/"}, 
              {"title": "Classic Arcade Game", "embed_url": "https://archive.org/embed/arcade_roms_collection"}
          ]

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(embed_games, f, ensure_ascii=False, indent=4)
          print("Saved Embed games catalog successfully.")
          '

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add games.json || true
          git commit -m "Update Embed games catalog" || exit 0
          git push
