name: Auto Fetch & Verify Retro Games

on:
  schedule:
    - cron: '0 0 * * 1' # يعمل أوتوماتيكياً كل أسبوع للتحديث
  workflow_dispatch: # زرار للتشغيل اليدوي وقت ما تحب

jobs:
  fetch-games:
  # تعيين الصلاحيات اللازمة للتعديل والرفع على المستودع
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Advanced Auto-Scraper and Verifier
        run: |
          python -c '
          import json
          import urllib.request
          import urllib.parse
          import re

          print("بدء عملية البحث الذكي عن الألعاب وجلبها...")

          # قائمة بمصادر أرشيفية مفتوحة تحتوي على مئات الألعاب الجاهزة للإيمبيد والتشغيل
          sources = [
              {
                  "name": "Internet Archive Classic Arcade Collection",
                  "api": "https://archive.org/advancedsearch.php?q=collection:(arcade_roms)&fl[]=identifier&fl[]=title&rows=150&output=json"
              },
              {
                  "name": "Internet Archive Software Library Console Roms",
                  "api": "https://archive.org/advancedsearch.php?q=collection:(softwarelibrary_msdos_games OR collection:(nes_roms))&fl[]=identifier&fl[]=title&rows=150&output=json"
              }
          ]

          discovered_games = []
          seen_titles = set()

          for source in sources:
              try:
                  print(f"جاري البحث في مصدر: {source[\"name\"]}")
                  req = urllib.request.Request(
                      source["api"],
                      headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      docs = data.get("response", {}).get("docs", [])
                      
                      for doc in docs:
                          identifier = doc.get("identifier")
                          title = doc.get("title")
                          
                          if identifier and title:
                              # تنظيف العنوان وتجنب التكرار
                              clean_title = str(title).strip()
                              if clean_title not in seen_titles:
                                  seen_titles.add(clean_title)
                                  # بناء رابط الـ Embed المباشر الخاص بالأرشيف
                                  embed_url = f"https://archive.org/embed/{identifier}"
                                  
                                  discovered_games.append({
                                      "title": clean_title,
                                      "embed_url": embed_url
                                  })
              except Exception as e:
                  print(f"خطأ أثناء جلب البيانات من {source[\"name\"]}: {e}")

          # إذا فشل الجلب لأي سبب، نضع ألعاب أساسية مضمونة لكي لا يكون الملف فارغاً
          if not discovered_games:
              print("تنبيه: لم يتم العثور على ألعاب كافية، جاري إدراج الألعاب الافتراضية...")
              discovered_games = [
                  {"title": "Pac-Man Classic", "embed_url": "https://mamedev.org/"},
                  {"title": "Internet Archive Arcade", "embed_url": "https://archive.org/embed/arcade_roms_collection"}
              ]

          # حفظ النتيجة النهائية في ملف games.json
          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(discovered_games, f, ensure_ascii=False, indent=4)
          
          print(f"تم بنجاح جلب وتوليد {len(discovered_games)} لعبة في ملف games.json!")
          '

      - name: Commit and Push Games Catalog
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add games.json
          git commit -m "Auto-update: fetched latest retro games catalog" || exit 0
          git push
