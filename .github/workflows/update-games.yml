name: Clean All Unwanted Buttons

on:
  push:
    branches:
      - main

jobs:
  clean-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Remove Smart Button from Single Games
        run: |
          python3 - << 'EOF'
          import os
          import re

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  
                  # هل اللعبة دي جماعية فعلاً؟
                  has_room_btn = 'إنشاء غرفة جديدة' in content or 'انشاء غرفة جديدة' in content or 'create room' in content_lower
                  has_tech = 'peerjs' in content_lower or 'socket.io' in content_lower
                  is_multi = has_room_btn or has_tech

                  # لو اللعبة فردية (مش جماعية)، امسح منها أي كود للزرار الذكي ده تماماً
                  if not is_multi:
                      # مسح أي سكريبت أو زرار له علاقة بالنسخ الذكي
                      content = re.sub(r'<script.*?>.*?smartCopyBtn.*?</script>', '', content, flags=re.DOTALL)
                      content = re.sub(r'<script.*?>.*?نسخ رابط ذكي.*?</script>', '', content, flags=re.DOTALL)
                      content = re.sub(r'<button[^>]*id="smartCopyBtn"[^>]*>.*?</button>', '', content, flags=re.DOTALL)
                      
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"🧹 تم تنظيف اللعبة الفردية وحذف الزرار منها: {filename}")
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Remove smart copy button from all single games" && git push)
