name: Ultimate Fix for Multiplayer Detection

on:
  push:
    branches:
      - main

jobs:
  update-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Ultimate Detector & Cleaner
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json

          smart_button_code = """<script>
              window.addEventListener('DOMContentLoaded', () => {
                  if (document.getElementById('smartCopyBtn')) return;
                  const smartBtn = document.createElement('button');
                  smartBtn.id = 'smartCopyBtn';
                  smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
                  smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
                  
                  smartBtn.onclick = function() {
                      let roomUrl = window.location.href; 
                      let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
                      
                      navigator.clipboard.writeText(smartLink).then(() => {
                          alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك.");
                      });
                  };

                  document.body.insertBefore(smartBtn, document.body.firstChild);
              });
          </script>"""

          multi_games_list = []

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  
                  # فحص شامل وصريح للألعاب الجماعية بناءً على كلامك
                  has_peerjs = 'peerjs' in content_lower
                  has_socket = 'socket.io' in content_lower
                  has_room_text = 'إنشاء غرفة' in content or 'انشاء غرفة' in content or 'create room' in content_lower
                  has_copy_text = 'نسخ الرابط' in content or 'copy link' in content_lower

                  # اللعبة تعتبر جماعية لو بتستخدم تقنية جماعية أو فيها أزرار الغرف والنسخ
                  is_multi = has_peerjs or has_socket or (has_room_text and has_copy_text)

                  if is_multi:
                      clean_name = filename.replace('.html', '').lower().strip()
                      multi_games_list.append(clean_name)
                      print(f"✅ لعبة جماعية مؤكدة: {filename} (PeerJS: {has_peerjs}, Socket: {has_socket}, RoomText: {has_room_text})")
                      
                      # وضع زرار النسخ الذكي فوق لو مش موجود
                      if "نسخ رابط ذكي للتطبيق" not in content and "smartCopyBtn" not in content:
                          if "</body>" in content:
                              content = content.replace("</body>", smart_button_code + "\n</body>")
                              with open(filename, 'w', encoding='utf-8') as f:
                                  f.write(content)
                  else:
                      print(f"❌ لعبة فردية: {filename}")
                      # تنظيف وحذف زرار النسخ الذكي لو اللعبة فردية بالخطأ
                      if "نسخ رابط ذكي للتطبيق" in content or "smartCopyBtn" in content:
                          content = re.sub(r'<script>.*?نسخ رابط ذكي للتطبيق.*?</script>', '', content, flags=r.DOTALL)
                          with open(filename, 'w', encoding='utf-8') as f:
                              f.write(content)
                              print(f"🧹 تم تنظيف وإزالة الزرار من: {filename}")

          print("📋 القائمة النهائية للألعاب الجماعية:", multi_games_list)

          # تحديث ملف index.html أوتوماتيك
          if os.path.exists('index.html'):
              with open('index.html', 'r', encoding='utf-8') as f:
                  index_content = f.read()
              
              formatted_list = json.dumps(multi_games_list)
              pattern = r'const\s+multiGames\s*=\s*\[.*?\];'
              new_array_str = f'const multiGames = {formatted_list};'
              
              if re.search(pattern, index_content):
                  index_content = re.sub(pattern, new_array_str, index_content)
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(index_content)
                  print("✨ تم تحديث index.html بنجاح بالأسماء الجديدة!")
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Ultimate fix for multiplayer classification and button cleanup" && git push)
