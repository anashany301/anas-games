name: Auto Clean Multiplayer Box

on:
  push:
    branches:
      - main

jobs:
  clean-multiplayer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Cleaner Script
        run: |
          python3 - << 'EOF'
          import os
          import re

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # مسح أي صندوق جماعي قديم تم حقنه سابقاً جوه ملف اللعبة
                  content = re.sub(r'<!-- صندوق اللعب الجماعي.*?</script>', '', content, flags=re.DOTALL)
                  content = re.sub(r'<!-- صندوق اللعب الجماعي الجديد.*?</script>', '', content, flags=re.DOTALL)

                  with open(filename, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"🧹 تم تنظيف اللعبة من أي صناديق قديمة: {filename}")
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Remove old injected boxes from games" && git push)
