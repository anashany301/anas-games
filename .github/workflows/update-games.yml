name: Auto Detect and Update Multiplayer Games

on:
  push:
    branches:
      - main

jobs:
  update-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Auto Detection & Smart Button Injection
        run: |
          python3 - << 'EOF'
          import os
          import json

          smart_button_code = """
          <script>
              window.addEventListener('DOMContentLoaded', () => {
                  const smartBtn = document.createElement('button');
                  smartBtn.innerHTML = "📋 نسخ رابط ذكي للتطبيق";
                  smartBtn.style.cssText = "display: block; margin: 15px auto; padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999; position: relative;";
                  
                  smartBtn.onclick = function() {
                      let roomUrl = window.location.href; 
                      let smartLink = "https://anas-games-omega.vercel.app/multiplayer-helper.html?url=" + encodeURIComponent(roomUrl);
                      
                      navigator.clipboard.writeText(smartLink).then(() => {
                          alert("تم نسخ الرابط الذكي بنجاح! 🚀 ابعته لصاحبك.");
                      });
                  };

                  document.body.insertBefore(smartBtn, document.body.firstChild);
              });
          </script>
          </body>
          """

          # الكلمات المفتاحية اللي لو لقناها في أي لعبة نعرف فوراً إنها جماعية
          multi_keywords = ['createroom', 'joingame', 'room_id', 'room', 'multiplayer', 'socket.io', 'peerjs', 'نسخ رابط ذكي']

          multi_games_list = []

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  is_multi = any(kw in content_lower for kw in multi_keywords)

                  if is_multi:
                      multi_games_list.append(filename.replace('.html', '').lower())
                      # إضافة زرار النسخ الذكي لو مش موجود
                      if "نسخ رابط ذكي للتطبيق" not in content:
                          if "</body>" in content:
                              new_content = content.replace("</body>", smart_button_code)
                              with open(filename, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              print(f"تم حقن زرار النسخ الذكي في اللعبة الجماعية: {filename}")

          print("الألعاب الجماعية المكتشفة:", multi_games_list)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto detect multiplayer games and inject smart button" && git push)
