name: Auto Inject Smart Multiplayer Box

on:
  push:
    branches:
      - main

jobs:
  inject-box:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Auto Injector
        run: |
          python3 - << 'EOF'
          import os
          import re

          # كود صندوق كتابة الاسم وزر النسخ الذكي الموجه لتطبيق الحاوية
          multiplayer_ui = """
          <!-- صندوق اللعب الجماعي الذكي الأوتوماتيك -->
          <div id="multiplayer-box" style="background: #1e293b; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 320px; border: 1px solid #38bdf8; text-align: center; font-family: sans-serif; z-index: 9999; position: relative;">
              <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #38bdf8;">👥 غرفة اللعب الجماعي</label>
              <input type="text" id="playerNameInput" placeholder="اكتب اسمك هنا..." style="width: 80%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; text-align: center; background: #0f172a; color: white; font-size: 14px;">
              <button id="smartCopyBtn" style="display: block; width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;">
                  📋 نسخ رابط الحاوية الذكي
              </button>
          </div>

          <script>
              window.addEventListener('DOMContentLoaded', () => {
                  if (document.getElementById('smartCopyBtnAdded')) return;
                  
                  // لو البوكس مش موجود أصلاً في الصفحة، بنحقنه فوق خالص
                  if (!document.getElementById('multiplayer-box')) {
                      const container = document.createElement('div');
                      container.id = 'smartCopyBtnAdded';
                      container.innerHTML = `
                          <div style="background: #1e293b; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 320px; border: 1px solid #38bdf8; text-align: center; font-family: sans-serif;">
                              <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #38bdf8;">👥 غرفة اللعب الجماعي</label>
                              <input type="text" id="playerNameInput" placeholder="اكتب اسمك هنا..." style="width: 80%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; text-align: center; background: #0f172a; color: white; font-size: 14px;">
                              <button id="smartCopyBtn" style="display: block; width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;">
                                  📋 نسخ رابط الحاوية الذكي
                              </button>
                          </div>
                      `;
                      document.body.insertBefore(container, document.body.firstChild);
                  }

                  document.getElementById('smartCopyBtn').addEventListener('click', function() {
                      const playerName = document.getElementById('playerNameInput').value.trim();
                      if (!playerName) {
                          alert("من فضلك اكتب اسمك الأول يا بطل! 🎮");
                          document.getElementById('playerNameInput').focus();
                          return;
                      }

                      let currentGameUrl = window.location.href.split('?')[0];
                      let helperUrl = "https://anas-games-omega.vercel.app/multiplayer-helper.html";
                      let finalDeepLink = `${helperUrl}?url=${encodeURIComponent(currentGameUrl)}&name=${encodeURIComponent(playerName)}`;

                      navigator.clipboard.writeText(finalDeepLink).then(() => {
                          alert(`تم نسخ الرابط الذكي يا ${playerName}! 🚀 ابعته لصاحبك هيفتح معه الحاوية فوراً.`);
                      });
                  });
              });
          </script>
          """

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  
                  # شروط اللعبة الجماعية
                  has_room_btn = 'إنشاء غرفة جديدة' in content or 'انشاء غرفة جديدة' in content or 'create room' in content_lower
                  has_tech = 'peerjs' in content_lower or 'socket.io' in content_lower
                  is_multi = has_room_btn or has_tech

                  # تنظيف أي كود قديم للزرار عشان متكررش
                  content = re.sub(r'<!-- صندوق اللعب الجماعي الذكي الأوتوماتيك -->.*?</script>', '', content, flags=r.DOTALL)

                  if is_multi:
                      # لو لعبة جماعية، احقن الكود أوتوماتيك قبل نهاية الـ body
                      if "</body>" in content:
                          content = content.replace("</body>", multiplayer_ui + "\n</body>")
                          with open(filename, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f"✨ تم حقن صندوق اللعب الجماعي أوتوماتيك في: {filename}")
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto inject multiplayer UI box via GitHub Action" && git push)
