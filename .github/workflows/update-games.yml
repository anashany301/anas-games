name: Auto Inject Room Codes System

on:
  push:
    branches:
      - main

jobs:
  inject-rooms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Injector Script
        run: |
          python3 - << 'EOF'
          import os
          import re

          # كود نظام أكواد الغرف الكامل ليتم حقنه في ألعاب اللعب الجماعي أوتوماتيك
          room_system_code = """
          <!-- نظام أكواد الغرف المُحقن أوتوماتيكياً -->
          <div id="room-system-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 99999; display: flex; align-items: center; justify-content: center; font-family: Tahoma, sans-serif; color: white; direction: rtl;">
              <div style="background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #38bdf8;">
                  <h3 style="color: #38bdf8; margin-top: 0;">غرفة الألعاب الذكية</h3>
                  <input type="text" id="autoPlayerName" placeholder="اكتب اسمك هنا" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
                  <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
                  <button onclick="autoCreateRoom()" style="background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">إنشاء غرفة جديدة</button>
                  <div id="autoCodeDisplay" style="color: #38bdf8; font-weight: bold; margin: 12px 0; font-size: 22px; letter-spacing: 2px;"></div>
                  <input type="text" id="autoRoomCode" placeholder="أدخل كود الغرفة" style="width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; text-align: center; outline: none;">
                  <button onclick="autoJoinRoom()" style="background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 95%; margin-top: 5px; font-weight: bold;">دخول اللعبة</button>
              </div>
          </div>

          <script>
              // جلب الاسم والكود لو موجودين في الرابط مسبقاً
              window.addEventListener('DOMContentLoaded', () => {
                  const urlParams = new URLSearchParams(window.location.search);
                  const pName = urlParams.get('name');
                  const pRoom = urlParams.get('room');
                  if (pName) document.getElementById('autoPlayerName').value = decodeURIComponent(pName);
                  if (pRoom) {
                      document.getElementById('autoRoomCode').value = decodeURIComponent(pRoom);
                      // إخفاء الشاشة فوراً والدخول لو الكود والاسم جاهزين
                      if(pName) document.getElementById('room-system-overlay').style.display = 'none';
                  }
              });

              function autoCreateRoom() {
                  const name = document.getElementById('autoPlayerName').value.trim();
                  if(!name) { alert('من فضلك اكتب اسمك الأول!'); return; }
                  const code = Math.random().toString(36).substring(2, 6).toUpperCase();
                  document.getElementById('autoCodeDisplay').innerText = code;
                  setTimeout(() => {
                      document.getElementById('room-system-overlay').style.display = 'none';
                  }, 2500);
              }

              function autoJoinRoom() {
                  const name = document.getElementById('autoPlayerName').value.trim();
                  const code = document.getElementById('autoRoomCode').value.trim();
                  if(!name || !code) { alert('اكتب اسمك وكود الغرفة من فضلك!'); return; }
                  document.getElementById('room-system-overlay').style.display = 'none';
              }
          </script>
          """

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  has_room_btn = 'إنشاء غرفة جديدة' in content or 'انشاء غرفة جديدة' in content or 'create room' in content_lower
                  has_tech = 'peerjs' in content_lower or 'socket.io' in content_lower
                  is_multi = has_room_btn or has_tech

                  # تنظيف أي كود أو واجهة قديمة تماماً
                  content = re.sub(r'<!-- نظام أكواد الغرف المُحقن أوتوماتيكياً -->.*?</script>', '', content, flags=re.DOTALL)
                  content = re.sub(r'<!-- صندوق اللعب الجماعي.*?</script>', '', content, flags=re.DOTALL)

                  if is_multi:
                      if "<body>" in content:
                          content = content.replace("<body>", "<body>\n" + room_system_code)
                          with open(filename, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f"✨ تم حقن نظام الغرف الكامل في: {filename}")
                  else:
                      with open(filename, 'w', encoding='utf-8') as f:
                              f.write(content)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto inject room system and clean old UI" && git push)
