name: Auto Inject Multiplayer Box

on:
  push:
    branches:
      - main

jobs:
  inject-multiplayer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Injector Script
        run: |
          python3 - << 'EOF'
          import os
          import re

          # كود صندوق اللعب الجماعي الجديد (يعتمد على الحاوية والأكواد)
          multiplayer_box_code = """
          <!-- صندوق اللعب الجماعي الجديد -->
          <div id="multiplayer-box" style="background: #1e293b; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 320px; border: 1px solid #38bdf8; text-align: center; font-family: sans-serif; z-index: 9999; position: relative;">
              <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #38bdf8;">👥 غرفة اللعب الجماعي</label>
              <input type="text" id="playerNameInput" placeholder="اكتب اسمك هنا..." style="width: 80%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; text-align: center; background: #0f172a; color: white; font-size: 14px;">
              <button id="smartCopyBtn" style="display: block; width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;">
                  🚀 الانتقال لغرفة الحاوية
              </button>
          </div>

          <script>
              document.addEventListener('DOMContentLoaded', () => {
                  const copyBtn = document.getElementById('smartCopyBtn');
                  if (!copyBtn) return;

                  copyBtn.addEventListener('click', function() {
                      const playerName = document.getElementById('playerNameInput').value.trim();
                      if (!playerName) {
                          alert("من فضلك اكتب اسمك الأول يا بطل! 🎮");
                          document.getElementById('playerNameInput').focus();
                          return;
                      }

                      let currentGameFile = window.location.pathname.split('/').pop();
                      let helperBaseUrl = "https://anas-games-omega.vercel.app/multiplayer-helper.html";
                      let directHelperLink = `${helperBaseUrl}?game=${currentGameFile}&name=${encodeURIComponent(playerName)}`;

                      window.location.href = directHelperLink;
                  });
              });
          </script>
          """

          for filename in os.listdir('.'):
              if filename.endswith('.html') and filename != 'index.html' and filename != 'multiplayer-helper.html':
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  content_lower = content.lower()
                  
                  has_room_btn = 'إنشاء غرفة جديدة' in content or 'انشاء غرفة جديدة' in content or 'create room' in content_lower
                  has_tech = 'peerjs' in content_lower or 'socket.io' in content_lower
                  is_multi = has_room_btn or has_tech

                  # تنظيف أي كود قديم للنسخ الذكي
                  content = re.sub(r'<!-- صندوق اللعب الجماعي الذكي الأوتوماتيك -->.*?</script>', '', content, flags=re.DOTALL)
                  content = re.sub(r'<!-- صندوق اللعب الجماعي الجديد -->.*?</script>', '', content, flags=re.DOTALL)

                  if is_multi:
                      if "</body>" in content:
                          content = content.replace("</body>", multiplayer_box_code + "\n</body>")
                          with open(filename, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f"✨ تم تحديث وحقن الصندوق الجديد في: {filename}")
                  else:
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(content)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update multiplayer box injector to use helper container" && git push)
