<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حزر الرقم - Anas Games</title>
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            width: 80%;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background: #2E7D32;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #388E3C; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-card">
        <h2>🎮 حزر الرقم</h2>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">اختر رقماً بين 1 و 10</p>
        <input type="number" id="userGuess" min="1" max="10" placeholder="اكتب رقمك هنا">
        <br>
        <button onclick="checkGuess()">تحقق</button>
        <div id="message"></div>
    </div>

    <script>
        const randomNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            const userVal = parseInt(document.getElementById('userGuess').value);
            const msg = document.getElementById('message');

            if (!userVal) {
                msg.style.color = "#f44336";
                msg.textContent = "الرجاء إدخال رقم صحيح!";
                return;
            }

            if (userVal === randomNumber) {
                msg.style.color = "#4CAF50";
                msg.textContent = "🎉 بطل! لقد فزت وصبت الرقم الصحيح!";
            } else if (userVal > randomNumber) {
                msg.style.color = "#FF9800";
                msg.textContent = "📉 الرقم كبير جداً، حاول برقم أصغر!";
            } else {
                msg.style.color = "#FF9800";
                msg.textContent = "📈 الرقم صغير جداً، حاول برقم أكبر!";
            }
        }
    </script>

</body>
</html>
